<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390px QA frame</title>
<style>
  html,body{margin:0;padding:0;background:#cfd6dd;font:12px/1.4 system-ui}
  .wrap{display:flex;gap:16px;padding:12px}
  iframe{width:390px;height:844px;border:0;display:block;background:#fff;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div class="wrap"><iframe id="f" src="../"></iframe></div>
<script>
  var p = new URLSearchParams(location.search);
  var u = p.get('u');
  var f = document.getElementById('f');
  if (p.get('h')) f.style.height = p.get('h') + 'px';
  if (u) f.src = u;
  var to = p.get('to');
  if (to) {
    setInterval(function () {
      try {
        var el = f.contentWindow.document.querySelector(to);
        if (el) el.scrollIntoView({ block: p.get('block') || 'center' });
      } catch (e) {}
    }, 700);
  }
</script>
</body>
</html>
