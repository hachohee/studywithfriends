<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF8A5B">
<meta name="description" content="초1 친구 5명이 함께 쓰는 공동 학습 웹앱 — 수학·영어·한국사·위인·시사상식·한자 비문학·예쁘게 말하기">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 반 공부방">
<title>우리 반 공부방 · 초1 공동학습</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23FF8A5B'/%3E%3Cpath d='M32 13l5.9 11.9 13.1 1.9-9.5 9.2 2.2 13.1L32 42.9 19.3 49.1l2.2-13.1-9.5-9.2 13.1-1.9z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#FFF7EF; --ink:#2B2340; --muted:#7C7590; --line:#F0E6DA;
    --card:#FFFFFF; --brand:#FF7A45; --brand2:#FF5E86;
    --ok:#1FA97A; --ok-soft:#E4F7EF; --warn:#EF9A1E;
    --shadow:0 8px 22px rgba(94,66,48,.09), 0 1px 3px rgba(94,66,48,.06);
    --shadow-sm:0 2px 8px rgba(94,66,48,.07);
    --r:20px;
  }
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{
    font-family:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(110% 46% at 50% -8%, #FFE3C9 0%, rgba(255,227,201,0) 62%),
      radial-gradient(80% 40% at 100% 4%, #FFE9F0 0%, rgba(255,233,240,0) 60%),
      linear-gradient(180deg,#FFF9F3 0%, #FDF1E6 100%);
    background-attachment:fixed;
    min-height:100vh;
    font-size:16px; line-height:1.5;
    letter-spacing:-.01em;
  }
  [hidden]{display:none !important}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  button:active{transform:scale(.97)}
  input,select{font:inherit;color:inherit}
  .app{
    max-width:430px; margin:0 auto; min-height:100vh; position:relative;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }

  /* ── top bar ── */
  .topbar{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:rgba(255,249,243,.86);
    backdrop-filter:saturate(1.4) blur(14px);
    -webkit-backdrop-filter:saturate(1.4) blur(14px);
    border-bottom:1px solid rgba(240,230,218,.75);
  }
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .brand-emoji{
    width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:21px;
    background:linear-gradient(135deg,#FFB26B,#FF7A45);box-shadow:0 4px 10px rgba(255,122,69,.3);
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .brand-text b{font-size:16.5px;letter-spacing:-.03em}
  .brand-text small{font-size:11px;color:var(--muted);font-weight:600}
  .stamp-pill{
    display:flex;align-items:center;gap:5px;padding:8px 13px;border-radius:999px;
    background:#fff;box-shadow:var(--shadow-sm);font-size:14px;font-weight:800;color:#B4631B;
    border:1px solid #FBE7D6;
  }
  .stamp-pill b{font-size:15px}

  /* ── friend strip ── */
  .friendstrip{
    display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .friendstrip::-webkit-scrollbar{display:none}
  .friend{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;
    width:62px;padding:8px 4px 7px;border-radius:18px;background:#fff;
    border:1.5px solid #F4EADF;box-shadow:var(--shadow-sm);position:relative;
    transition:border-color .15s, transform .15s;
  }
  .friend:active{transform:scale(.96)}
  .friend .friend-ava{font-size:24px;line-height:1.1}
  .friend .friend-name{
    font-size:11.5px;font-weight:700;color:#5C5470;max-width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .friend.on{border-color:var(--brand);background:linear-gradient(180deg,#FFF4EC,#FFFFFF);box-shadow:0 6px 14px rgba(255,122,69,.18)}
  .friend.on .friend-name{color:#C4511E}
  .friend .friend-dot{
    position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;
    background:#E4DED4;
  }
  .friend .friend-dot.on{background:var(--ok);box-shadow:0 0 0 2px #fff inset}
  .strip-hint{font-size:11.5px;color:var(--muted);padding:0 18px 2px;font-weight:600}

  /* ── layout ── */
  main{padding:10px 16px 8px}
  .view{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h2.page-title{font-size:20px;margin:6px 0 4px;letter-spacing:-.035em}
  .page-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;font-weight:600}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid #F7EEE4}

  /* ── home ── */
  .hero{
    position:relative;overflow:hidden;border-radius:26px;padding:20px 18px;
    background:linear-gradient(135deg,#FF9C63 0%,#FF7A45 45%,#FF6B8A 100%);
    color:#fff;box-shadow:0 14px 26px rgba(255,122,69,.28);
  }
  .hero::after{
    content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;
    background:rgba(255,255,255,.18);
  }
  .hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative}
  .hero-date{font-size:12px;font-weight:700;opacity:.95;background:rgba(255,255,255,.22);padding:5px 11px;border-radius:999px}
  .hero-hi{font-size:19px;font-weight:800;margin:12px 0 2px;letter-spacing:-.03em;position:relative}
  .hero-sub{font-size:12.5px;opacity:.94;font-weight:600;position:relative}
  .hero-stats{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap}
  .hero-stat{background:rgba(255,255,255,.9);color:#B0441A;border-radius:14px;padding:7px 12px;font-size:12.5px;font-weight:800}
  .hero-stat em{font-style:normal;font-size:15px;margin-right:2px}

  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 9px}
  .sec-head h3{font-size:15px;margin:0;letter-spacing:-.03em}
  .sec-head .more{font-size:12px;color:var(--brand);font-weight:800;padding:11px 8px;margin:-11px -8px -11px 0;border-radius:10px}

  .enq{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px;
    box-shadow:var(--shadow-sm);border:1px solid #EDF1FF;
  }
  .enq .q-emoji{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:#EEF3FF;flex:0 0 auto}
  .enq .q-body{flex:1;min-width:0;display:block}
  .enq .q-en{display:block;font-size:16px;font-weight:800;color:#27407A;letter-spacing:-.01em;line-height:1.3}
  .enq .q-ko{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
  .icon-btn{
    width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:18px;
    background:#F2F5FF;color:#3B5BC0;flex:0 0 auto;
  }
  .icon-btn:active{background:#E4EBFF}

  .subj-grid{display:flex;flex-direction:column;gap:10px}
  .subj{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:13px 14px;
    box-shadow:var(--shadow-sm);border:1px solid #F6EEE5;text-align:left;width:100%;
    transition:transform .12s;
  }
  .subj:active{transform:scale(.985)}
  .subj .s-ico{
    width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;flex:0 0 auto;
    background:var(--soft);
  }
  .subj .s-body{flex:1;min-width:0}
  .subj .s-name{font-size:15.5px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:5px}
  .subj .s-line{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
  .subj .s-right{text-align:right;flex:0 0 auto}
  .dots{display:flex;gap:3px;justify-content:flex-end}
  .dots i{width:8px;height:8px;border-radius:50%;background:#EDE6DC;display:block}
  .dots i.on{background:var(--dotcolor,#FF7A45)}
  .s-count{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:4px}

  /* ── subject detail ── */
  .detail-head{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow-sm);border:1px solid #F6EEE5;display:flex;align-items:center;gap:12px}
  .detail-head .d-ico{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:27px;background:var(--soft)}
  .detail-head h2{font-size:18px;margin:0;letter-spacing:-.03em}
  .detail-head p{margin:3px 0 0;font-size:12px;color:var(--muted);font-weight:600;line-height:1.4}
  .back-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:#F6F1EA;margin-bottom:12px}
  .seg2{display:flex;gap:6px;background:#F4EDE5;border-radius:15px;padding:4px;margin:14px 0 4px}
  .seg2 button{flex:1;padding:9px 0;border-radius:12px;font-size:13.5px;font-weight:800;color:#8A8199}
  .seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(94,66,48,.1)}

  .keyline{
    margin-top:12px;padding:14px 16px;border-radius:18px;font-size:14px;font-weight:800;line-height:1.45;
    background:var(--soft);color:var(--deep);border:1px dashed var(--line2);
  }
  .keyline .k-label{display:block;font-size:10.5px;letter-spacing:.04em;font-weight:800;opacity:.65;margin-bottom:4px}

  .story{display:flex;gap:11px;background:#fff;border-radius:18px;padding:13px;box-shadow:var(--shadow-sm);border:1px solid #F6EEE5;margin-top:10px}
  .story .st-e{font-size:22px;line-height:1.2}
  .story .st-t{font-size:13.5px;font-weight:800;margin-bottom:3px}
  .story .st-d{font-size:12.5px;color:#5E566F;line-height:1.5;font-weight:500}

  .yt-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .yt{
    display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:11px 13px;
    box-shadow:var(--shadow-sm);border:1px solid #F6EEE5;text-decoration:none;color:var(--ink);
  }
  .yt .yt-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#FFEDEC;font-size:15px;flex:0 0 auto}
  .yt.site .yt-ico{background:#E8F4FF}
  .yt .yt-t{flex:1;font-size:13px;font-weight:700;line-height:1.35}
  .yt .yt-d{display:block;font-size:10.5px;font-weight:600;color:#9A9184;margin-top:1px}
  .yt .yt-go{color:#C9BFB2;font-size:14px}

  /* ── english ── */
  .eng-ctrl{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow-sm);border:1px solid #EDF1FF;margin-top:10px}
  .seg-rate{display:flex;gap:6px;background:#F1F4FC;border-radius:12px;padding:4px}
  .seg-rate button{flex:1;padding:8px 0;border-radius:9px;font-size:12.5px;font-weight:800;color:#6C7896}
  .seg-rate button.on{background:#fff;color:#2A4694;box-shadow:0 1px 4px rgba(42,70,148,.14)}
  .play-row{display:flex;gap:6px;margin-top:8px}
  .play-row button{
    flex:1;padding:9px 4px;border-radius:11px;font-size:11.5px;font-weight:800;
    background:#F7F9FF;color:#3B5BC0;border:1px solid #E7EDFF;line-height:1.2;
  }
  .play-row button.stop{flex:0 0 46px;background:#FFF4F1;color:#C4511E;border-color:#FFE2D7}
  .step-chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
  .step-chips::-webkit-scrollbar{display:none}
  .step-chips button{
    flex:0 0 auto;padding:8px 13px;border-radius:999px;font-size:12px;font-weight:800;
    background:#fff;color:#7A7390;border:1.5px solid #EFE7DC;
  }
  .step-chips button.on{background:#2A4694;color:#fff;border-color:#2A4694;box-shadow:0 4px 10px rgba(42,70,148,.22)}
  .step-title{font-size:12px;font-weight:800;color:#6C7896;margin:14px 2px 6px;letter-spacing:.01em}

  .sent{
    background:#fff;border-radius:18px;padding:13px 14px;box-shadow:var(--shadow-sm);
    border:1px solid #EDF1FF;margin-bottom:9px;transition:box-shadow .2s,border-color .2s;
  }
  .sent.playing{border-color:#4C7DF0;box-shadow:0 0 0 3px rgba(76,125,240,.16), 0 8px 18px rgba(76,125,240,.14)}
  .sent.done{border-color:#BFE9D6;background:linear-gradient(180deg,#F7FDFA,#fff)}
  .sent-head{display:flex;align-items:flex-start;gap:9px}
  .sent-e{font-size:20px;line-height:1.3}
  .sent-main{flex:1;min-width:0}
  .sent-en{font-size:16.5px;font-weight:800;color:#1E3A78;letter-spacing:-.01em;line-height:1.3}
  .sent-ko{font-size:12.5px;color:#66607A;font-weight:600;margin-top:2px}
  .sent-tip{font-size:11.5px;color:#8B93AF;font-weight:600;margin-top:5px;background:#F6F8FF;border-radius:9px;padding:5px 8px;display:inline-block}
  .sent-btns{display:flex;gap:6px;margin-top:10px}
  .sent-btns button{
    flex:1;padding:9px 0;border-radius:12px;font-size:12.5px;font-weight:800;
    background:#EEF3FF;color:#2F55BE;
  }
  .sent-btns button.mic{background:#FFF1F4;color:#C2334F}
  .sent-btns button:disabled{opacity:.5}
  .sent-stamp{font-size:11px;font-weight:800;color:var(--ok);margin-top:8px;display:none}
  .sent.done .sent-stamp{display:block}

  .practice{
    margin-top:10px;border-radius:14px;background:#FFF7FA;border:1px dashed #FFD3DE;padding:12px;
  }
  .practice .p-t{font-size:12.5px;font-weight:800;color:#B0314B;margin-bottom:6px}
  .practice .p-d{font-size:11.5px;color:#8A6A75;font-weight:600;line-height:1.45}
  .practice .live{
    margin-top:8px;font-size:13px;font-weight:700;color:#3A3050;background:#fff;border-radius:10px;
    padding:8px 10px;min-height:36px;border:1px solid #FFE3EA;
  }
  .practice .p-btns{display:flex;gap:6px;margin-top:9px}
  .practice .p-btns button{
    flex:1;padding:9px 0;border-radius:11px;font-size:12px;font-weight:800;background:#fff;color:#B0314B;border:1px solid #FFD3DE;
  }
  .practice .p-btns button.primary{background:#FF6B8A;color:#fff;border-color:#FF6B8A}
  .countdown{font-size:34px;font-weight:900;color:#FF6B8A;text-align:center;line-height:1.1;letter-spacing:-.02em}
  .countdown small{display:block;font-size:11px;color:#A08E96;font-weight:700;margin-top:2px;letter-spacing:0}

  /* ── quiz ── */
  .quiz-top{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}
  .quiz-dots{display:flex;gap:5px}
  .quiz-dots i{width:26px;height:6px;border-radius:99px;background:#EDE6DC;display:block;transition:background .2s}
  .quiz-dots i.now{background:#FFB08A}
  .quiz-dots i.ok{background:var(--ok)}
  .quiz-dots i.no{background:#E58AA0}
  .quiz-pill{font-size:11.5px;font-weight:800;color:#B4631B;background:#FFF1E6;padding:5px 10px;border-radius:999px}
  .qcard{background:#fff;border-radius:22px;padding:18px 16px 16px;box-shadow:var(--shadow);border:1px solid #F7EEE4}
  .qnum{font-size:11.5px;font-weight:800;color:#B7AFA2;letter-spacing:.08em}
  .qtext{font-size:17px;font-weight:800;line-height:1.45;margin:8px 0 16px;letter-spacing:-.02em}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:15px;background:#FAF6F1;
    border:2px solid transparent;font-size:14.5px;font-weight:700;text-align:left;line-height:1.35;color:#3C3450;
  }
  .opt .num{
    width:22px;height:22px;border-radius:50%;background:#fff;color:#9A9184;font-size:11px;font-weight:900;
    display:grid;place-items:center;flex:0 0 auto;border:1.5px solid #E9E0D4;
  }
  .opt.pick{border-color:#B9C6E8;background:#F6F8FF}
  .opt.right{border-color:var(--ok);background:var(--ok-soft);color:#0F6B4C}
  .opt.right .num{background:var(--ok);color:#fff;border-color:var(--ok)}
  .opt.wrong{border-color:#EEA3B3;background:#FFF3F6;color:#A62B49}
  .opt.wrong .num{background:#E5647F;color:#fff;border-color:#E5647F}
  .feedback{margin-top:14px;border-radius:16px;padding:13px 14px;font-size:13px;font-weight:700;line-height:1.5}
  .feedback.ok{background:var(--ok-soft);color:#0F6B4C}
  .feedback.no{background:#FFF4F0;color:#9C4A22}
  .feedback .fb-t{display:block;font-size:14.5px;font-weight:900;margin-bottom:3px}
  .btn-primary{
    width:100%;margin-top:14px;padding:15px;border-radius:16px;font-size:15px;font-weight:900;color:#fff;
    background:linear-gradient(135deg,#FF9A63,#FF6B8A);box-shadow:0 8px 18px rgba(255,107,138,.28);
  }
  .btn-ghost{
    width:100%;margin-top:9px;padding:13px;border-radius:15px;font-size:13.5px;font-weight:800;
    background:#fff;border:1.5px solid #F0E6DA;color:#6B6379;
  }
  .result{text-align:center;padding:6px 4px 2px}
  .result .big{font-size:54px;line-height:1.1}
  .result h3{font-size:20px;margin:8px 0 4px;letter-spacing:-.03em}
  .result p{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px}
  .result .stamps{font-size:26px;letter-spacing:3px;margin:8px 0}

  /* ── board ── */
  .board-sum{display:flex;gap:8px;margin-top:12px}
  .board-sum div{flex:1;background:#fff;border-radius:16px;padding:11px 12px;box-shadow:var(--shadow-sm);border:1px solid #F4ECE2;text-align:center}
  .board-sum b{display:block;font-size:19px;letter-spacing:-.02em}
  .board-sum span{font-size:11px;color:var(--muted);font-weight:700}
  .kid{
    display:flex;align-items:center;gap:11px;background:#fff;border-radius:18px;padding:12px 13px;
    box-shadow:var(--shadow-sm);border:1.5px solid #F4ECE2;margin-top:9px;
  }
  .kid.me{border-color:#FFC9AE;background:linear-gradient(180deg,#FFF8F3,#fff)}
  .kid .k-ava{
    width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:#F8F2E9;flex:0 0 auto;
    position:relative;
  }
  .kid.ok .k-ava{background:var(--ok-soft)}
  .kid .k-body{flex:1;min-width:0}
  .kid .k-name{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:5px;letter-spacing:-.02em}
  .kid .k-name .me-tag{font-size:9.5px;font-weight:800;color:#fff;background:#FF9A63;padding:2px 6px;border-radius:99px}
  .kid .k-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .k-badge{font-size:10px;font-weight:800;padding:2.5px 7px;border-radius:99px;background:#F6F1EA;color:#8A8199}
  .k-badge.b0{background:#FFEDE3;color:#B4551F}
  .k-badge.b1{background:#E8EFFF;color:#2F55BE}
  .k-badge.b2{background:#F3E9FF;color:#7A3FC0}
  .k-badge.b3{background:#FFF4D6;color:#966B00}
  .k-badge.b4{background:#E2F8F1;color:#0E7D5C}
  .k-badge.b5{background:#EDEAFF;color:#4B3BA8}
  .k-badge.b6{background:#FFEAF0;color:#B3235C}
  .sec-head .more{max-width:56%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── 난이도(단계) 배지 ── */
  .lv-wrap{margin:2px 0 12px}
  .lv-chip{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lv-badge{font-size:12px;font-weight:900;padding:5px 10px;border-radius:999px;background:#EAF7E4;color:#2F7A20;border:1px solid #D6EDCB}
  .lv-name{font-size:11.5px;font-weight:800;color:#7C7590}
  .lv-dots{display:flex;gap:3px;margin-left:auto}
  .lv-dots i{width:14px;height:5px;border-radius:99px;background:#EDE6DC;display:block}
  .lv-dots i.on{background:#F2A93B}
  .lv-note{font-size:11px;color:#948CA5;font-weight:700;margin-top:5px}
  .lv-note b{color:#B4631B}

  /* ── 한자 비문학 ── */
  .hj-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:1px solid #F0EDFF;padding:14px;margin:10px 0}
  .hj-top{display:flex;gap:14px;align-items:flex-start}
  .hj-pic{flex:0 0 116px}
  .hj-svg{width:116px;height:116px;display:block;background:#FBF9FF;border-radius:14px}
  .hj-svg .gr{fill:none;stroke:#E4DCFA;stroke-width:1.2}
  .hj-svg .gd{stroke:#EAE3FB;stroke-width:.8;stroke-dasharray:3 3}
  .hj-svg .gx{stroke:#F1ECFD;stroke-width:.7;stroke-dasharray:2 4}
  .hj-svg path.st{fill:none;stroke:#3A2E6B;stroke-width:5.2;stroke-linecap:round;stroke-linejoin:round}
  .hj-svg path.st.on{stroke:#7A4BD6}
  .hj-svg text.st-num{font-size:9px;font-weight:900;fill:#B4631B}
  .hj-info{flex:1;min-width:0}
  .hj-hu{font-size:24px;font-weight:900;letter-spacing:-.02em;color:#3A2E6B;line-height:1.1}
  .hj-hu span{font-size:15px;color:#7A6BD6;margin-left:4px}
  .hj-what{font-size:11.5px;font-weight:800;color:#7C7590;margin-top:3px}
  .hj-meta{font-size:11.5px;font-weight:800;color:#B4631B;margin-top:3px}
  .hj-say{margin-top:7px}
  .hj-say button{font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:999px;background:#F3F0FF;color:#4B3BA8}
  .hj-play{width:100%;margin-top:10px;padding:9px;border-radius:12px;background:#F7F3FF;color:#4B3BA8;font-size:12.5px;font-weight:900;border:1px solid #E5DBFF}
  .hj-steps{margin:10px 0 0;padding-left:18px;font-size:12.5px;color:#4A4360;font-weight:600;line-height:1.55}
  .hj-steps li{margin:1px 0}
  .hj-words{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .hj-word{font-size:11.5px;font-weight:700;background:#F7F5FF;color:#4B3BA8;padding:4px 9px;border-radius:10px}
  .hj-ex{margin-top:8px;font-size:12.5px;color:#5C5470;font-weight:600;background:#FCFAF4;border-radius:12px;padding:8px 10px}
  .hj-head{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
  .hj-tag{font-size:11px;font-weight:900;color:#7A6BD6;background:#F2EEFF;padding:4px 9px;border-radius:999px}
  .hj-head b{font-size:15px;letter-spacing:-.02em}
  .hj-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .hj-mini{min-width:52px;text-align:center;background:#FBF9FF;border:1px solid #EDE7FF;border-radius:12px;padding:6px 8px}
  .hj-mini b{display:block;font-size:19px;color:#3A2E6B;line-height:1.1}
  .hj-mini span{font-size:10.5px;color:#7C7590;font-weight:800}

  /* ── 예쁘게 말하기 ── */
  .sp-card{background:linear-gradient(160deg,#FFF6FB,#FFFFFF);border-radius:20px;box-shadow:var(--shadow);border:1px solid #FFE3EF;padding:15px;margin:6px 0 10px}
  .sp-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sp-scene{font-size:11.5px;font-weight:900;color:#B3235C;background:#FFEAF2;padding:4px 10px;border-radius:999px}
  .sp-title{font-size:17px;font-weight:900;letter-spacing:-.03em;margin:9px 0 6px;color:#3A2E4B}
  .sp-sit{font-size:13.5px;line-height:1.65;color:#4A4360;font-weight:600}
  .sp-card button[data-action="speak-read"]{margin-top:10px;font-size:12px;font-weight:900;padding:7px 12px;border-radius:999px;background:#FFF0F6;color:#B3235C;border:1px solid #FFD9E8}
  .sp-say{margin-top:10px;background:#FFF8E9;border:1px solid #FFE7B8;border-radius:14px;padding:10px 12px}
  .sp-say .k{font-size:10.5px;font-weight:900;color:#B4631B;display:block;margin-bottom:3px}
  .sp-say b{font-size:13.5px;color:#7A4A12;line-height:1.5}
  .sp-tip{margin-top:8px;font-size:11.5px;font-weight:700;color:#7C7590;background:#F6F3FA;border-radius:12px;padding:8px 10px}
  .sp-sayline{background:#fff;border:1px solid #FFE3EF;border-radius:12px;padding:9px 11px;margin-top:7px;font-size:12.5px;font-weight:700;color:#4A4360}
  .sp-sayline b{display:block;font-size:11px;color:#B3235C;margin-bottom:2px}

  /* ── 설정: 난이도 ── */
  .lv-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #F0E6DA;font-size:13px;font-weight:800}
  .lv-row:last-child{border-bottom:0}
  .lv-row .n{flex:1;color:#4A4360}
  .lv-row .v{font-size:11.5px;font-weight:900;color:#2F7A20;background:#EAF7E4;border-radius:999px;padding:3px 9px}
  .lv-row .w{font-size:10.5px;font-weight:800;color:#948CA5}
  .kid .k-status{
    font-size:11.5px;font-weight:900;padding:7px 10px;border-radius:12px;flex:0 0 auto;text-align:center;line-height:1.2;
  }
  .kid.ok .k-status{background:var(--ok-soft);color:#0F6B4C}
  .kid .k-status.todo{background:#F7F2EA;color:#A79C8C}
  .note{font-size:11px;color:#A79C8C;font-weight:600;line-height:1.5;margin:12px 2px 0}

  /* ── settings ── */
  .set-card{background:#fff;border-radius:20px;padding:15px;box-shadow:var(--shadow-sm);border:1px solid #F6EEE5;margin-bottom:12px}
  .set-card h3{font-size:14.5px;margin:0 0 4px;letter-spacing:-.02em}
  .set-card .hint{font-size:11.5px;color:var(--muted);font-weight:600;margin:0 0 12px;line-height:1.45}
  .prow{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid #F6EFE7}
  .prow:first-of-type{border-top:0}
  .prow .p-ava{font-size:22px;width:34px;text-align:center;flex:0 0 auto}
  .prow select{
    width:52px;padding:7px 2px;border-radius:10px;border:1.5px solid #EFE6DA;background:#FDFAF6;font-size:16px;text-align:center;
    appearance:none;-webkit-appearance:none;flex:0 0 auto;
  }
  .prow input{
    flex:1;min-width:0;padding:9px 11px;border-radius:11px;border:1.5px solid #EFE6DA;background:#FDFAF6;
    font-size:14px;font-weight:700;outline:none;
  }
  .prow input:focus{border-color:#FFB08A;background:#fff}
  .about{font-size:11.5px;color:#9A9184;font-weight:600;line-height:1.6;text-align:center;padding:16px 4px 4px}

  /* ── 오늘의 학습 · 영상 카드 ── */
  .daily{
    display:block;width:100%;text-align:left;background:#fff;border-radius:20px;padding:14px;
    box-shadow:var(--shadow-sm);border:1.5px solid #F6EEE5;
  }
  .daily:active{transform:scale(.99)}
  .daily.done{border-color:#BFE9D6;background:linear-gradient(180deg,#F7FDFA,#fff)}
  .daily .d-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .daily .d-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:var(--soft);flex:0 0 auto}
  .daily .d-name{font-size:14.5px;font-weight:900;letter-spacing:-.02em;flex:1;min-width:0}
  .daily .d-badge{font-size:10.5px;font-weight:900;padding:4px 8px;border-radius:99px;background:#FFF1E6;color:#B4631B;flex:0 0 auto}
  .daily.done .d-badge{background:var(--ok-soft);color:#0F6B4C}
  .daily .d-q{font-size:13.5px;font-weight:800;line-height:1.45;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .daily .d-vid{display:block;font-size:11px;font-weight:700;color:#8A8199;margin-top:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .vidcard{
    display:flex;align-items:center;gap:11px;background:#fff;border-radius:18px;padding:12px;
    box-shadow:var(--shadow-sm);border:1.5px solid #F6EEE5;text-decoration:none;color:var(--ink);margin-top:4px;
  }
  .vidcard.unlock{border-color:#BFE9D6;box-shadow:0 0 0 3px rgba(31,169,122,.12),var(--shadow-sm)}
  .vidcard .v-thumb{width:54px;height:42px;border-radius:11px;background:linear-gradient(135deg,#FFD9C7,#FFB08A);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
  .vidcard .v-body{display:block;flex:1;min-width:0}
  .vidcard .v-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;font-weight:800;line-height:1.35}
  .vidcard .v-d{display:block;font-size:10.5px;color:#9A9184;font-weight:700;margin-top:3px}
  .vidcard .v-go{color:#C9BFB2;font-size:13px;flex:0 0 auto}
  /* ── 오늘의 읽기 글 (초1 문해력 에세이) ── */
  .readcard{background:#fff;border-radius:22px;padding:17px 16px 15px;box-shadow:var(--shadow);border:1px solid #F1E6D8;margin-top:12px}
  .rc-head{display:flex;align-items:center;gap:7px}
  .rc-label{font-size:13px;font-weight:900;color:#B4631B;letter-spacing:-.01em}
  .rc-len{margin-left:auto;font-size:10.5px;font-weight:800;color:#A79C8C;background:#FBF4EC;padding:3px 8px;border-radius:99px}
  .rc-title{font-size:16.5px;font-weight:900;letter-spacing:-.03em;margin:8px 0 10px;line-height:1.35}
  .rc-body{font-size:17.5px;line-height:2;font-weight:600;color:#3B3451;word-break:keep-all}
  .rc-body p{margin:0 0 13px}
  .rc-body p:last-child{margin-bottom:0}
  .rc-vocab{margin-top:14px;padding-top:12px;border-top:1px dashed #EDE2D4;display:flex;flex-direction:column;gap:6px}
  .rc-vocab .v-row{font-size:12px;font-weight:700;color:#6B6379;line-height:1.45}
  .rc-vocab .v-w{display:inline-block;font-weight:900;color:#8A4A16;background:#FFF4E9;border-radius:8px;padding:2px 7px;margin-right:6px}
  .read-foot{display:flex;gap:7px;margin-top:13px}
  .read-foot button{flex:1;padding:12px 0;border-radius:13px;font-size:12.5px;font-weight:900;background:#FFF6ED;border:1.5px solid #F5E3CE;color:#8A5A2B}
  .read-foot button.on{background:#FF7A45;border-color:#FF7A45;color:#fff;box-shadow:0 6px 14px rgba(255,122,69,.24)}

  /* ── 영상방 ── */
  .vr-chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
  .vr-chips::-webkit-scrollbar{display:none}
  .vr-chips button{flex:0 0 auto;padding:8px 13px;border-radius:999px;font-size:12px;font-weight:800;background:#fff;color:#7A7390;border:1.5px solid #EFE7DC}
  .vr-chips button.on{background:#2A4694;color:#fff;border-color:#2A4694;box-shadow:0 4px 10px rgba(42,70,148,.2)}
  .vcard{display:block;background:#fff;border-radius:18px;padding:12px 13px;box-shadow:var(--shadow-sm);border:1.5px solid #F6EEE5;margin-top:9px;text-decoration:none;color:var(--ink)}
  .vcard:active{transform:scale(.99)}
  .vcard .vc-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .vcard .vc-sub{font-size:10px;font-weight:900;color:#fff;background:#FF9A63;padding:3px 8px;border-radius:99px}
  .vcard .vc-dur{font-size:10.5px;font-weight:800;color:#9A9184;margin-left:auto}
  .vcard .vc-t{display:block;font-size:13.5px;font-weight:900;line-height:1.4;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .vcard .vc-d{display:block;font-size:11.5px;font-weight:600;color:#7C7590;line-height:1.45;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .vcard .vc-ch{display:block;font-size:10.5px;font-weight:700;color:#A79C8C;margin-top:7px}

  .invite-card{margin-top:16px;border-radius:20px;padding:14px;background:linear-gradient(135deg,#EAF5FF,#F6EEFF);border:1.5px dashed #BBD4F5}
  .ic-top{display:flex;align-items:center;gap:10px}
  .ic-top .ic-emoji{font-size:24px;line-height:1}
  .ic-top b{display:block;font-size:14px;letter-spacing:-.02em}
  .ic-top small{font-size:11px;color:#6E7C96;font-weight:700}
  /* ── 친구 참여(join) ── */
  .join-wrap{padding:18px 16px 40px;text-align:center}
  .join-hero{font-size:54px;line-height:1.1}
  .join-wrap h1{font-size:20px;margin:12px 0 6px;letter-spacing:-.03em;line-height:1.35}
  .join-sub{font-size:12.5px;color:#6E6884;font-weight:700;line-height:1.55;margin:0 0 16px}
  .join-field{text-align:left;background:#fff;border-radius:20px;padding:14px;box-shadow:var(--shadow-sm);border:1px solid #F6EEE5;margin-bottom:12px}
  .join-field label{display:block;font-size:12px;font-weight:900;color:#8A8199;margin-bottom:7px}
  .join-field input{width:100%;padding:14px;border-radius:14px;border:2px solid #F0E6DA;background:#FDFAF6;font-size:17px;font-weight:800;outline:none}
  .join-field input:focus{border-color:#FFB08A;background:#fff}
  .emoji-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:2px}
  .emoji-grid button{padding:11px 0;border-radius:14px;font-size:24px;background:#FBF7F1;border:2px solid transparent;line-height:1.1}
  .emoji-grid button.on{border-color:#FF7A45;background:#FFF1E8}
  .emoji-grid button.taken{opacity:.32}
  .join-err{min-height:18px;font-size:12px;font-weight:800;color:#C2334F;margin-top:8px;text-align:left;line-height:1.4}
  .slot-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid #EEF2F8}
  .slot-row:first-of-type{border-top:0}
  .slot-row .sr-ava{font-size:20px;width:28px;text-align:center;flex:0 0 auto}
  .slot-row .sr-name{flex:1;min-width:0;font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot-row .sr-tag{font-size:10px;font-weight:800;color:#7C8AA5;background:#EEF3FB;padding:3px 7px;border-radius:99px;flex:0 0 auto}
  .slot-row button{padding:8px 11px;border-radius:11px;font-size:11.5px;font-weight:900;background:#2A4694;color:#fff;flex:0 0 auto}
  .welcome{margin-top:12px;border-radius:18px;padding:13px 14px;background:#FFF4EC;border:1.5px solid #FFD9C7;display:flex;align-items:center;gap:10px}
  .welcome span{font-size:20px}
  .welcome div{flex:1;font-size:12.5px;font-weight:800;line-height:1.45;color:#8A3E14}
  .welcome button{font-size:11px;font-weight:900;color:#B4631B;padding:6px 8px}

  /* ── tab bar ── */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;justify-content:center;
    background:rgba(255,252,248,.92);
    backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);
    border-top:1px solid rgba(240,230,218,.9);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar .inner{display:flex;width:100%;max-width:430px}
  .tabbar button{
    flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;
    font-size:10.5px;font-weight:800;color:#A79C8C;position:relative;white-space:nowrap;letter-spacing:-.02em;
  }
  @media (max-width:400px){
    .tabbar button{font-size:9.5px;padding:9px 0 8px;letter-spacing:-.04em}
    .tabbar button .t-ico{font-size:18px}
  }
  .tabbar button .t-ico{font-size:20px;line-height:1;filter:grayscale(.55) opacity(.75);transition:filter .15s,transform .15s}
  .tabbar button.on{color:#E4612A}
  .tabbar button.on .t-ico{filter:none;transform:translateY(-1px)}
  .tabbar button.on::after{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#FF9A63,#FF6B8A)}

  /* ── toast / fx / modal ── */
  #toast{
    position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:rgba(43,35,64,.94);color:#fff;font-size:12.5px;font-weight:700;padding:11px 16px;border-radius:14px;
    opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:60;max-width:88vw;text-align:center;line-height:1.4;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
  .fx-float{
    position:absolute;font-size:20px;font-weight:900;color:#E4612A;
    animation:floatUp .95s ease-out forwards;white-space:nowrap;
  }
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,0) scale(.8)}
    20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}
    100%{opacity:0;transform:translate(-50%,-58px) scale(1)}
  }
  .modal-bg{position:fixed;inset:0;background:rgba(35,26,44,.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:20px;padding:16px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal h3{font-size:15px;margin:0 0 6px}
  .modal p{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 10px}
  .modal textarea{width:100%;height:150px;border-radius:12px;border:1.5px solid #EFE6DA;padding:10px;font-size:11.5px;line-height:1.5;font-family:inherit;resize:none}
  .modal .m-btns{display:flex;gap:7px;margin-top:10px}
  .modal .m-btns button{flex:1;padding:11px;border-radius:12px;font-size:13px;font-weight:800;background:#F6F1EA;color:#6B6379}
  .modal .m-btns button.primary{background:#FF7A45;color:#fff}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-emoji">🦁</span>
      <span class="brand-text"><b>우리 반 공부방</b><small>초1 · 5명 함께 공부</small></span>
    </div>
    <button class="stamp-pill" data-action="go" data-view="board" aria-label="도장판 보기">
      <span>🏅</span><b id="topStamps">0</b>
    </button>
  </header>

  <div class="friendstrip" id="friendStrip"></div>

  <main>
    <section class="view" data-view="home" id="view-home"></section>
    <section class="view" data-view="study" id="view-study" hidden></section>
    <section class="view" data-view="videos" id="view-videos" hidden></section>
    <section class="view" data-view="subject" id="view-subject" hidden></section>
    <section class="view" data-view="board" id="view-board" hidden></section>
    <section class="view" data-view="settings" id="view-settings" hidden></section>
    <section class="view" data-view="join" id="view-join" hidden></section>
  </main>

  <nav class="tabbar" aria-label="메뉴">
    <div class="inner">
      <button data-action="go" data-view="home" data-nav="home"><span class="t-ico">🏠</span>홈</button>
      <button data-action="go" data-view="study" data-nav="study"><span class="t-ico">📖</span>공부</button>
      <button data-action="go" data-view="videos" data-nav="videos"><span class="t-ico">🎬</span>영상방</button>
      <button data-action="go" data-view="board" data-nav="board"><span class="t-ico">🏅</span>도장판</button>
      <button data-action="go" data-view="settings" data-nav="settings"><span class="t-ico">⚙️</span>설정</button>
    </div>
  </nav>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="fx"></div>
<div id="modalWrap" hidden></div>

key": "남을 따라 사는 소비는 위험해요. 내게 정말 필요한지 먼저 생각해요.", "q": "읽기 글에서 '남을 따라 사는 소비'는 어떻다고 했나요?", "opts": [ "위험해요", "아주 좋아요", "돈이 벌려요" ], "ans": 0, "why": "읽기 글에 남을 따라 사는 소비는 위험하다고 나와요. 사기 전에 정말 필요한지 먼저 생각해요." }, { "id": "A9hwGXfgLRk", "url": "https://www.youtube.com/watch?v=A9hwGXfgLRk", "title": "금리와 함께 복리의 마법을 알아볼까요?ㅣ[ep.7] 시간을 먹고 자라는 돈ㅣ자본주의 편의점", "ch": "EBS 키즈", "dur": 317, "dur_label": "5:17", "summary": "월급을 받자마자 저축만 하던 회사원의 돈이 10년 뒤 눈덩이처럼 커지는 모습으로 복리를 설명한다.", "evidence": "자막 4:38 \"돈의 이자가 눈덩이처럼 커졌어요\"; 5:02 \"돈은 시간을 먹고 자란답니다\"; 5:05 \"이자가 붙고 그 이자에도 또 이자가 붙어요. 이게 바로 복리의 마법이에요\"", "topic": "복리의 마법", "essay": "회사원은 월급을 받으면 은행에 저축했어요. 그런데 10년 뒤, 통장을 열어 보고 깜짝 놀랐어요. 돈이 눈덩이처럼 커져 있었어요. 10년 동안 가만히 두었을 뿐인데 말이에요.\n\n은행은 맡긴 돈에 이자를 붙여 줘요. 그런데 그 이자에도 다시 이자가 붙어요. 이자와 이자가 계속 불어나는 거예요.\n\n이자가 붙고 그 이자에도 또 이자가 붙는 것, 이게 바로 복리예요. 복리는 처음에는 조금씩 늘지만, 기다리면 기다릴수록 더 크게 자란답니다.", "vocab": [ { "w": "이자", "m": "돈을 맡긴 값으로 더 받는 돈" }, { "w": "복리", "m": "이자에 또 이자가 붙는 것" } ], "key": "복리는 이자에 또 이자가 붙어서 시간이 지나면 눈덩이처럼 커지는 거예요.", "q": "읽기 글에서 '복리'는 무엇이라고 했나요?", "opts": [ "이자가 붙고 그 이자에도 또 이자가 붙는 것", "이자를 딱 한 번만 받는 것", "돈을 빌려 쓰는 것" ], "ans": 0, "why": "읽기 글에 복리는 이자가 붙고 그 이자에도 또 이자가 붙는 것이라고 나와요." }, { "id": "flHXHIMsRc4", "url": "https://www.youtube.com/watch?v=flHXHIMsRc4", "title": "이득이와 함께 은행의 시작을 알아보자!ㅣ[ep.8] 황금 동상이 된 이득이ㅣ자본주의 편의점", "ch": "EBS 키즈", "dur": 315, "dur_label": "5:15", "summary": "금을 맡아 보관증을 써 주던 옛날 영국 금세공업자의 가게가 오늘날 은행의 시작이 되었음을 보여준다.", "evidence": "자막 2:41 \"이 집 주인은 금을 다루는 금세공업자래요\"; 2:50 \"사람들이 금을 맡기면 보관증을 써 주는데요\"; 4:23 \"그렇게 탄생한 곳이 바로 영란은행\"; 5:02 \"금을 보관하고 보관증을 써 줬어요. 이것이 오늘날 은행에 바탕이 되었답니다\"", "topic": "은행은 어떻게 시작했을까", "essay": "옛날 영국에는 금을 다루는 금세공업자가 있었어요. 사람들은 금을 집에 두기가 무서워서 그에게 맡겼어요. 금세공업자는 금을 받고 보관증을 써 주었지요.\n\n사람들은 금을 찾으러 가지 않고 보관증만으로 물건을 샀어요. 보관증이 오늘날 지폐처럼 쓰인 거예요. 그렇게 탄생한 곳이 영란은행이에요.\n\n금을 맡기고 보관증을 써 준 금세공업자의 가게가 오늘날 은행의 시작이 되었어요. 은행은 이렇게 사람들의 소중한 것을 안전하게 맡아 주는 곳이랍니다.", "vocab": [ { "w": "보관증", "m": "맡긴 물건을 찾을 수 있는 종이" }, { "w": "영란은행", "m": "영국의 오래된 은행" } ], "key": "금을 맡기고 보관증을 써 주던 은 '보통 사람'이라는 뜻이에요. 그는 나라를 되찾는 일은 특별한 사람만 하는 것이 아니라 보통 사람 모두의 몫이라고 믿었어요.","vocab":[{"w":"임시정부","m":"나라를 되찾기 위해 세운 임시의 정부"},{"w":"주석","m":"단체나 정부를 대표하는 사람"}],"key":"백범은 보통 사람이라는 뜻이에요.","q":"읽기 글에서 '백범'은 무슨 뜻인가요?","opts":["보통 사람","큰 별","높은 산"],"ans":0,"why":"글에 '백범은 보통 사람이라는 뜻이에요'라고 나와요."}]},"news":{"2":[{"id":"n2-1-q1","topic":"은행과 이자","essay":"은행은 돈을 맡아 두는 곳이에요. 우리가 은행에 돈을 맡기면 은행은 그 돈을 안전한 금고에 보관해요. 맡긴 돈을 예금이라고 해요.\n\n은행은 맡긴 돈을 그냥 두지 않아요. 돈이 필요한 사람에게 빌려주고, 나중에 조금 더 받아요. 이때 더 받는 돈을 이자라고 해요. 은행은 이자로 번 돈의 일부를 예금한 사람에게 나눠 줘요.\n\n그래서 은행에 돈을 오래 맡기면 이자가 조금씩 붙어요. 10만 원을 맡기면 1년 뒤에 10만 원보다 조금 더 받을 수 있어요. 하지만 은행이 망할 수도 있으니 예금자 보호 제도도 있어요. 돈을 맡길 때는 이자와 안전을 함께 살펴야 해요.","vocab":[{"w":"예금","m":"은행에 맡긴 돈"},{"w":"이자","m":"돈을 빌리거나 맡긴 값으로 더 받는 돈"}],"key":"은행에 맡긴 돈을 예금, 더 받는 돈을 이자라고 해요.","q":"읽기 글에서 은행에 맡긴 돈을 무엇이라고 하나요?","opts":["예금","이자","세금"],"ans":0,"why":"글에 '맡긴 돈을 예금이라고 해요'라고 나와요."},{"id":"n2-2-q1","topic":"선거","essay":"여럿이 함께 살면 무엇을 어떻게 할지 정해야 해요. 이때 사람들을 대표할 사람을 뽑는 일이 선거예요. 우리나라는 만 18세가 되면 투표할 수 있어요.\n\n투표는 아무도 보지 않는 곳에서 해요. 누구를 뽑았는지 다른 사람에게 말하지 않아도 돼요. 이것을 비밀 투표라고 해요. 비밀 투표가 있으면 눈치를 보지 않고 내가 옳다고 생각하는 사람을 고를 수 있어요.\n\n가장 많은 표를 받은 사람이 뽑히는 경우가 많아요. 하지만 표가 아주 적게 차이 나면 다시 세어 보기도 해요. 투표는 한 표 한 표가 모여 우리 동네와 나라의 모습을 바꾸는 일이에요.","vocab":[{"w":"대표","m":"여럿을 대신하는 사람"},{"w":"비밀 투표","m":"누구를 뽑았는지 밝히지 않는 투표"}],"key":"우리나라는 만 18세가 되면 투표할 수 있어요.","q":"읽기 글에서 우리나라에서 투표할 수 있는 나이는 몇 살인가요?","opts":["만 18세","만 15세","만 20세"],"ans":0,"why":"글에 '우리나라는 만 18세가 되면 투표할 수 있어요'라고 나와요."},{"id":"n2-3-q1","topic":"대중교통","essay":"버스와 지하철은 많은 사람이 함께 타는 교통수단이에요. 이것을 대중교통이라고 해요. 한 사람이 자동차를 타고 다니면 길이 막히고 공기도 나빠져요. 대중교통을 함께 타면 길도 덜 막히고 기름도 덜 써요.\n\n버스는 정해진 길을 정해진 시간에 다녀요. 지하철은 땅속으로 다녀서 길이 막히지 않아요. 우리는 교통카드를 대면 요금이 빠져나가요. 어른과 아이의 요금이 다르기도 해요.\n\n대중교통에서는 다른 사람과 함께 있어요. 큰 소리로 통화하지 않고, 자리를 필요한 사람에게 양보하고, 내릴 사람이 먼저 내리게 해요. 이런 작은 배려가 모두의 이동을 편하게 만들어요.","vocab":[{"w":"대중교통","m":"여러 사람이 함께 타는 버스·지하철 같은 것"},{"w":"양보","m":"내 차례나 자리를 다른 사람에게 먼저 주는 일"}],"key":"버스와 지하철을 대중교통이라고 해요.","q":"읽기 글에서 대중교통을 함께 타면 기름을 어떻게 한다고 했나요?","opts":["덜 써요","더 써요","전혀 안 써요"],"ans":0,"why":"글에 '대중교통을 함께 타면 길도 덜 막히고 기름도 덜 써요'라고 나와요."}],"3":[{"id":"n3-1-q1","topic":"세금","essay":"세금은 나라와 동네를 함께 쓰는 돈이에요. 우리가 물건을 사면 값에 세금이 조금 붙어 있어요. 이것을 부가가치세라고 해요. 어른들은 일해서 번 돈으로 소득세도 내요.\n\n모인 세금은 우리가 매일 쓰는 곳에 쓰여요. 학교 건물과 선생님, 도로와 신호등, 공원과 도서관, 아픈 사람을 치료하는 병원에도 세금이 쓰여요. 혼자서는 만들 수 없는 것들을 우리가 함께 만드는 셈이에요.\n\n세금은 아무 데나 마음대로 쓸 수 없어요. 나라가 예산을 짜고, 국회에서 살펴보고, 국민이 지켜봐요. 세금을 어떻게 쓰는지 궁금하면 나라에서 공개한 자료를 찾아볼 수 있어요. 세금을 잘 살피는 것이 좋은 시민의 일이에요.","vocab":[{"w":"예산","m":"쓸 돈과 쓸 곳을 미리 정한 계획"},{"w":"세금","m":"나라 살림을 위해 내는 돈"}],"key":"세금은 학교·도로·공원처럼 함께 쓰는 곳에 쓰여요.","q":"읽기 글에서 물건을 살 때 값에 붙는 세금은 무엇이라고 하나요?","opts":["부가가치세","소득세","예산"],"ans":0,"why":"글에 '값에 세금이 조금 붙어 있어요. 이것을 부가가치세라고 해요'라고 나와요."},{"id":"n3-2-q1","topic":"보험","essay":"보험은 갑자기 큰일이 났을 때를 대비하는 방법이에요. 많은 사람이 조금씩 돈을 내고, 그 돈을 모아 두었다가 다친 사람이나 사고가 난 사람을 도와요. 한 사람이 큰돈을 마련하지 않아도 여럿이 힘을 모아 도울 수 있어요.\n\n보험에는 종류가 많아요. 아플 때 드는 병원비를 도와주는 보험이 있고, 자동차 사고를 대비하는 보험도 있어요. 집이 불에 타거나 물에 잠겼을 때를 대비하는 보험도 있어요.\n\n보험금을 받으려면 규칙을 지켜야 해요. 언제 어떻게 다쳤는지 정확히 알려야 하고, 거짓으로 꾸며 내면 받을 수 없어요. 보험은 어려운 사람을 함께 돕는 약속이에요.","vocab":[{"w":"대비","m":"앞으로 생길 일을 미리 준비함"},{"w":"보험금","m":"보험 규칙에 따라 받는 돈"}],"key":"보험은 여럿이 조금씩 모아 큰일을 함께 돕는 방법이에요.","q":"읽기 글에서 보험은 무엇을 대비하는 방법이라고 했나요?","opts":["갑자기 큰일이 났을 때","시험을 볼 때","여행을 갈 때"],"ans":0,"why":"글에 '보험은 갑자기 큰일이 났을 때를 대비하는 방법이에요'라고 나와요."},{"id":"n3-3-q1","topic":"저작권","essay":"책을 쓰거나 노래를 만들거나 그림을 그린 사람에게는 권리가 있어요. 그 창작물을 마음대로 쓰지 못하게 하는 권리가 저작권이에요. 저작권은 만든 사람이 태어나서 죽은 뒤 70년까지 이어져요.\n\n저작권이 있으면 다른 사람이 그 글을 그대로 가져다 자기 것처럼 쓰면 안 돼요. 이것을 표절이라고 해요. 노래를 그대로 올리거나 그림을 그대로 팔면 저작권을 침해하는 일이에요.\n\n하지만 인용은 달라요. 내 글에 다른 사람의 생각을 짧게 소개하고 출처를 밝히면 괜찮아요. 또 학교 공부나 개인적인 감상은 자유롭게 해도 돼요. 다른 사람의 창작물을 만나면 만든 사람의 마음을 먼저 생각해 보세요.","vocab":[{"w":"창작물","m":"새로 만들어 낸 글·그림·노래"},{"w":"표절","m":"남의 것을 자기 것처럼 쓰는 일"}],"key":"저작권은 만든 사람의 권리이고, 표절은 안 돼요.","q":"읽기 글에서 남의 글을 그대로 가져다 자기 것처럼 쓰는 일을 무엇이라고 하나요?","opts":["표절","인용","출처"],"ans":0,"why":"글에 '그대로 가져다 자기 것처럼 쓰면 안 돼요. 이것을 표절이라고 해요'라고 나와요."}],"4":[{"id":"n4-1-q1","topic":"국제연합(UN)","essay":"세계 여러 나라가 함께 모여 만든 기구가 국제연합, 줄여서 유엔이에요. 1945년에 만들어졌어요. 두 번의 큰 전쟁을 겪은 뒤, 다시는 그런 전쟁이 일어나지 않게 하자는 마음이 모였어요.\n\n유엔은 나라 사이의 다툼을 대화로 풀도록 돕고, 굶주리는 사람과 병든 사람을 돕는 일도 해요. 어린이를 돕는 유니세프도 유엔의 기구예요. 전쟁이 난 곳에 평화를 지키는 군사를 보내기도 해요.\n\n유엔은 지속가능발전목표를 정했어요. 가난과 배고픔을 없애고, 모두가 좋은 교육을 받고, 기후 변화를 막자는 목표예요. 193개 나라가 참여하고 있어요. 이 목표는 어른만의 일이 아니라 우리 모두의 일이에요.","vocab":[{"w":"국제연합","m":"세계 여러 나라가 함께 만든 기구"},{"w":"지속가능발전","m":"다음 세대도 살 수 있게 하며 나아짐"}],"key":"유엔은 1945년에 만들어졌어요.","q":"읽기 글에서 유엔이 만들어진 해는 언제인가요?","opts":["1945년","1919년","1876년"],"ans":0,"why":"글에 '1945년에 만들어졌어요'라고 나와요."},{"id":"n4-2-q1","topic":"인공지능과 윤리","essay":"인공지능은 사람이 만든 규칙과 자료로 배우는 프로그램이에요. 인공지능은 사진을 보고 무엇인지 알아맞히고, 글을 쓰고, 노래를 만들기도 해요. 병원에서 병을 찾는 일도 도와요.\n\n그런데 인공지능은 스스로 옳고 그름을 판단하지 못해요. 사람이 준 자료가 한쪽으로 치우쳐 있으면 인공지능도 치우친 대답을 해요. 이것을 편향이라고 해요. 또 인공지능에게 얼굴 사진이나 대화 내용을 마음대로 주면 개인정보를 잃을 수 있어요.\n\n그래서 인공지능을 쓸 때는 지켜야 할 약속이 있어요. 사람의 마지막 결정을 인공지능에게 맡기지 않고, 틀릴 수 있다는 것을 잊지 않고, 쓰인 자료와 정답을 확인하는 일이에요. 인공지능은 편리하지만, 책임은 결국 사람의 몫이에요.","vocab":[{"w":"편향","m":"한쪽으로 치우친 생각"},{"w":"개인정보","m":"나를 알아볼 수 있는 정보"}],"key":"인공지능은 책임을 지지 못하므로 마지막 결정은 사람이 해야 해요.","q":"읽기 글에서 인공지능이 한쪽으로 치우친 대답을 하는 것을 무엇이라고 하나요?","opts":["편향","개인정보","윤리"],"ans":0,"why":"글에 '인공지능도 치우친 대답을 해요. 이것을 편향이라고 해요'라고 나와요."},{"id":"n4-3-q1","topic":"기후 위기","essay":"지구의 평균 기온이 점점 올라가고 있어요. 공장과 자동차는 석유와 석탄을 태워 에너지를 만들어요. 그때 나오는 기체가 하늘에 쌓이면 지구가 열을 밖으로 내보내지 못해요. 이 기체를 온실가스라고 해요.\n\n기온이 오르면 빙하가 녹아 바다가 높아져요. 아주 덥거나 아주 비가 많이 오는 날도 늘어요. 물이 부족해지고 농사짓기 어려운 곳도 많아졌어요. 지구 평균 기온이 1.5도만 올라도 큰일이 생길 수 있다고 과학자들은 말해요.\n\n사람들은 해결 방법도 찾고 있어요. 햇빛과 바람으로 전기를 만드는 재생에너지가 대표적이에요. 전기를 아끼고, 쓰던 물건을 오래 쓰고, 타지 않으면 걸어 다니는 일도 도움이 돼요. 오늘 아낀 것이 미래의 지구를 지켜요.","vocab":[{"w":"온실가스","m":"지구를 덥게 만드는 기체"},{"w":"재생에너지","m":"햇빛·바람처럼 다시 생기는 에너지"}],"key":"지구를 덥게 만드는 기체가 온실가스예요.","q":"읽기 글에서 지구가 열을 밖으로 내보내지 못하게 하는 기체는 무엇인가요?","opts":["온실가스","산소","빗물"],"ans":0,"why":"글에 '이 기체를 온실가스라고 해요'라고 나와요."}]},"english":{"2":[{"en":"I get up at seven.","ko":"나는 일곱 시에 일어나.","tip":"아이-겟-업-앳-세븐 · get up은 '일어나다'","emoji":"⏰"},{"en":"I brush my teeth.","ko":"나는 이를 닦아.","tip":"아이-브러시-마이-티쓰 · th는 혀끝을 살짝 물고","emoji":"🪥"},{"en":"We eat breakfast together.","ko":"우리는 함께 아침을 먹어.","tip":"위-이트-브렉퍼스트-투게더","emoji":"🍳"},{"en":"She is my sister.","ko":"그녀는 내 여동생이야.","tip":"쉬-이즈-마이-시스터 · she는 여자","emoji":"👧"},{"en":"He can ride a bike.","ko":"그는 자전거를 탈 수 있어.","tip":"히-캔-라이드-어-바이크 · can은 '~할 수 있어'","emoji":"🚲"},{"en":"Where is my bag?","ko":"내 가방은 어디에 있지?","tip":"웨어-이즈-마이-백 · 묻는 말이라 끝을 올려요","emoji":"🎒"},{"en":"It is on the desk.","ko":"그것은 책상 위에 있어.","tip":"잇-이즈-온-더-데스크 · on은 '위에'","emoji":"🪑"},{"en":"I like rainy days.","ko":"나는 비 오는 날을 좋아해.","tip":"아이-라이크-레이니-데이즈","emoji":"🌧️"},{"en":"Let's clean the classroom.","ko":"교실을 청소하자.","tip":"렛츠-클린-더-클래스룸 · Let's는 '~하자'","emoji":"🧹"},{"en":"I am hungry now.","ko":"나는 지금 배고파.","tip":"아이-엠-헝그리-나우","emoji":"🍚"},{"en":"Please open the window.","ko":"창문을 열어 주세요.","tip":"플리즈-오픈-더-윈도우 · please는 '부탁해요'","emoji":"🪟"},{"en":"See you tomorrow!","ko":"내일 보자!","tip":"씨-유-투모로우 · 헤어질 때","emoji":"👋"}],"3":[{"en":"I usually walk to school.","ko":"나는 보통 걸어서 학교에 가.","tip":"아이-유주얼리-워크-투-스쿨 · usually는 '보통'","emoji":"🚶"},{"en":"My brother plays soccer after school.","ko":"내 형(오빠)은 방과 후에 축구를 해.","tip":"마이-브라더-플레이즈-사커-애프터-스쿨","emoji":"⚽"},{"en":"What time do you go to bed?","ko":"너는 몇 시에 자니?","tip":"왓-타임-두-유-고-투-베드 · go to bed는 '자다'","emoji":"🛏️"},{"en":"I went to the zoo last Sunday.","ko":"나는 지난 일요일에 동물원에 갔어.","tip":"아이-웬트-투-더-주-라스트-선데이 · go의 과거는 went","emoji":"🦁"},{"en":"The elephant was very big.","ko":"그 코끼리는 아주 컸어.","tip":"디-엘리펀트-워즈-베리-빅 · was는 '이었다/했다'","emoji":"🐘"},{"en":"I want to drink some water.","ko":"나는 물을 좀 마시고 싶어.","tip":"아이-원트-투-드링크-썸-워터","emoji":"💧"},{"en":"Can you help me, please?","ko":"나를 좀 도와줄 수 있어?","tip":"캔-유-헬프-미-플리즈 · 부탁할 때","emoji":"🙏"},{"en":"She is taller than me.","ko":"그녀는 나보다 키가 커.","tip":"쉬-이즈-톨러-댄-미 · taller는 '더 큰'","emoji":"📏"},{"en":"We will visit Grandma this weekend.","ko":"우리는 이번 주말에 할머니를 뵈러 갈 거야.","tip":"위-윌-비지트-그랜마-디스-위켄드","emoji":"👵"},{"en":"I have two pencils in my bag.","ko":"내 가방에 연필이 두 자루 있어.","tip":"아이-해브-투-펜슬즈-인-마이-백","emoji":"✏️"},{"en":"It is raining outside.","ko":"밖에 비가 오고 있어.","tip":"잇-이즈-레이닝-아웃사이드 · ~ing는 '지금 ~하는 중'","emoji":"☔"},{"en":"I am good at drawing.","ko":"나는 그림을 잘 그려.","tip":"아이-엠-굿-앳-드로잉 · be good at은 '~을 잘하다'","emoji":"🎨"}],"4":[{"en":"I want to be a scientist in the future.","ko":"나는 앞으로 과학자가 되고 싶어.","tip":"아이-원트-투-비-어-사이언티스트-인-더-퓨처","emoji":"🔬"},{"en":"Because it was cold, I wore a coat.","ko":"추웠기 때문에 나는 코트를 입었어.","tip":"비코즈-잇-워즈-콜드 · because는 '왜냐하면'","emoji":"🧥"},{"en":"My favorite season is autumn.","ko":"내가 가장 좋아하는 계절은 가을이야.","tip":"마이-페이버릿-시즌-이즈-오텀","emoji":"🍁"},{"en":"I have never seen a whale.","ko":"나는 고래를 한 번도 본 적이 없어.","tip":"아이-해브-네버-씬-어-웨일 · never는 '한 번도 ~않다'","emoji":"🐋"},{"en":"He is the fastest runner in our class.","ko":"그는 우리 반에서 가장 빠른 달리기 선수야.","tip":"히-이즈-더-패스티스트-러너 · -est는 '가장 ~한'","emoji":"🏃"},{"en":"We should save water every day.","ko":"우리는 매일 물을 아껴야 해.","tip":"위-슈드-세이브-워터 · should는 '~해야 해'","emoji":"🚰"},{"en":"If it rains tomorrow, we will stay home.","ko":"내일 비가 오면 우리는 집에 있을 거야.","tip":"이프-잇-레인즈-투모로우 · if는 '만약 ~하면'","emoji":"🌂"},{"en":"I learned how to make kimbap.","ko":"나는 김밥 만드는 법을 배웠어.","tip":"아이-런드-하우-투-메이크-킴밥 · how to는 '~하는 법'","emoji":"🍙"},{"en":"This book is more interesting than that one.","ko":"이 책이 저 책보다 더 재미있어.","tip":"모어-인터레스팅-댄 · 긴 낱말은 more를 앞에","emoji":"📚"},{"en":"She asked me to help her.","ko":"그녀가 나에게 도와 달라고 했어.","tip":"쉬-애스크트-미-투-헬프-허 · ask A to B는 'A에게 B해 달라고 하다'","emoji":"🙋"},{"en":"I was reading a book when you called.","ko":"네가 전화했을 때 나는 책을 읽고 있었어.","tip":"아이-워즈-리딩 · was ~ing는 '~하고 있었다'","emoji":"📖"},{"en":"Let's take a picture together.","ko":"우리 함께 사진 찍자.","tip":"렛츠-테이크-어-픽처-투게더","emoji":"📷"}]},"speak":{"1":[{"id":"sp1-1","scene":"가족","emoji":"🍚","title":"저녁 식탁에서","situation":"엄마가 저녁으로 미역국을 끓여 주셨어요. 그런데 내 입에는 조금 짜게 느껴져요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["맛있어요! 조금 짜서 물이랑 같이 먹을게요. 고마워요.","너무 짜서 못 먹겠어요.","아무 말 없이 먹고 자리를 뜬다."],"ans":0,"why":"정성 들여 끓인 국을 대접한 엄마는 내 한마디에 힘이 나기도 하고 서운하기도 해요. '맛있다'는 마음과 '조금 짜다'는 내 느낌을 함께 말하면, 엄마는 사실을 알면서도 기분이 상하지 않아요. 아무 말 없이 먹는 것보다 고마움을 말로 전하는 편이 서로 좋아요.","say":"맛있어요! 조금 짜서 물이랑 같이 먹을게요. 끓여 주셔서 고마워요.","tip":"싫은 점을 말할 때는 ①좋은 점 ②내 느낌 ③고마움 순서로 말해 봐요."},{"id":"sp1-2","scene":"친구","emoji":"🛝","title":"놀이터에서 친구가 넘어졌어요","situation":"놀이터에서 친구가 그네에서 내려오다 넘어졌어요. 무릎에 흙이 묻고 조금 아파 보여요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["괜찮아? 내가 도와줄까? 무릎 닦아 줄게.","야, 그것도 못 내려와서 넘어졌어?","웃으면서 친구를 본다."],"ans":0,"why":"넘어진 친구는 아픈 것보다 부끄러운 마음이 더 클 수 있어요. 먼저 걱정하고 도와주면 친구는 창피함을 덜 느끼고, 내가 믿을 만한 사람이라는 걸 알게 돼요. 놀리면 친구는 아픈 데까지 두 배로 느껴져요.","say":"괜찮아? 무릎이 많이 아파 보여. 같이 씻으러 가자.","tip":"다친 친구에게는 ①괜찮은지 묻기 ②도와줄 일 찾기 ③같이 있어 주기 순서로."},{"id":"sp1-3","scene":"이웃","emoji":"🛗","title":"엘리베이터에서 만난 이웃","situation":"아침에 엘리베이터에서 옆집 할머니를 만났어요. 할머니가 무거운 장바구니를 들고 계세요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["안녕하세요! 무거워 보이는데 제가 들어 드릴까요?","빈손으로 먼저 내려 버린다.","휴대폰만 보며 모르는 척한다."],"ans":0,"why":"이웃은 하루에 몇 번씩 마주치는 가까운 사람이에요. 먼저 인사하고 도울 마음을 보이면 할머니는 기분이 좋아지고, 다음에 내가 어려울 때도 서로 돕게 돼요. 모르는 척하면 사이가 어색해져요.","say":"할머니, 안녕하세요! 그거 무거우시죠? 제가 같이 들어 드릴게요.","tip":"도와드릴 때도 물어보고 하는 게 예절이에요. 갑자기 잡아당기면 놀라실 수 있어요."},{"id":"sp1-4","scene":"학교","emoji":"🏫","title":"복도에서 부딪혔어요","situation":"급하게 뛰다가 복도에서 친구와 어깨가 부딪혔어요. 친구가 들고 있던 종이가 바닥에 떨어졌어요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["미안해, 내가 급하게 뛰었어. 종이 주울게.","나는 잘못 없어. 네가 앞을 안 봤잖아.","아무 말 없이 지나간다."],"ans":0,"why":"부딪혔을 때 제일 먼저 할 일은 사과예요. '내가 뛰어서 미안해'라고 내 행동을 말하면 친구는 화를 낼 이유가 줄어요. 내 잘못을 인정하는 말은 약한 말이 아니라, 사이를 지키는 힘센 말이에요.","say":"미안해. 내가 뛰어서 부딪혔어. 종이 주울게, 괜찮아?","tip":"사과는 ①미안하다 ②내가 뭘 잘못했는지 ③어떻게 할지 세 가지를 담아요."},{"id":"sp1-5","scene":"가게","emoji":"🏪","title":"사려던 과자가 없어요","situation":"가게에 가서 사고 싶은 과자를 찾는데, 진열대에 보이지 않아요. 점원 아저씨가 계세요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["실례합니다, 이 과자 어디에 있나요?","과자를 찾으려고 진열대를 마구 헤친다.","아무 말 없이 화가 나서 나간다."],"ans":0,"why":"점원은 손님을 돕는 사람이지만, 말을 걸 때는 예의를 지켜야 해요. '실례합니다'로 시작하면 점원도 기분 좋게 도와줄 수 있어요. 물건을 함부로 헤치면 다른 손님이 불편해지고 가게에도 피해가 가요.","say":"저기요, 실례합니다. 혹시 이 과자 더 있나요?","tip":"모르는 어른에게 말을 걸 때는 '저기요, 실례합니다'로 시작해요."},{"id":"sp1-6","scene":"식당","emoji":"🥢","title":"물을 더 주세요","situation":"식당에서 밥을 먹는데 물컵이 비었어요. 직원이 다른 테이블에서 일하고 계세요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["저기요, 물 좀 더 주시겠어요?","큰 소리로 '물!' 하고 외친다.","직원이 지나갈 때까지 아무것도 하지 않는다."],"ans":0,"why":"직원은 여러 손님을 동시에 돌봐요. '물 주세요'라고 부드럽게 부탁하면 직원도 기분 좋게 응할 수 있어요. 큰 소리로 부르면 옆 테이블 손님도 놀라고, 직원은 혼나는 것처럼 느껴요.","say":"저기요, 물 좀 더 주시겠어요? 감사합니다.","tip":"부탁 뒤에 '감사합니다'를 붙이면 같은 부탁도 훨씬 부드러워져요."},{"id":"sp1-7","scene":"온라인","emoji":"🎤","title":"온라인 수업에서 마이크가 꺼졌어요","situation":"온라인 수업을 듣다가 선생님이 내 이름을 불렀는데, 마이크가 꺼져 있어서 대답을 못 했어요. 수업이 끝난 뒤 선생님께 뭐라고 말하면 좋을까요?","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["선생님, 죄송해요. 마이크가 꺼져 있어서 대답을 못 했어요. 다음에는 수업 전에 미리 확인할게요.","선생님, 마이크 때문에 어쩔 수 없었어요. 그리고 아무 말도 하지 않는다.","선생님, 제 말 못 들으셨어요? 왜 자꾸 저만 불러요?"],"ans":0,"why":"선생님은 내가 대답을 일부러 안 한 줄 알고 서운해하거나 걱정하실 수 있어요. 무슨 일이 있었는지와 미안한 마음을 함께 말하면 선생님은 사정을 알고 안심해요. 핑계만 말하거나 아무 말도 하지 않으면 오해가 그대로 남아요.","say":"선생님, 죄송해요. 마이크가 꺼져 있어서 대답을 못 했어요. 다음부터는 수업 전에 꼭 확인할게요.","tip":"실수했을 때는 ①무슨 일이 있었는지 ②미안한 마음 ③다음에 어떻게 할지 순서로 말해 봐요."},{"id":"sp1-8","scene":"가족","emoji":"🧣","title":"할머니가 목도리를 만들어 주셨어요","situation":"할머니께서 며칠 동안 뜨개질을 해서 목도리를 만들어 주셨어요. 그런데 색이 내가 좋아하는 색은 아니에요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["와, 할머니가 직접 만드셨어요? 정말 고마워요. 따뜻하게 잘 할게요.","색이 별로예요. 이건 안 쓸래요.","아무 말 없이 선물을 내려놓고 나간다."],"ans":0,"why":"며칠 동안 정성 들여 만든 선물이라 할머니는 내 표정을 살피고 계세요. 색이 마음에 들지 않아도 '직접 만들어 주셨다'는 것과 고마운 마음을 먼저 말하면 할머니는 기분 좋게 웃으세요. 색 이야기만 하거나 아무 말 없이 두면 정성에 서운한 마음이 남아요.","say":"할머니, 직접 만드셨어요? 정말 고마워요. 따뜻하게 잘 할게요!","tip":"선물을 받으면 ①놀라움(직접 만드셨어요?) ②고마움 ③어떻게 쓸지 순서로 말해 봐요."},{"id":"sp1-9","scene":"이웃","emoji":"🏠","title":"아래층에서 시끄럽다고 했어요","situation":"집에서 공놀이를 하고 난 뒤, 아래층 이웃 아주머니가 뛰는 소리가 시끄럽다고 말했어요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["아이고 죄송해요. 앞으로는 소리가 나지 않게 조심할게요.","우리 집은 상관없어요.","아무 말 없이 문을 닫는다."],"ans":0,"why":"아래층에서는 발소리와 물건 떨어지는 소리가 훨씬 크게 들려요. 내가 일부러 그런 것이 아니어도 먼저 미안하다고 말하고 어떻게 조심할지 알려 주면 이웃의 마음이 풀리고, 우리 집도 편안하게 지낼 수 있어요.","say":"죄송해요, 아주머니. 앞으로는 소리가 나지 않게 조심할게요.","tip":"사과한 뒤에 \"어떻게 조심할지\"를 한 가지 덧붙이면 더 믿음직한 말이 돼요."},{"id":"sp1-10","scene":"학교","emoji":"📚","title":"친구가 숙제를 베끼게 해 달라고 해요","situation":"아침에 친구가 다가와서 \"네 숙제 좀 보여 줘. 그냥 베끼게만 해 줘.\" 하고 말했어요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["같이 풀어 보자. 내 답을 그대로 베끼면 너도 나도 배우는 게 없어.","알았어, 그냥 다 베껴 가.","싫어! 너는 왜 숙제를 안 했어?"],"ans":0,"why":"숙제를 베끼면 친구는 오늘 배울 것을 놓치고, 선생님은 친구가 할 수 있는 줄 잘못 알게 돼요. 거절하되 함께 푸는 방법을 내밀면 친구는 미안해하지 않고 도움을 받을 수 있어요. 그냥 베껴 주면 둘 다 손해이고, 화난 말로 거절하면 친구 마음만 상해요.","say":"같이 풀어 보자. 내 답을 그대로 베끼면 너도 나도 배우는 게 없어.","tip":"거절할 때는 ①따뜻하게 시작 ②왜 어려운지 ③대신 같이 할 일 순서로 말하면 마음이 상하지 않아요."},{"id":"sp1-11","scene":"가게","emoji":"🛒","title":"마트에서 물건이 어디 있는지 물어요","situation":"마트에서 사고 싶은 딸기 잼을 찾지 못했어요. 마침 점원 아저씨가 지나가세요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["실례지만, 딸기 잼은 어느 쪽에 있나요?","야, 딸기 잼 어디 있어요? 빨리 찾아 주세요.","아무 말 없이 진열대를 이리저리 뒤적인다."],"ans":0,"why":"점원에게 물을 때는 먼저 실례라고 부르고, 무엇을 찾는지 또박또박 말하면 금방 찾을 수 있어요. 반말로 재촉하면 점원은 기분이 상하고, 허락 없이 진열대를 뒤지면 물건이 엉망이 되어 다른 사람이 불편해져요.","say":"실례지만, 딸기 잼은 어느 쪽에 있나요?","tip":"부탁할 때는 ①실례지만 하고 부르기 ②찾는 물건 말하기 ③고맙다고 인사하기 순서로 하면 좋아요."}],"2":[{"id":"sp2-1","scene":"친구","emoji":"🧸","title":"장난감을 빌려 달래요","situation":"내가 아끼는 장난감을 가지고 놀고 있어요. 친구가 '나도 그거 빌려 줘'라고 해요. 그런데 나는 조금 아까워요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["이건 내가 조금만 더 놀고 있을게. 대신 저거 같이 하자!","안 줘! 내 거야!","싫은데 아무 말 없이 몰래 숨긴다."],"ans":0,"why":"빌려주기 싫은 마음은 자연스러워요. 하지만 '안 줘'라고만 하면 친구는 나를 미워하는 줄 알고 속상해해요. '내 마음'을 말하고 '대신 같이 할 것'을 제안하면 거절도 따뜻해져요.","say":"이건 내가 조금만 더 놀고 싶어. 대신 우리 같이 블록 하자, 조금 뒤에 빌려줄게.","tip":"거절할 때는 ①내 마음 ②대신 할 수 있는 일을 함께 말해요."},{"id":"sp2-2","scene":"친구","emoji":"😢","title":"친구가 속상해 보여요","situation":"쉬는 시간에 친구가 혼자 앉아 있고 울 것 같아 보여요. 물어보니 대답을 잘 못 해요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["괜찮아? 말하고 싶지 않으면 안 해도 돼. 나 여기 있을게.","왜 그래? 빨리 말해 봐.","다른 친구들과 재미있게 놀며 신경 쓰지 않는다."],"ans":0,"why":"속상한 사람은 해결책보다 곁에 있는 사람이 필요할 때가 많아요. '빨리 말해 봐'는 재촉이 되어 친구를 더 닫히게 해요. 말하고 싶지 않을 때도 있다는 걸 알아주면, 친구는 내가 편하게 느껴져요.","say":"괜찮아? 말하기 싫으면 말 안 해도 돼. 내가 옆에 있어 줄게.","tip":"기분을 물을 때는 '왜'보다 '요즘 어때'가 조금 더 편해요."},{"id":"sp2-3","scene":"학교","emoji":"🙋","title":"모둠에서 내 생각이 빠졌어요","situation":"모둠 활동에서 내가 낸 아이디어를 아무도 듣지 않았어요. 발표 준비를 하다가 친구가 내가 말한 것과 다른 내용을 발표하자고 해요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["잠깐, 내가 아까 말한 생각도 하나 들어 줄 수 있을까? 이유도 말해 볼게.","너희끼리 해, 나는 안 할래.","속으로만 화를 내고 아무 말도 하지 않는다."],"ans":0,"why":"내 의견이 무시당하면 속상해요. 그런데 화를 내거나 그만두면 모둠 일은 더 어려워져요. '지금 내 차례가 필요해'라고 차분히 말하고 근거를 보태면, 친구들도 다시 집중하게 돼요.","say":"잠깐만, 내가 말한 생각도 들어 줄래? 내가 왜 좋다고 생각하는지도 말해 볼게.","tip":"내 의견을 말할 때는 '나는 ~라고 생각해', '왜냐하면 ~이니까'를 붙여요."},{"id":"sp2-4","scene":"친구","emoji":"👟","title":"친구가 새 신발을 자랑해요","situation":"친구가 새 운동화를 신고 와서 자랑하고 있어요. 나는 그 신발이 그렇게 멋있다고 생각하지는 않아요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["와, 새 신발이구나! 신었을 때 편해?","그게 뭐가 예뻐.","아무 말 없이 신발을 쳐다보기만 한다."],"ans":0,"why":"친구는 칭찬을 받고 싶어서 자랑하는 게 아니라, 좋은 일을 나와 나누고 싶은 거예요. 내가 좋아하지 않는 색이라도 '새로 산 신발이 편한지' 물어봐 주면 친구는 신나서 이야기해요. 깎아내리면 친구는 자랑한 것을 부끄러워하게 돼요.","say":"와, 새 신발이구나! 신발 신고 뛰어 보니까 어때? 편해?","tip":"좋아하지 않아도 괜찮아요. 대신 '새로운 점'이나 '친구 마음'에 대해 물어봐 주세요."}],"3":[{"id":"sp3-1","scene":"이웃","emoji":"🔇","title":"윗집 소리가 시끄러워요","situation":"밤 10시가 넘었는데 윗집에서 쿵쿵 소리가 나요. 내일 아침 일찍 학교에 가야 해서 잠을 자야 해요.","q":"이럴 때 어떻게 말하면 좋을까요?","opts":["죄송한데, 아이가 일찍 자야 해서요. 조금만 조용히 해 주실 수 있을까요?","벽을 세게 두드려서 조용하라고 한다.","이웃에게 들리도록 큰 소리로 욕을 한다."],"ans":0,"why":"시끄러운 건 마음에 들지 않아요. 그런데 벽을 두드리거나 큰 소리를 내면 다툼이 커지고, 나중에 마주칠 때 더 불편해져요. '내 사정(일찍 자야 함)'을 먼저 말하고 부탁하면 상대도 들어주기 쉬워요.","say":"안녕하세요, 늦은 시간에 죄송해요. 아이가 일찍 자야 해서 그런데 조금만 조용히 부탁드려도 될까요?","tip":"부탁할 때는 내 사정을 먼저 말하면 상대가 방어하지 않아요."},{"id":"sp3-2","scene":"친구","emoji":"🤥","title":"친구가 거짓말을 했어요","situation":"친구가 어제 숙제를 안 했는데 했다고 말했어요. 나는 그게 사실이 아니라는 걸 알고 있어요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["어제 같이 놀았는데 숙제 안 했던 거 맞지? 내가 도와줄 수 있어.","너 거짓말쟁이야! 다 알 거야!","친구들 사이에 소문을 낸다."],"ans":0,"why":"친구가 거짓말을 하는 데는 혼날까 봐 두려운 마음이 숨어 있을 때가 많아요. 몰아세우면 더 크게 숨겨요. '내가 알고 있어'를 차분히 말하고 도움을 제안하면 친구는 사실을 말할 용기를 얻어요. 소문을 내는 것은 친구를 상처 입히는 일이에요.","say":"혹시 어제 숙제가 어려웠어? 힘들었으면 다음엔 같이 하자.","tip":"친구의 잘못을 알 때는 '네가 나빠'보다 '내가 도와줄 수 있어'가 먼저예요."},{"id":"sp3-3","scene":"온라인","emoji":"📱","title":"단톡방에서 장난이 심해졌어요","situation":"단체 대화방에서 친구 한 명을 계속 놀리는 메시지가 올라오고 있어요. 그 친구는 아무 말도 하지 않아요.","q":"이럴 때 뭐라고 하면 좋을까요?","opts":["이거 놀리는 게 아니라 상처 될 수도 있어. 그만하자.","나는 재미있으니까 웃긴 이모티콘을 보낸다.","같이 놀리면 나는 안 당한다."],"ans":0,"why":"화면에 보이지 않는 친구도 마음은 똑같이 아파요. 아무 말 없이 있는 친구는 더 외로울 수 있어요. 놀리는 대화에 같이 웃기만 해도 그 편이 되어 주는 셈이에요. 먼저 '그만하자'고 말하는 한 사람이 방의 분위기를 바꿔요.","say":"이거 그냥 장난처럼 보여도 그 애가 속상할 수 있어. 우리 그만하고 다른 얘기 하자.","tip":"온라인에서는 이모티콘 하나도 상처가 돼요. 웃긴 이모티콘을 보내기 전에 한 번 더 생각해요."},{"id":"sp3-4","scene":"학교","emoji":"🖍️","title":"친구 물건을 망가뜨렸어요","situation":"빌린 색연필을 떨어뜨려서심이 부러졌어요. 친구가 아직 모르고 있어요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["미안해, 내가 떨어뜨려서 심이 부러졌어. 내 색연필 줄게.","조용히 한쪽에 두고 모르는 척한다.","다른 친구가 망가뜨린 것처럼 말한다."],"ans":0,"why":"실수는 누구나 해요. 중요한 것은 실수 뒤의 행동이에요. 숨기면 친구는 나중에 알게 되었을 때 실수보다 서운함을 더 크게 느껴요. 먼저 말하고 물어 주려고 하면 친구는 '이 친구는 믿을 수 있다'고 느껴요.","say":"미안해. 내가 떨어뜨려서 심이 부러졌어. 내 색연필로 바꿔 줄게.","tip":"사과는 ①빨리 ②자세히 ③책임지고 세 단계로 해요."}],"4":[{"id":"sp4-1","scene":"친구","emoji":"🤝","title":"두 친구가 싸웠어요","situation":"두 친구가 장난감 하나 때문에 크게 다투었어요. 둘 다 나에게 '네가 판단해 봐'라고 해요.","q":"이럴 때 어떻게 말하면 좋을까요?","opts":["둘 다 이야기를 다 들어 볼게. 우리 같이 해결할 방법을 찾자.","한 친구 편을 들어서 내 친한 쪽을 돕는다.","판단하기 싫어서 가만히 있는다."],"ans":0,"why":"싸움 사이에서 편을 들면 진 친구는 나에게도 서운해해요. 판단을 미루고 양쪽 이야기를 다 들으면, 두 친구 모두 '내 말이 존중받았다'고 느껴요. 그 뒤에 규칙을 함께 정하면 스스로 해결하는 힘이 생겨요.","say":"내가 판단하는 건 아니고, 둘 말을 다 듣고 싶어. 먼저 네 이야기부터 들을게.","tip":"중재는 '누가 맞다'를 정하는 일이 아니라 '서로 이해하게 돕는' 일이에요."},{"id":"sp4-2","scene":"가족","emoji":"🗣️","title":"어른이 내 말을 끊어요","situation":"어른이 내 이야기를 듣다가 말을 끊고 자기 이야기를 하세요. 나는 아직 할 말이 남아 있어요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["죄송해요, 제가 하던 이야기를 조금만 더 해도 될까요?","아무 말 없이 방으로 들어간다.","어른 말을 끊고 더 크게 말한다."],"ans":0,"why":"어른과 말할 때도 내 이야기를 끝까지 하는 것은 예의 있어 받아야 할 권리예요. 다만 같은 방식으로 말을 끊으면 대화가 어긋나요. '제 이야기를 조금만 더'라고 차분히 부탁하면 어른도 알아차리고 들을 준비를 해요.","say":"잠깐만요, 제가 하던 이야기를 하나만 더 해도 될까요?","tip":"당당함과 예의는 함께 갈 수 있어요. 목소리 크기가 아니라 말의 순서가 중요해요."},{"id":"sp4-3","scene":"학교","emoji":"🦽","title":"도움이 필요한 친구","situation":"계단 앞에서 무거운 가방을 든 친구가 힘들어 보여요. 얼른 가방을 들어 주고 싶어요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["가방 무거워 보여. 들어 줘도 될까? 어떻게 도와주면 될까?","말없이 가방을 홱 잡아 든다.","어려 보이는데 모른 척 지나간다."],"ans":0,"why":"돕고 싶은 마음은 아주 좋아요. 그런데 말없이 가방을 잡아당기면 친구는 놀라고, 스스로 할 수 있는 일을 빼앗겼다고 느낄 수 있어요. '어떻게 도와주면 될까'라고 묻는 것은 친구의 선택을 존중하는 말이에요.","say":"가방이 무거워 보여. 같이 들어 줄까? 어떻게 하는 게 편할까?","tip":"도움은 주는 사람 마음이 아니라 받는 사람이 편한 방식으로 해요."},{"id":"sp4-4","scene":"가족","emoji":"😤","title":"화가 날 때","situation":"동생이 내 공책에 낙서를 했어요. 너무 화가 나서 소리를 지르고 싶어요.","q":"이럴 때 뭐라고 말하면 좋을까요?","opts":["동생아, 내 공책에 낙서해서 정말 속상해. 어떻게 할지 같이 이야기하자.","공책을 집어 던지고 방문을 쾅 닫는다.","아무 말 없이 동생 물건을 망가뜨린다."],"ans":0,"why":"화가 나는 마음은 맞아요. 하지만 화를 행동으로 보이면 동생은 '왜 화났는지'를 배우지 못하고 무서움만 기억해요. '속상해'라고 감정을 말로 이름 붙이면 마음이 조금 가라앉고, 동생도 자기 행동을 돌아보게 돼요.","say":"나 지금 많이 속상해. 공책에 낙서하면 안 되는 거 알지? 어떻게 할지 같이 정하자.","tip":"화날 때는 ①숨 한 번 ②'나는 ~해서 속상해' ③어떻게 할지 순서로 말해요."}]}};

어 내려요.","가운데에 짧은 가로획을 그어요.","맨 아래에 긴 가로획으로 닫아요."],"words":[{"w":"백성","m":"百姓 · 나라를 이루는 사람들"},{"w":"백년","m":"百年 · 백 해"}],"sentence":"백 원은 한자로 百 원이라고 써요."},{"c":"千","eum":"천","hun":"일천","bushu":"十","bushu_name":"열 십","strokes":[[58,16,44,26],[22,34,78,34],[50,34,50,84]],"steps":["위에서 왼쪽 아래로 짧게 삐쳐요.","가로로 길게 그어요.","가운데에서 아래로 세로획을 길게 그어요."],"words":[{"w":"천리","m":"千里 · 천 리나 되는 먼 길"},{"w":"천만","m":"千萬 · 아주 많은 수"}],"sentence":"천 원은 한자로 千 원이라고 써요."},{"c":"万","eum":"만","hun":"일만","bushu":"一","bushu_name":"한 일","strokes":[[20,24,80,24],[22,42,58,42,58,76,50,72],[78,32,34,84]],"steps":["맨 위에 가로획을 그어요.","가운데에서 오른쪽으로 갔다가 아래로 꺾어 갈고리처럼 맺어요.","오른쪽 위에서 왼쪽 아래로 길게 삐쳐요."],"words":[{"w":"만세","m":"萬歲 · 오래오래 건강하게 살라는 기쁜 인사"},{"w":"만원","m":"萬圓 · 만 원"}],"sentence":"만 원은 한자로 万 원이라고 써요."}],"quiz":[{"q":"읽기 글에서 천 원을 한자로 쓰면 어떻게 쓸까요?","opts":["千 원","百 원","万 원"],"ans":0,"why":"읽기 글에 천 원은 千 원이라고 쓴다고 나와요."},{"q":"읽기 글에서 百의 부수는 무엇인가요?","opts":["흰 백(白)","열 십(十)","한 일(一)"],"ans":0,"why":"읽기 글에 百은 흰 백(白)이 부수라고 나와요."},{"q":"읽기 글에서 '만세'를 한자로 쓰면 무엇인가요?","opts":["萬歲","百姓","千里"],"ans":0,"why":"읽기 글에 만세(萬歲)는 오래오래 건강하게 살라는 기쁜 인사라고 나와요."}]},{"id":"hj1-10","title":"다섯, 여섯, 일곱","topic":"숫자를 세는 한자 五 六 七","essay":"우리는 숫자를 셀 때 한자도 함께 써요. 다섯은 五(다섯 오), 여섯은 六(여섯 육), 일곱은 七(일곱 칠)이라고 써요.\n\n五는 가로획 두 개와 세로획, 꺾어 내리는 획으로 이루어져 있어요. 六은 위의 점 하나와 가로획, 아래의 삐침과 점으로 되어 있고, 七은 가로획 하나와 갈고리처럼 꺾어 내리는 획 하나로 아주 간단해요.\n\n달력에도 이 글자가 숨어 있어요. 오월은 五月, 유월은 六月, 칠월은 七月이라고 쓰지요. 주사위에서 다섯 눈이 나왔을 때도 五라고 적어요.\n\n오늘 배운 五 六 七을 손가락으로 공중에 크게 써 보세요. 몇 획인지 세면서 쓰면 더 잘 기억나요.","vocab":[{"w":"주사위","m":"던져서 나온 눈의 수로 노는 작은 정육면체"},{"w":"획","m":"글자를 이루는 한 번의 선"}],"key":"五(다섯 오) · 六(여섯 육) · 七(일곱 칠) — 달력과 주사위에 숨어 있는 숫자 한자!","chars":[{"c":"五","eum":"오","hun":"다섯","bushu":"二","bushu_name":"두 이","strokes":[[22,18,78,18],[50,18,50,44],[26,44,72,44,72,74],[20,74,80,74]],"steps":["맨 위에 긴 가로획을 그어요.","가운데에서 아래로 세로획을 내려요.","가로획을 긋고 오른쪽에서 아래로 꺾어 내려요.","맨 아래에 긴 가로획으로 닫아요."],"words":[{"w":"오월","m":"五月 · 한 해의 다섯째 달"},{"w":"오십","m":"五十 · 쉰"}],"sentence":"오월은 한자로 五月이라고 써요."},{"c":"六","eum":"육","hun":"여섯","bushu":"八","bushu_name":"여덟 팔","strokes":[[52,12,48,24],[22,32,80,32],[54,38,26,82],[58,48,78,78]],"steps":["가운데 위에 짧은 점을 찍어요.","그 아래에 가로획을 길게 그어요.","가운데에서 왼쪽 아래로 삐쳐 내려요.","오른쪽에 짧은 점을 찍어 내려요."],"words":[{"w":"유월","m":"六月 · 한 해의 여섯째 달"},{"w":"육십","m":"六十 · 예순"}],"sentence":"유월은 한자로 六月이라고 써요."},{"c":"七","eum":"칠","hun":"일곱","bushu":"一","bushu_name":"한 일","strokes":[[18,30,82,26],[62,14,62,62,50,78,40,74]],"steps":["가로획을 살짝 올라가게 그어요.","위에서 아래로 내려오다가 왼쪽으로 갈고리처럼 꺾어요."],"words":[{"w":"칠월","m":"七月 · 한 해의 일곱째 달"},{"w":"칠십","m":"七十 · 일흔"}],"sentence":"칠월은 한자로 七月이라고 써요."}],"quiz":[{"q":"읽기 글에서 다섯을 한자로 쓰면 무엇인가요?","opts":["五","六","七"],"ans":0,"why":"읽기 글에 다섯은 五(다섯 오)라고 쓴다고 나와요."},{"q":"읽기 글에서 유월을 한자로 쓰면 어떻게 쓸까요?","opts":["六月","五月","七月"],"ans":0,"why":"읽기 글에 유월은 六月이라고 쓴다고 나와요."},{"q":"한자 카드에서 五의 부수는 무엇인가요?","opts":["두 이","여덟 팔","한 일"],"ans":0,"why":"한자 카드에 五의 부수가 두 이(二)라고 나와요."}]}],"2":[{"id":"hj2-1","title":"물, 불, 하늘","topic":"水 火 天으로 읽는 자연","essay":"물이 흐르는 모습을 그리면 가운데 줄기가 있고, 양옆으로 물줄기가 흩어져요. 그 모양이 水이고 '물 수'라고 읽어요. 물은 모양이 정해져 있지 않아서, 컵에 담으면 컵 모양이 되고 강에 흐르면 길게 흘러요.\n\n불이 타오르는 모습은 위로 두 갈래로 솟아요. 그 모양을 그린 글자가 火이고 '불 화'라고 읽어요. 불은 따뜻하게 해 주지만, 잘못 다루면 위험해요. 그래서 옛사람들은 불을 조심해서 다루었어요.\n\n머리 위로 넓게 펼쳐진 곳이 하늘이에요. 天은 '하늘 천'이라고 읽어요. 天은 大(큰 대) 위에 가로획을 하나 더 얹은 모양이에요. 사람 위에 하늘이 있다는 뜻을 담았어요. 낮의 하늘은 日(해) 때문에 밝고, 밤의 하늘은 月(달)과 별로 반짝여요.","vocab":[{"w":"타오르다","m":"불이 세차게 위로 오르다"},{"w":"펼쳐지다","m":"넓게 열리다"}],"key":"水(물 수) · 火(불 화) · 天(하늘 천)","chars":[{"c":"水","eum":"수","hun":"물","bushu":"水","bushu_name":"물 수","strokes":[[50,12,50,70,42,82],[36,30,22,44,14,42],[44,46,30,64,20,82],[56,42,70,62,84,84]],"steps":["가운데 세로획을 내려 살짝 꺾어요.","왼쪽에 짧은 획을 그어요.","왼쪽 아래로 비스듬히 그어요.","오른쪽 아래로 비스듬히 그어요."],"words":[{"w":"수영","m":"물에서 헤엄침"},{"w":"수도","m":"물이 나오는 시설"}],"sentence":"물을 한자로 쓰면 水예요."},{"c":"火","eum":"화","hun":"불","bushu":"火","bushu_name":"불 화","strokes":[[36,20,28,34,20,42],[64,20,72,34,80,42],[52,28,44,56,30,86],[52,42,64,64,80,88]],"steps":["왼쪽에 작은 불씨를 그어요.","오른쪽에 작은 불씨를 그어요.","가운데에서 tence":"힘을 한자로 쓰면 力이에요."},{"c":"生","eum":"생","hun":"날","bushu":"生","bushu_name":"날 생","strokes":[[50,10,38,26,28,34],[20,34,80,34],[30,54,72,54],[50,34,50,88],[20,74,80,74]],"steps":["맨 위에 삐침을 그어요.","가로획을 그어요.","가운데에 짧은 가로획을 그어요.","세로획으로 줄기를 내려그어요.","아래에 긴 가로획을 그어 뿌리를 받쳐요."],"words":[{"w":"생활","m":"살아가는 모양"},{"w":"학생","m":"배우는 사람"}],"sentence":"풀싹이 올라오는 모양을 그린 글자가 生이에요."}],"quiz":[{"q":"읽기 글에서 田은 어떤 모양을 그린 글자라고 했나요?","opts":["네모난 땅이 여러 칸으로 나뉜 모양","불이 타오르는 모양","사람이 서 있는 모양"],"ans":0,"why":"글에 '위에서 내려다보면 네모난 땅이 여러 칸으로 나뉘어 있어요. 그 모양이 田'이라고 나와요."},{"q":"읽기 글에 나온 力이 들어간 말은 무엇인가요?","opts":["노력","마음","입구"],"ans":0,"why":"글에 '노력, 체력 같은 말에 力이 들어 있어요'라고 나와요. 마음은 心이에요."},{"q":"읽기 글에 나온 대로 生은 무엇이 땅을 뚫고 올라오는 모양인가요?","opts":["풀싹","불씨","물줄기"],"ans":0,"why":"글에 '生은 풀싹이 땅을 뚫고 올라오는 모양'이라고 나와요."}]},{"id":"hj2-3","title":"손과 마음과 입","topic":"手 心 口 — 내 몸과 마음","essay":"손가락을 펼친 손을 그리면 다섯 갈래로 뻗은 모양이에요. 그 모양이 手이고 '손 수'라고 읽어요. 손은 물건을 잡고, 글을 쓰고, 쓰다듬는 일을 해요. 손으로 하는 일을 나타내는 말에는 手가 자주 들어가요. 손을 씻는 일은 아주 중요해요.\n\n가슴 안에서 두근두근 뛰는 것이 마음이에요. 마음을 그린 글자가 心이고 '마음 심'이라고 읽어요. 心은 '마음을 쓰다'는 뜻으로도 쓰여요. 관심, 안심, 열심 같은 말에 心이 들어 있어요. 마음은 눈에 보이지 않지만, 말과 행동으로 드러나요.\n\n얼굴 가운데에 있는 입을 그린 글자가 口이고 '입 구'라고 읽어요. 口는 사방이 막힌 네모 모양이에요. 口는 입으로 하는 말, 또는 입이 있는 곳을 나타내요. 입구는 길이 들어가는 곳이라서 口가 들어 있어요.","vocab":[{"w":"쓰다듬다","m":"손으로 살살 만지다"},{"w":"드러나다","m":"겉으로 보이다"}],"key":"手(손 수) · 心(마음 심) · 口(입 구)","chars":[{"c":"手","eum":"수","hun":"손","bushu":"手","bushu_name":"손 수","strokes":[[50,10,38,28,28,36],[20,40,80,40],[30,58,74,58],[52,24,52,82,44,90]],"steps":["위에 짧은 삐침을 그어요.","긴 가로획을 그어요.","아래에 짧은 가로획을 그어요.","세로획을 내려 손가락을 세워요."],"words":[{"w":"수건","m":"손이나 몸을 닦는 천"},{"w":"세수","m":"얼굴을 씻음"}],"sentence":"손을 한자로 쓰면 手예요."},{"c":"心","eum":"심","hun":"마음","bushu":"心","bushu_name":"마음 심","strokes":[[32,40,24,54,20,62],[40,48,44,72,58,82,76,68],[52,32,52,44,50,50],[76,42,84,54,86,62]],"steps":["왼쪽에 점을 찍어요.","가운데를 길게 굽혀 그어요.","가운데 위에 점을 찍어요.","오른쪽에 점을 찍어요."],"words":[{"w":"관심","m":"마음을 쓰고 살핌"},{"w":"안심","m":"마음을 놓음"}],"sentence":"마음을 한자로 쓰면 心이에요."}
