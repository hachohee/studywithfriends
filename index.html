const HISTORY_START = '2026-11-21';   // 한국사 1번 주제를 시작한 날. 주제는 videos.json 순서(= 시대순)대로 하루에 하나씩 넘어가요   // 하루 문제 수 = 한 영상의 문제 묶음 (나머지 과목은 1)
function videoGroups(sub) {
  const g = new Map();
  bankOf(sub).forEach((it, i) => { const v = String(it.id).split('-q')[0]; if (!g.has(v)) g.set(v, []); g.get(v).push(i); });
  return [...g.values()];
}
function dailyIdxs(sub, d, pid) {
  pid = pid || state.activeId;
  const lv = levelOf(pid, sub.id);
  if (sub.id === 'english') return dailySentIdxs(d, lv);        // 오늘의 문장 3개 = 오늘의 퀴즈 3개
  if (sub.id === 'hanja') return hanjaDayIdxs(d, lv);           // 오늘의 한자 3개 + 그 글의 문제 3개
  if (sub.id === 'speak') {                                     // 하루 1상황
    const n = Math.max(1, quizPool('speak', lv).length);
    return [(dayNumber(d) + (sub.rot || 0)) % n];
  }
  const per = PER_DAY[sub.id] || 1;
  const groups = (lv === 1 ? videoGroups(sub) : poolGroups(quizPool(sub.id, lv))).filter(g => g.length >= per);
  if (per === 1 || !groups.length) return [rotIndex(sub, d, lv)];
  if (sub.id === 'history') {   // 시대순 차근차근: 시작일부터 주제 1, 2, 3… 순서대로 (끝나면 처음부터), 한 바퀴마다 다른 문제 2개
    const n = Math.max(0, dayNumber(d) - dayNumber(new Date(HISTORY_START + 'T12:00:00+09:00')));
    const g = groups[n % groups.length], round = Math.floor(n / groups.length);
    return Array.from({ length: per }, (_, k) => g[(round + k) % g.length]);
  }
  return groups[(dayNumber(d) + (sub.rot || 0)) % groups.length].slice(0, per);
}
function dailyIndex(sub, d, pid) { return (PER_DAY[sub.id] || 1) > 1 ? dailyIdxs(sub, d, pid)[0] : rotIndex(sub, d, levelOf(pid || state.activeId, sub.id)); }
function rotIndex(sub, d, lv) {
  const n = quizPool(sub.id, lv || 1).length;
  if (!n) return 0;
  return (dayNumber(d) + (sub.rot || 0)) % n;
}
function dailyItem(sub, d, pid) { return poolItem(sub, dailyIndex(sub, d, pid), pid); }
/* 수학 오늘의 문제: 종류별로 그 단계의 은행에서 날짜 순환 (MATH_PLAN) */
const MATH_PLAN = [['연산', 5], ['사고력', 2], ['서술형', 3]];
const MATH_TOTAL = MATH_PLAN.reduce((n, p) => n + p[1], 0);
function mathBankOf(lv) { return (lv && lv > 1 && MATH_LEVELS[lv]) ? MATH_LEVELS[lv] : MATH_BANK; }
function mathDaily(d, lv) {
  /* lv를 안 넘기면 그 아이의 지금 단계를 쓴다 — 화면과 완료 판정이 같은 문제를 보게. */
  const day = dayNumber(d), bank = mathBankOf(lv || levelOf(state.activeId, 'math'));
  return MATH_PLAN.map(([kind, n]) => {
    const ids = bank.map((q, i) => (q.kind === kind ? i : -1)).filter(i => i >= 0);
    const use = ids.length ? ids : bank.map((q, i) => i);
    return { kind, list: Array.from({ length: n }, (_, j) => use[(day * n + j) % use.length]) };
  });
}
/* 오늘의 수학 문제 목록은 그날 처음 계산한 그대로 하루 동안 쓴다.
   매일 문제가 은행 뒤에 덧붙거나 앱이 새 버전으로 바뀌어도, 하루 중간에 문제 목록이
   바뀌어 방금 푼 문제가 사라지고 '진행 중'으로 되돌아가는 일이 없게. */
function mathDaySets(d, pid, lv) {
  const p = pid || state.activeId, day = todayKey(d), L = lv || levelOf(p, 'math');
  if (!state.mathDay) state.mathDay = {};
  const mine = state.mathDay[p] || (state.mathDay[p] = {});
  const bank = mathBankOf(L);
  const saved = mine[day];
  if (saved && saved.lv === L && Array.isArray(saved.sets) && saved.sets.length === MATH_PLAN.length &&
      saved.sets.every(g => (g.list || []).length && g.list.every(i => i >= 0 && i < bank.length))) return saved.sets;
  const sets = mathDaily(d, L);
  mine[day] = { lv: L, sets: sets };
  const cut = todayKey(new Date(refNow().getTime() - 7 * 86400000));   // 지난 날짜는 7일치만
  Object.keys(mine).forEach(k => { if (k < cut) delete mine[k]; });
  persist();
  return sets;
}
const DAILY_SENTENCES = 3;   // 오늘의 영어 문장 개수 (3문장 + 뜻 퀴즈 3문제)
function dailySentIdxs(d, lv) {
  const n = Math.max(1, (SENT_BY_LEVEL.english[lv || 1] || ALL_SENTENCES).length);
  // 문장 수와 서로소인 걸음(step)이어야 하루 3문장이 겹치지 않고 한 바퀴 다 돈다
  const gcd = (a, b) => (b ? gcd(b, a % b) : a);
  let step = 7;
  while (gcd(step, n) !== 1) step += 1;
  return Array.from({ length: DAILY_SENTENCES }, (_, j) => ((dayNumber(d) * DAILY_SENTENCES + j) * step + 3) % n);
}

/* 기존 퀴즈 배열을 '검증된 영상 퀴즈'로 교체 (영상 1편 = 문제 1개) */
function stableShuffleOpts(q, opts, ans) {
  let a = 2166136261; for (const ch of q) { a = Math.imul(a ^ ch.charCodeAt(0), 16777619); }
  const rnd = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const order = opts.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  return { opts: order.map(i => opts[i]), ans: order.indexOf(ans) };
}
SUBJECTS.forEach((s, i) => {
  s.rot = i * 2;
  if (s.id === 'math') { s.quiz = MATH_BANK; return; }   // 수학: 영상 없음
  if (s.id === 'english') {   // 영어: 영상 없음 — 오늘의 문장 뜻 맞히기 (문장 번호 = 문제 번호)
    s.quiz = ALL_SENTENCES.map((st, k) => {
      const n = ALL_SENTENCES.length, wrong = [];
      for (let d = 1; wrong.length < 2 && d < n; d += 3) {
        const ko = ALL_SENTENCES[(k + d) % n].ko;
        if (ko !== st.ko && !wrong.includes(ko)) wrong.push(ko);
      }
      const q = '영어 문장 "' + st.en + '"의 뜻은 무엇일까요?';
      return { q, ...stableShuffleOpts(q, [st.ko].concat(wrong), 0), why: '"' + st.en + '" = ' + st.ko + ' · ' + st.tip, key: st.en + ' = ' + st.ko };
    });
    return;
  }
  const b = bankOf(s);
  if (b.length) {
    s.quiz = b.map(it => ({
      q: it.q, ...stableShuffleOpts(it.q, it.opts, it.ans), why: it.why, key: it.key,
      topic: it.topic || '', essay: it.essay || '', vocab: it.vocab || [],
      video: { title: it.title, ch: it.ch, dur: it.dur, dur_label: it.dur_label, url: it.url, summary: it.summary }
    }));
  }
});

/* ── 1-c. 난이도: 아이(자리)별 · 과목별 자동 조절 — 이번에 새로 더한 부분 ──────────
   · 기존 5과목과 새 2과목 모두 1단계(초1 2학기)에서 시작해요.
   · 오늘 문제를 연속 5개 맞히면 '다음 날부터' 한 단계 위, 연속 3개 틀리면 '다음 날부터' 한 단계 아래로 가요.
   · 한 번에 여러 단계가 오르지 않도록, 단계 변경은 하루에 과목별 한 번씩만 예약돼요.
   · 단계는 이 폰(localStorage)에만 저장하고 친구들 폰(도장)으로는 보내지 않아요
     → 도장판에는 예전처럼 '완료 도장'만 찍히고, 난이도는 서로 보이지 않아요.
   · 기존 데이터는 손대지 않고, 2~4단계 문제·글을 뒤에 덧붙였어요. */
const LEVEL_MIN = 1;
const LEVEL_CAP = 4;                      // 지금 준비된 가장 높은 단계
const LEVEL_UP_STREAK = 5;
const LEVEL_DOWN_STREAK = 3;
const LEVEL_GRADE = { 1: '초1 2학기', 2: '초2', 3: '초3', 4: '초4', 5: '초5' };
const LEVEL_NAME = { 1: '기본', 2: '한 걸음', 3: '두 걸음', 4: '깊이', 5: '더 깊이' };
const LEVEL_ICON = { 1: '🌱', 2: '🌿', 3: '🌳', 4: '🌲', 5: '🏔️' };

function levelCap(/* sid */) { return LEVEL_CAP; }
function levelBox(store, pid) { if (!store[pid]) store[pid] = {}; return store[pid]; }

/* 오늘 이 아이가 이 과목에서 풀 단계 */
function levelOf(pid, sid) {
  pid = pid || state.activeId;
  if (!state.levels) state.levels = {};
  const mine = levelBox(state.levels, pid);
  const pend = state.levelNext && state.levelNext[pid] && state.levelNext[pid][sid];
  if (pend && pend.from <= todayKey()) {          // 예약된 단계는 다음 날부터 적용
    mine[sid] = pend.lv;
    delete state.levelNext[pid][sid];
    persist();
  }
  const lv = mine[sid] || LEVEL_MIN;
  return Math.min(levelCap(sid), Math.max(LEVEL_MIN, lv));
}
function nextLevelOf(pid, sid) {
  const p = state.levelNext && state.levelNext[pid];
  return (p && p[sid]) || null;
}
function streakOf(pid, sid) {
  pid = pid || state.activeId;
  if (!state.streaks) state.streaks = {};
  const mine = levelBox(state.streaks, pid);
  if (!mine[sid]) mine[sid] = { ok: 0, no: 0 };
  return mine[sid];
}
function queueLevel(pid, sid, lv) {
  if (!state.levelNext) state.levelNext = {};
  const mine = levelBox(state.levelNext, pid);
  mine[sid] = { lv: lv, from: todayKey(new Date(refNow().getTime() + 86400000)) };   // 내일부터
}

/* 답 하나를 기록하고, 규칙에 닿았으면 단계 변경을 '내일부터'로 예약 */
function noteAnswer(sid, ok, pid) {
  pid = pid || state.activeId;
  if (!SUBJECT_BY_ID[sid]) return null;
  const s = streakOf(pid, sid), lv = levelOf(pid, sid);
  if (ok) { s.ok = (s.ok || 0) + 1; s.no = 0; }
  else { s.no = (s.no || 0) + 1; s.ok = 0; }
  let change = null;
  if (ok && s.ok >= LEVEL_UP_STREAK && lv < levelCap(sid)) { queueLevel(pid, sid, lv + 1); s.ok = 0; change = 'up'; }
  else if (!ok && s.no >= LEVEL_DOWN_STREAK && lv > LEVEL_MIN) { queueLevel(pid, sid, lv - 1); s.no = 0; change = 'down'; }
  persist();
  return change;
}

/* 오늘 이 아이의 단계 배지 (과목 화면 맨 위 · 친구에게는 보이지 않아요) */
function levelChipHTML(sub) {
  const lv = levelOf(state.activeId, sub.id), cap = levelCap(sub.id);
  const s = streakOf(state.activeId, sub.id), pend = nextLevelOf(state.activeId, sub.id);
  const dots = Array.from({ length: cap }, function (_, k) { return '<i class="' + (k < lv ? 'on' : '') + '"></i>'; }).join('');
  const note = pend
    ? '내일부터 <b>' + pend.lv + '단계</b> (' + LEVEL_GRADE[pend.lv] + ')'
    : (s.ok ? '연속 정답 <b>' + s.ok + '/' + LEVEL_UP_STREAK + '</b> → 다음 단계까지 한 걸음'
      : (lv >= cap ? '지금은 준비된 가장 높은 단계예요. 계속 맞혀 봐요!' : '연속 ' + LEVEL_UP_STREAK + '개 맞히면 다음 단계로 올라가요'));
  return '<div class="lv-chip"><span class="lv-badge">' + LEVEL_ICON[lv] + ' ' + lv + '단계</span>' +
    '<span class="lv-name">' + LEVEL_GRADE[lv] + ' · ' + LEVEL_NAME[lv] + '</span>' +
    '<span class="lv-dots">' + dots + '</span></div>' +
    '<div class="lv-note">' + note + '</div>';
}

/* ── 1-d. 단계별 문제 은행 만들기 (기존 1단계는 그대로 쓰고, 2~4단계를 덧붙임) ── */
const QUIZ_BY_LEVEL = {};                 // sid → { 단계: [문제...] }
const SENT_BY_LEVEL = { english: {} };    // 영어: 단계 → 문장 배열
const HANJA_PER_DAY = 3;                  // 하루에 배우는 한자 수 (= 세트당 퀴즈 수)

function englishQuizOf(sents) {
  return sents.map(function (st, k) {
    const n = sents.length, wrong = [];
    for (let d = 1; wrong.length < 2 && d < n; d += 3) {
      const ko = sents[(k + d) % n].ko;
      if (ko !== st.ko && wrong.indexOf(ko) < 0) wrong.push(ko);
    }
    const q = '영어 문장 "' + st.en + '"의 뜻은 무엇일까요?';
    return { q: q, ...stableShuffleOpts(q, [st.ko].concat(wrong), 0), why: '"' + st.en + '" = ' + st.ko + ' · ' + st.tip, key: st.en + ' = ' + st.ko, sentIdx: k };
  });
}

function hanjaQuizLevels() {
  const out = {};
  Object.keys(HANJA_SETS || {}).forEach(function (lv) {
    out[lv] = [];
    (HANJA_SETS[lv] || []).forEach(function (set) {
      (set.quiz || []).forEach(function (z, k) {
        out[lv].push({
          q: z.q, ...stableShuffleOpts(z.q, z.opts, z.ans), why: z.why,
          key: set.key, topic: set.topic, essay: set.essay, vocab: set.vocab || [],
          hjSet: set, hjQ: k, grp: set.id
        });
      });
    });
  });
  return out;
}

function speakQuizLevels() {
  const out = {};
  const src = (LEVEL_POOLS && LEVEL_POOLS.speak) || {};
  Object.keys(src).forEach(function (lv) {
    out[lv] = src[lv].map(function (it) {
      return {
        q: it.q, ...stableShuffleOpts(it.q, it.opts, it.ans), why: it.why,
        key: it.say, topic: it.title, scene: it.scene, emoji: it.emoji || '💬',
        situation: it.situation, say: it.say, tip: it.tip, grp: it.id
      };
    });
  });
  return out;
}

function buildLevelPools() {
  SUBJECTS.forEach(function (sub) {
    const byLv = {};
    if (sub.id === 'math') {
      byLv[1] = MATH_BANK;                                  // 기존 은행 그대로
      [2, 3, 4].forEach(function (lv) { if (MATH_LEVELS && MATH_LEVELS[lv]) byLv[lv] = MATH_LEVELS[lv]; });
    } else if (sub.id === 'english') {
      SENT_BY_LEVEL.english[1] = ALL_SENTENCES;             // 기존 30문장 그대로
      byLv[1] = englishQuizOf(ALL_SENTENCES);
      [2, 3, 4].forEach(function (lv) {
        const pool = (LEVEL_POOLS.english || {})[lv];
        if (!pool || !pool.length) return;
        const sents = pool.map(function (s, i) { return { en: s.en, ko: s.ko, tip: s.tip, emoji: s.emoji || '🔤', idx: i }; });
        SENT_BY_LEVEL.english[lv] = sents;
        byLv[lv] = englishQuizOf(sents);
      });
    } else if (sub.id === 'hanja') {
      const src = hanjaQuizLevels();
      Object.keys(src).forEach(function (lv) { byLv[lv] = src[lv]; });
    } else if (sub.id === 'speak') {
      const src = speakQuizLevels();
      Object.keys(src).forEach(function (lv) { byLv[lv] = src[lv]; });
    } else {
      byLv[1] = sub.quiz;                                   // 기존 5과목 1단계 그대로
      [2, 3, 4].forEach(function (lv) {
        const pool = (LEVEL_POOLS[sub.id] || {})[lv];
        if (!pool || !pool.length) return;
        byLv[lv] = pool.map(function (it) {
          return {
            q: it.q, ...stableShuffleOpts(it.q, it.opts, it.ans), why: it.why, key: it.key,
            topic: it.topic || '', essay: it.essay || '', vocab: it.vocab || [],
            grp: String(it.id || it.topic || '').replace(/-q\d+$/, '')
          };
        });
      });
    }
    QUIZ_BY_LEVEL[sub.id] = byLv;
  });
}
buildLevelPools();

/* 단계별 문제 목록 (없으면 1단계) */
function quizPool(sid, lv) {
  const b = QUIZ_BY_LEVEL[sid] || {};
  return b[lv] || b[1] || [];
}
function poolItem(sub, qi, pid) {
  if (!sub) return null;
  const lv = levelOf(pid || state.activeId, sub.id);
  const pool = quizPool(sub.id, lv);
  return pool[qi] || (sub.quiz || [])[qi] || null;
}
function poolLength(sub, pid) { return quizPool(sub.id, levelOf(pid || state.activeId, sub.id)).length; }
function hanjaSetOf(sub, pid) {
  const items = quizPool('hanja', levelOf(pid || state.activeId, 'hanja'));
  const it = items[dailyIdxs(sub, undefined, pid)[0]];
  return it && it.hjSet ? it.hjSet : null;
}
function hanjaSetsAtLevel(lv) { return HANJA_SETS[lv] || []; }

/* ── 1-e. 오늘의 문제 번호(단계 반영) ── */
function poolGroups(items) {              // 같은 글·같은 인물끼리 묶기 (단계별 은행용)
  const g = new Map();
  items.forEach(function (it, i) {
    const k = it.grp || String(it.id || '').replace(/-q\d+$/, '') || ('x' + i);
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(i);
  });
  return [...g.values()];
}
function hanjaDayIdxs(d, lv) {
  /* 오늘의 세트 하나를 통째로 쓴다 — 세트 안 문제 수가 3개가 아니어도
     다른 세트 문제가 섞이거나 어떤 세트는 영영 안 나오는 일이 없게. */
  const items = quizPool('hanja', lv || 1);
  if (!items.length) return [];
  const keyOf = function (it, i) { return (it.hjSet && it.hjSet.id) || it.grp || ('x' + i); };
  const keys = [];
  items.forEach(function (it, i) { const k = keyOf(it, i); if (keys.indexOf(k) < 0) keys.push(k); });
  const k = ((dayNumber(d) % keys.length) + keys.length) % keys.length;
  const idxs = [];
  items.forEach(function (it, i) { if (keyOf(it, i) === keys[k]) idxs.push(i); });
  return idxs.slice(0, HANJA_PER_DAY);
}

/* 한국사·위인·시사상식 = 영상 대신 '오늘의 읽기 글(에세이)'로 공부하는 과목 */
const ESSAY_SUBJECTS = ['history', 'hero', 'news'];
function isEssaySub(sub) { return !!sub && ESSAY_SUBJECTS.indexOf(sub.id) >= 0; }

const EMOJI_CHOICES = ['🐍','🦁','🐰','🐶','🐱','🦊','🐼','🐨','🐯','🐻','🐷','🐸','🐵','🦄','🐧','🐢','🦋'];
const DEFAULT_PROFILES = [
  { id: 'p1', name: '찬우', emoji: '🐍' },
  { id: 'p2', name: '친구 2', emoji: '🐰' },
  { id: 'p3', name: '친구 3', emoji: '🐶' },
  { id: 'p4', name: '친구 4', emoji: '🐱' },
  { id: 'p5', name: '친구 5', emoji: '🦊' }
];

/* ─────────────────────────── 2. SyncAdapter ───────────────────────────
   앱의 저장·공유는 오직 이 인터페이스를 통해서만 이뤄집니다.
   나중에 5명 폰끼리 실시간 공유(Supabase 등)를 붙일 때는
   아래 어댑터를 하나 더 만들어 setAdapter()로 갈아끼우기만 하면 됩니다.

   갖춰야 할 메서드
     async load()               → {profiles, activeId, progress, settings}
     async save(state)          → 저장 (전체 스냅샷)
     subscribe(onChange)        → unsubscribe 함수. 다른 폰의 변경을 알려줄 때 사용
   ─────────────────────────────────────────────────────────────────── */
const STORE_KEY = 'kidsStudyApp.v1';

const LocalStorageAdapter = {
  name: 'local',
  async load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  },
  async save(state) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 저장 불가 환경: 메모리로만 동작 */ }
  },
  subscribe(/* onChange */) { return () => {}; }
};

const SyncAdapter = {
  adapter: LocalStorageAdapter,
  setAdapter(a) { this.adapter = a; },
  async load() { return this.adapter.load(); },
  async save(state) { return this.adapter.save(state); },
  subscribe(cb) { return this.adapter.subscribe(cb); }
};

   - 인터넷이 없으면 이 폰(localStorage)에 먼저 저장하고 큐에 쌓아 두었다가
     연결되면 자동으로 올려요. (오프라인에서도 앱은 그대로 동작)
   ─────────────────────────────────────────────────────────────────── */

function cleanRoom(s) {
  const v = String(s || '').toLowerCase().replace(/[^a-z0-9\-]/g, '').slice(0, 40);
  return v || ROOM_DEFAULT;
}
function readRoom() {
  try {
    const m = /[?&]room=([^&#]+)/.exec(location.search);
    if (m) {
      const r = cleanRoom(decodeURIComponent(m[1]));
      try { localStorage.setItem(ROOM_STORE, r); } catch (e) {}
      return r;
    }
    const s = localStorage.getItem(ROOM_STORE);
    if (s) return cleanRoom(s);
  } catch (e) {}
  return ROOM_DEFAULT;
}

async function sbReq(path, opts) {
  opts = opts || {};
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
  if (opts.prefer) headers.Prefer = opts.prefer;
  const res = await fetch(SB_URL + path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    cache: 'no-store'
  });
  if (!res.ok) {
    let msg = '';
    try { msg = (await res.text()).slice(0, 160); } catch (e) {}
    const err = new Error('HTTP ' + res.status + ' ' + msg);
    err.status = res.status;
    throw err;
  }
  const txt = await res.text();
  try { return txt ? JSON.parse(txt) : null; } catch (e) { return null; }
}

function loadQueue() {

    const raw = localStorage.getItem(QUEUE_STORE);

  } catch (e) { syncQueue = []; }

function saveQueue() {

function opKey(o) {
  if (o.t === 'profile') return 'p|' + o.room + '|' + o.slot;
  if (o.t === 'stamp') return 's|' + o.room + '|' + o.slot + '|' + o.date_kst + '|' + o.subject;
  return o.t + '|' + (o.room || '') + '|' + (o.slot == null ? '' : o.slot) + '|' + (o.date_kst || '');
}
function enqueue(op) {
  const k = opKey(op);
  const i = syncQueue.findIndex(x => opKey(x) === k);
  if (i >= 0) syncQueue.splice(i, 1);
  syncQueue.push(op);
  saveQueue();
  if (view !== 'join') flushQueue();
}
async function sendOp(op) {
  if (op.t === 'profile') {
    return sbReq('/rest/v1/kids_study_profiles', {
      method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal',
      body: [{ room_id: op.room, slot: op.slot, name: op.name, avatar: op.avatar, updated_at: op.updated_at }]
    });
  }
  if (op.t === 'stamp') {
    return sbReq('/rest/v1/kids_study_stamps', {
      method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal',
      body: [{ room_id: op.room, slot: op.slot, date_kst: op.date_kst, subject: op.subject, earned_at: op.earned_at }]
    });
  }
  if (op.t === 'del-stamp-day') {
    return sbReq('/rest/v1/kids_study_stamps?room_id=eq.' + encodeURIComponent(op.room) + '&slot=eq.' + op.slot + '&date_kst=eq.' + encodeURIComponent(op.date_kst), { method: 'DELETE', prefer: 'return=minimal' });
  }
  if (op.t === 'del-stamps') {
    return sbReq('/rest/v1/kids_study_stamps?room_id=eq.' + encodeURIComponent(op.room) + '&slot=eq.' + op.slot, { method: 'DELETE', prefer: 'return=minimal' });
  }
  return null;
}
async function flushQueue() {
  if (flushing || !syncQueue.length) return;
  if (!navigator.onLine || !tablesReady) return;
  flushing = true;
  try {
    while (syncQueue.length) {
      const op = syncQueue[0];
      try {
        await sendOp(op);
        syncQueue.shift(); saveQueue();
      } catch (e) {
        const st = e && e.status;
        if (st && st >= 400 && st < 500 && st !== 429) {
          // 형식·권한 오류는 몇 번을 보내도 같으니 큐에서 빼고 다음 것으로
          syncQueue.shift(); saveQueue();
          syncError = String((e && e.message) || e);
          continue;
        }
        throw e;
      }
    }
    syncError = '';
  } catch (e) {
    syncError = String((e && e.message) || e);
    setSyncStatus('off');
  } finally { flushing = false; }
}

/* ── 올리기 ── */
function activeSlotIndex() {

function isPlaceholderName(n) { return !n || String(n).indexOf('친구') === 0; }
function pushProfile(slot) {
  if (slot == null || slot < 0 || slot > 4) return;
  const p = state.profiles[slot]; if (!p) return;
  const at = new Date().toISOString();
  state.syncMeta = state.syncMeta || {};
  state.syncMeta[slot] = at;
  try { SyncAdapter.save(state); } catch (e) {}
  enqueue({ t: 'profile', room: roomId, slot: slot, name: String(p.name || '').slice(0, 8), avatar: p.emoji, updated_at: at });
}
function pushProfileSoon(slot) {

function pushStampFor(pid, sid) {

  if (slot < 0) return;
  enqueue({ t: 'stamp', room: roomId, slot: slot, date_kst: todayKey(), subject: sid, earned_at: new Date().toISOString() });
}
function pushTodayStamps(slot) {

/* ── 당겨오기(merge) ── */
function tsKey(s) { return String(s || '').slice(0, 19); }
function loadRemote() {
  try {
    const raw = localStorage.getItem(REMOTE_STORE);
    const v = raw ? JSON.parse(raw) : null;
    if (v && typeof v === 'object') remoteStamps = v;
  } catch (e) { remoteStamps = {}; }
}
function saveRemote() {
  try { localStorage.setItem(REMOTE_STORE, JSON.stringify(remoteStamps)); } catch (e) {}
}
function applyProfiles(rows) {
  let changed = false;
  state.syncMeta = state.syncMeta || {};
  (rows || []).forEach(function (r) {
    const i = Number(r.slot);
    if (!(i >= 0 && i < 5)) return;
    if (Date.now() - (lastProfileEditAt[i] || 0) < 3000) return;   // 방금 이 폰에서 고친 이름은 덮지 않음
    const p = state.profiles[i]; if (!p) return;
    const at = tsKey(r.updated_at);
    if (tsKey(state.syncMeta[i] || '') > at) return;   // 이 폰에서 더 최근에 고친 이름
    const nm = String(r.name || '').slice(0, 8);
    if (nm && nm !== p.name) { p.name = nm; changed = true; }
    if (r.avatar && r.avatar !== p.emoji) { p.emoji = r.avatar; changed = true; }
    if (at) state.syncMeta[i] = at;
  });
  return changed;
}
function applyStamps(rows) {
  const next = {};
  (rows || []).forEach(function (r) {
    const i = Number(r.slot);
    if (!(i >= 0 && i < 5)) return;
    const p = state.profiles[i]; if (!p) return;
    const d = String(r.date_kst || '').slice(0, 10);
    if (!d) return;
    const byDay = next[p.id] || (next[p.id] = {});
    const sub = byDay[d] || (byDay[d] = {});
    sub[String(r.subject)] = 1;
  });
  const before = JSON.stringify(remoteStamps);
  remoteStamps = next;
  const changed = before !== JSON.stringify(next);
  if (changed) saveRemote();
  return changed;
}
function setSyncStatus(s, msg) {

  if (view === 'board') renderBoard();

async function ensureTables() {

  specCheckedAt = Date.now();

    throw e;
  }
  return tablesReady;
}
async function syncPull(reason) {
  if (pulling) return;
  if (!navigator.onLine && reason !== 'force') { setSyncStatus('off', '오프라인'); return; }
  pulling = true;
  try {
    if (!(await ensureTables())) { setSyncStatus('pending'); return; }
    const q = '?room_id=eq.' + encodeURIComponent(roomId);
    const profs = await sbReq('/rest/v1/kids_study_profiles' + q + '&select=slot,name,avatar,updated_at');
    const back = new Date(refNow().getTime() - 14 * 86400000);
    const since = todayKey(back);
    const stamps = await sbReq('/rest/v1/kids_study_stamps' + q + '&date_kst=gte.' + since + '&select=slot,date_kst,subject');
    const pa = applyProfiles(profs);
    const sa = applyStamps(stamps);
    lastSyncAt = Date.now();
    syncError = '';
    setSyncStatus('ok');
    if (pa || sa) refreshFromSync();
    // 이 폰에 이미 있는 실제 기록을 방에 한 번 올려 둔다(첫 동기화 때만)
    if (!syncSeedDone) {
      syncSeedDone = true;
      const i = activeSlotIndex();
      const known = (profs || []).some(function (r) { return Number(r.slot) === i; });
      if (!known && i >= 0 && !isPlaceholderName(state.profiles[i].name)) pushProfile(i);
      pushTodayStamps(i);
    }
    flushQueue();
  } catch (e) {
    syncError = String((e && e.message) || e);
    setSyncStatus('off');
  } finally { pulling = false; }
}
function syncDeleteToday() {

  if (i >= 0) enqueue({ t: 'del-stamp-day', room: roomId, slot: i, date_kst: todayKey() });
  const me = state.activeId; if (remoteStamps[me]) delete remoteStamps[me][todayKey()]; saveRemote();

function syncDeleteAll() {

  if (i >= 0) enqueue({ t: 'del-stamps', room: roomId, slot: i });
  delete remoteStamps[state.activeId]; saveRemote();
}
function syncStart() {
  loadRemote();
  loadQueue();
  syncPull('init');
  if (syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(function () { if (!document.hidden) syncPull('timer'); }, SYNC_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) syncPull('visible'); });
  window.addEventListener('focus', function () { syncPull('focus'); });
  window.addEventListener('online', function () { syncPull('online'); flushQueue(); });
  window.addEventListener('offline', function () { setSyncStatus('off', '오프라인'); });
}
function syncLine() {
  if (syncStatus === 'ok') return '친구들 폰과 실시간으로 이어져 있어요. 이름·도장이 서로 바로 보여요.';
  if (syncStatus === 'off') return '지금은 인터넷이 없어 이 폰에만 저장 중이에요. 연결되면 자동으로 올라가요.';
  if (syncStatus === 'pending') return '친구들 폰과 연결할 준비 중이에요. 준비되면 저절로 이어져요.';
  return '친구들 폰과 연결하는 중이에요…';

/* 하루 계산은 기기 시간대와 상관없이 한국시간(KST) 기준으로 고정한다. */
const KST_OFFSET_MIN = 9 * 60;
let DAY_OVERRIDE = null;            // '?d=YYYY-MM-DD' (날짜 로테이션 확인용)
function refNow() { return DAY_OVERRIDE ? new Date(DAY_OVERRIDE + 'T12:00:00+09:00') : new Date(); }
function asDate(d) {
  if (d instanceof Date) return d;
  if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)) return new Date(d + 'T12:00:00+09:00');
  return refNow();
}
function kstParts(d) {
  const t = new Date(asDate(d).getTime() + KST_OFFSET_MIN * 60000);
  const y = t.getUTCFullYear(), m = t.getUTCMonth() + 1, day = t.getUTCDate();
  return { y: y, m: m, d: day, wd: new Date(Date.UTC(y, m - 1, day)).getUTCDay() };
}
function todayKey(d) {
  const p = kstParts(d), pad = n => String(n).padStart(2, '0');
  return p.y + '-' + pad(p.m) + '-' + pad(p.d);
}
function dateLabel(d) {
  const p = kstParts(d);
  return p.m + '월 ' + p.d + '일 ' + ['일', '월', '화', '수', '목', '금', '토'][p.wd] + '요일';
}
function dayNumber(d) { const p = kstParts(d); return Math.floor(Date.UTC(p.y, p.m - 1, p.d) / 86400000); }
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let saveTimer = null;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { SyncAdapter.save(state); }, 80);
}

/* 기록 조회 */
function dayRec(pid, day = todayKey()) { const p = state.progress[pid]; return p ? p[day] : null; }
function subRec(pid, sid, day = todayKey()) { const d = dayRec(pid, day); return d ? d[sid] : null; }
function ensureSub(pid, sid, day) {
  const p = state.progress[pid] || (state.progress[pid] = {});
  const d = p[day] || (p[day] = {});
  const s = d[sid] || (d[sid] = { q: {}, s: {} });
  if (!s.q) s.q = {};
  if (!s.s) s.s = {};
  return s;
}
function quizCount(pid, sid, day = todayKey()) {
  const s = subRec(pid, sid, day);
  const local = s && s.q ? Object.keys(s.q).length : 0;
  const r = (remoteStamps[pid] && remoteStamps[pid][day] && remoteStamps[pid][day][sid]) ? 1 : 0;
  return Math.max(local, r);   // 같은 도장을 두 번 세지 않게 큰 쪽만
}
function speakCount(pid, sid, day = todayKey()) {
  const s = subRec(pid, sid, day);
  return s && s.s ? Object.keys(s.s).length : 0;
}
function dayStamps(pid, day = todayKey()) {
  return SUBJECTS.reduce((n, sub) => n + quizCount(pid, sub.id, day) + speakCount(pid, sub.id, day), 0);
}
function dayQuizStamps(pid, day = todayKey()) {
  return SUBJECTS.reduce((n, sub) => n + quizCount(pid, sub.id, day), 0);
}
function totalStamps(pid) {
  const p = state.progress[pid] || {};
  const days = Object.keys(p);
  const r = remoteStamps[pid] || {};
  Object.keys(r).forEach(d => { if (days.indexOf(d) < 0) days.push(d); });
  let n = 0;
  days.forEach(d => { n += dayStamps(pid, d); });
  return n;
}

/* ── 오늘의 문제 번호·진행률·완료 판정 ──
   완료 = 오늘 내야 할 문제를 전부 맞힘 (수학 10, 한국사 2, 위인·시사 1, 영어 1)
   완료 도장(서버)은 전부 맞혔을 때 한 번만 올리고, 진행 중에는 올리지 않음. */
function mathIdxs(d, lv, pid) { return mathDaySets(d, pid, lv).reduce((a, g) => a.concat(g.list), []); }
function dailyQuizIdxs(sub, d, pid) {
  pid = pid || state.activeId;
  const lv = levelOf(pid, sub.id);
  if (sub.id === 'math') return mathIdxs(d, lv, pid);
  if (sub.id === 'english') return dailySentIdxs(d, lv);
  return dailyIdxs(sub, d, pid);
}
function remoteDone(pid, sid, day) {
  const d = remoteStamps[pid]; return !!(d && d[day] && d[day][sid]);
}
function subProgress(sub, pid, day) {
  const p = pid || state.activeId, dd = day || todayKey();
  const idxs = dailyQuizIdxs(sub, dd, p);
  const rec = (subRec(p, sub.id, dd) || {}).q || {};
  const solved = idxs.filter(qi => rec[qi]).length;
  const complete = remoteDone(p, sub.id, dd) || (idxs.length > 0 && solved >= idxs.length);
  return { solved: solved, total: idxs.length, complete: complete, idxs: idxs };
}
function markSubStamp(sid, pid) {
  const p = pid || state.activeId, day = todayKey();
  if (!SUBJECT_BY_ID[sid]) return false;
  if (remoteDone(p, sid, day)) return false;
  const s = ensureSub(p, sid, day);
  if (s.st) return false;
  s.st = 1; persist(); pushStampFor(p, sid); return true;
}
function checkSubjectComplete(sid) {
  const sub = SUBJECT_BY_ID[sid]; if (!sub) return false;

function fx(text, el) {
  const layer = $('#fx');
  const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0 };
  const d = document.createElement('div');
  d.className = 'fx-float';
  d.textContent = text;
  d.style.left = (r.left + r.width / 2) + 'px';
  d.style.top = (r.top + r.height / 2) + 'px';
  layer.appendChild(d);
  setTimeout(() => d.remove(), 950);
}

    '<div class="v-row"><span class="v-w">' + esc(v.w) + '</span>' + esc(v.m) + '</div>').join('');
  const len = String(item.essay).replace(/\s/g, '').length;
  return '<div class="readcard" id="today-read">' +
    '<div class="rc-head"><span class="rc-label">📖 오늘의 읽기 글</span><span class="rc-len">약 ' + Math.max(1, Math.round(len / 160)) + '분</span></div>' +

    '<div class="rc-body">' + paras + '</div>' +

function strokePath(pts) {
  const p = [];
  for (let i = 0; i + 1 < pts.length; i += 2) p.push([pts[i], pts[i + 1]]);
  if (p.length < 2) return '';
  if (p.length === 2) return 'M' + p[0][0] + ' ' + p[0][1] + 'L' + p[1][0] + ' ' + p[1][1];
  let d = 'M' + p[0][0] + ' ' + p[0][1];
  for (let i = 1; i < p.length - 1; i++) {
    const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
    d += 'Q' + p[i][0] + ' ' + p[i][1] + ' ' + mx + ' ' + my;
  }
  d += 'L' + p[p.length - 1][0] + ' ' + p[p.length - 1][1];
  return d;
}

function hanjaSVG(c) {
  const strokes = c.strokes || [];
  const paths = strokes.map(function (pts, k) {
    return '<path class="st" data-k="' + k + '" d="' + strokePath(pts) + '"/>';
  }).join('');
  const nums = strokes.map(function (pts, k) {
    return '<text class="st-num" x="' + (pts[0] + 3) + '" y="' + (pts[1] - 3) + '">' + (k + 1) + '</text>';
  }).join('');
  return '<svg class="hj-svg" viewBox="0 0 100 100" role="img" aria-label="' + esc(c.c) + ' 획순">' +
    '<rect class="gr" x="4" y="4" width="92" height="92" rx="8"/>' +
    '<line class="gd" x1="50" y1="4" x2="50" y2="96"/><line class="gd" x1="4" y1="50" x2="96" y2="50"/>' +
    '<line class="gx" x1="4" y1="4" x2="96" y2="96"/><line class="gx" x1="96" y1="4" x2="4" y2="96"/>' +
    paths + nums + '</svg>';
}

/* 획순을 한 획씩 그려 주기 */
function playStrokes(card) {
  const paths = card.querySelectorAll('path.st');
  if (!paths.length) return;
  paths.forEach(function (p) {
    let len = 300;
    try { len = p.getTotalLength() || 300; } catch (e) {}
    p.style.transition = 'none';
    p.style.strokeDasharray = len + 'px';
    p.style.strokeDashoffset = len + 'px';
    p.classList.remove('on');
  });
  let k = 0;
  const step = function () {
    if (k >= paths.length) return;
    const p = paths[k];
    p.classList.add('on');
    requestAnimationFrame(function () {
      p.style.transition = 'stroke-dashoffset .4s linear';
      p.style.strokeDashoffset = '0px';
    });
    k++;
    setTimeout(step, 450);
  };
  step();
}

function currentStepSentences() {
  const pool = engPool();
  if (engStep === 'all' || pool !== ALL_SENTENCES) return pool;
  return ALL_SENTENCES.filter(s => s.step === engStep);   // 단계별 문장 수가 달라도 idx가 어긋나지 않게
}

/* ── 퀴즈 파트 ── */
function quizHTML(sub) {
  const pool = quizPool(sub.id, levelOf(state.activeId, sub.id));
  const total = pool.length;
  const myQuiz = quizCount(state.activeId, sub.id);
  if (quiz.i >= total) quiz.i = Math.max(0, total - 1);
  let h = '<div class="quiz-top">' +
    '<div class="quiz-dots">' + pool.map((_, i) => {
      const rec = (subRec(state.activeId, sub.id) || { q: {} }).q || {};
      const cls = rec[i] ? 'ok' : (i === quiz.i ? 'now' : '');
      return '<i class="' + cls + '"></i>';
    }).join('') + '</div>' +
    '<span class="quiz-pill">오늘 🏅 ' + myQuiz + '/' + total + '</span>' +
  '</div>';

  if (quiz.i >= total) {
    const right = pool.reduce((n, _, i) => {
      const rec = (subRec(state.activeId, sub.id) || { q: {} }).q || {};
      return n + (rec[i] ? 1 : 0);
    }, 0);
    h += '<div class="qcard"><div class="result">' +
      '<div class="big">' + (right === total ? '🏆' : right > 0 ? '🎉' : '🌱') + '</div>' +
      '<h3>' + total + '문제 중 ' + right + '개 정답!</h3>' +
      '<p>' + (right === total ? '완벽해요! 오늘 ' + sub.name + ' 도장 ' + total + '개를 모두 모았어요.' :
            right > 0 ? '도장 ' + right + '개를 받았어요. 한 번 더 풀면 더 잘할 수 있어요!' :
            '괜찮아요. 배우기 탭을 한 번 읽고 다시 도전해 봐요!') + '</p>' +
      '<div class="stamps">' + '🏅'.repeat(Math.max(right, 0)) + '</div>' +
      '<button class="btn-primary" data-action="retry-quiz">🔁 다시 풀기</button>' +
      '<button class="btn-ghost" data-action="subtab" data-tab="learn">📚 배우기로 돌아가기</button>' +
    '</div></div>';
    return h;
  }

  const q = pool[quiz.i];
  h += '<div class="qcard">' +
    '<div class="qnum">Q' + (quiz.i + 1) + ' / ' + total + '</div>' +
    (q.emoji || q.scene ? '<div class="sp-scene" style="margin-bottom:8px">' + esc((q.emoji || '💬') + ' ' + (q.scene || '')) + '</div>' : '') +
    (q.situation ? '<div class="sp-sit" style="margin-bottom:8px">' + esc(q.situation) + '</div>' : '') +
    '<div class="qtext">' + esc(q.q) + '</div>' +
    '<div class="opts">' + q.opts.map((o, i) => {
      let cls = '';
      if (quiz.picked !== null) {
        if (i === q.ans) cls = 'right';
        else if (i === quiz.picked) cls = 'wrong';
      }
      return '<button class="opt ' + cls + '" data-action="answer" data-i="' + i + '"' + (quiz.picked !== null ? ' disabled' : '') + '>' +
        '<span class="num">' + (i + 1) + '</span><span>' + esc(o) + '</span></button>';
    }).join('') + '</div>';

  if (quiz.picked !== null) {
    const ok = quiz.picked === q.ans;
    h += '<div class="feedback ' + (ok ? 'ok' : 'no') + '">' +
      '<span class="fb-t">' + (ok ? '정답이야! 🏅 도장 +1' : '아쉬워! 정답은 "' + esc(q.opts[q.ans]) + '"') + '</span>' +
      esc(q.why) + '</div>' +
      '<button class="btn-primary" data-action="next-q">' + (quiz.i + 1 >= total ? '결과 보기 →' : '다음 문제 →') + '</button>';
  }
  h += '</div>';
  return h;
}

function boardText() {
  const total = state.profiles.reduce((n, p) => n + dayStamps(p.id), 0);
  const doneList = state.profiles.filter(p => hasStudiedToday(p.id));
  const todoList = state.profiles.filter(p => !hasStudiedToday(p.id));

  let t = '📚 우리 반 오늘 공부 도장판\n' + dateLabel() + ' · 도장 ' + total + '개\n';

  t += '\n✅ 공부 완료 (' + doneList.length + '명)\n';
  if (doneList.length) {
    doneList.forEach(p => {
      const parts = SUBJECTS.map(sub => {
        const q = quizCount(p.id, sub.id);
        return q ? sub.name + q : '';
      }).filter(Boolean);
      t += '· ' + p.name + ' ' + p.emoji + ' — 도장 ' + dayStamps(p.id) + '개' + (parts.length ? ' (' + parts.join(', ') + ')' : '') + '\n';
    });
  } else {
    t += '· 아직 없어요\n';
  }

  t += '\n⬜ 아직 (' + todoList.length + '명)\n';
  if (todoList.length) {
    todoList.forEach(p => { t += '· ' + p.name + ' ' + p.emoji + '\n'; });
  } else {
    t += '· 없어요 — 우리 반 전원 완료! 🎉\n';
  }

  t += '\n오늘도 재밌게 공부했어요! 🎉';
  return t;
}

async function copyBoard(btn) {
  const text = boardText();
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (e) { ok = false; }

  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
      ta.remove();
    } catch (e) { ok = false; }
  }

  if (ok) {
    if (btn) fx('📋 복사!', btn);
    toast('복사했어요! 단톡방에 붙여넣기 하세요 📋');
  } else {
    showManualCopy(text);
  }
}

function showManualCopy(text) {
  const wrap = $('#modalWrap');
  wrap.hidden = false;
  wrap.className = 'modal-bg';
  wrap.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="현황 복사">' +
    '<h3>📋 오늘 현황</h3><p>아래 글을 길게 눌러 전체 선택 → 복사해 주세요.</p>' +
    '<textarea readonly>' + esc(text) + '</textarea>' +
    '<div class="m-btns"><button data-action="close-modal">닫기</button>' +
    '<button class="primary" data-action="select-copy">전체 선택</button></div></div>';
  const ta = $('textarea', wrap);
  setTimeout(() => { ta.focus(); ta.select(); }, 60);
}

async function copyText(text, btn, okMsg) {
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text); ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy'); ta.remove();
    } catch (e) { ok = false; }
  }
  if (ok) {
    if (btn) fx('📋 복사!', btn);
    toast(okMsg || '복사했어요! 단톡방에 붙여넣기 하세요 📋');
  } else {
    showManualCopy(text);
  }
}

async function shareText(text, btn) {
  if (navigator.share) {
    try { await navigator.share({ title: '우리 반 공부방', text: text }); return; } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }
  await copyText(text, btn, '초대 링크를 복사했어요! 단톡방에 붙여넣기 하세요 📋');
}

function joinSubmit() {
  const input = $('#joinName');

  const name = (input ? input.value : '').trim().replace(/\s+/g, ' ');

  if (!len) { if (err) err.textContent = '이름(별명)을 적어 줘!'; if (input) input.focus(); return; }
  if (len > 8) { if (err) err.textContent = '이름은 8글자까지 쓸 수 있어요.'; return; }
  const dup = state.profiles.some(p => p.id !== state.profiles[joinSlot].id && p.name && p.name.trim() === name);
  if (dup) { if (err) err.textContent = '「' + name + '」는 이미 친구가 쓰고 있어. 다른 이름으로 해 줘!'; return; }
  if (!joinPick) { if (err) err.textContent = '동물 친구를 하나 골라 줘!'; return; }
  const slotP = state.profiles[joinSlot], slotDef = DEFAULT_PROFILES[joinSlot];
  if (!isPlaceholderName(slotP.name) && slotP.name !== slotDef.name && slotP.name !== name) {
    if (err) err.textContent = '이 자리는 이미 「' + slotP.name + '」가 쓰고 있어. 내 초대 링크가 맞는지 확인해 줘!'; return;
  }
  const used = state.profiles.filter(p => p.id !== state.profiles[joinSlot].id).map(p => p.emoji);
  if (used.indexOf(joinPick) >= 0) { if (err) err.textContent = '그 동물은 다른 친구가 쓰고 있어. 다른 동물로 골라 줘!'; return; }

  const p = state.profiles[joinSlot];
  p.name = name;
  p.emoji = joinPick;
  state.activeId = p.id;

  pushProfile(joinSlot);

  welcomeName = name;
  showView('home');
  toast(name + '야, 반가워! 🎉');
}

/* ─────────────────────────── 13. 음성: TTS ─────────────────────────── */

const ttsOK = typeof window !== 'undefined' && 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let cachedVoices = [];

function refreshVoices() {
  if (!ttsOK) return;
  try { cachedVoices = window.speechSynthesis.getVoices() || []; } catch (e) { cachedVoices = []; }
}
if (ttsOK) {
  refreshVoices();
  try { window.speechSynthesis.addEventListener('voiceschanged', refreshVoices); } catch (e) {}
}

function pickKoVoice() {
  if (!cachedVoices.length) refreshVoices();
  const list = cachedVoices;
  if (!list.length) return null;
  return list.find(v => /^ko[-_]KR/i.test(v.lang) && /female|yuna|sora|google|지연/i.test(v.name)) ||
         list.find(v => /^ko[-_]KR/i.test(v.lang)) ||
         list.find(v => /^ko/i.test(v.lang)) || null;
}

/* 오늘의 읽기 글 낭독 (한국어) */
function readEssay(btn) {
  const sub = SUBJECT_BY_ID[(btn && btn.dataset.sid) || currentSubjectId];
  if (!sub) return;
  const idxs = dailyIdxs(sub);
  const item = poolItem(sub, idxs[0]);
  if (!item || !item.essay) { toast('읽을 글이 아직 없어요'); return; }
  if (!ttsOK) { toast('이 브라우저는 소리 읽기를 지원하지 않아요 😢'); return; }
  stopSpeech();
  const text = String(item.essay).split('\n\n').filter(Boolean).join(' ');
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 0.9;
    u.pitch = 1.03;
    const v = pickKoVoice();
    if (v) u.voice = v;
    u.onend = markReadOff;
    u.onerror = markReadOff;
    window.speechSynthesis.speak(u);
    markReadOn();
    toast('읽어 줄게요. 눈으로 따라 읽어 봐요 📖');
  } catch (e) { toast('소리 읽기를 시작하지 못했어요'); }
}
function markReadOn() {
  const b = $('#view-subject [data-action="read-essay"]');
  if (b) { b.classList.add('on'); b.textContent = '🔊 읽는 중…'; }
  const s = $('#view-subject [data-action="stop-read"]');
  if (s) s.classList.add('on');
}
function markReadOff() {
  const b = $('#view-subject [data-action="read-essay"]');
  if (b) { b.classList.remove('on'); b.textContent = '🔊 읽어주기'; }
  const s = $('#view-subject [data-action="stop-read"]');
  if (s) s.classList.remove('on');
}

/* 한국어 짧은 문장 읽어주기 (한자·예쁘게 말하기) */
function speakKo(text, rate) {
  if (!ttsOK || !text) return;
  try {
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'ko-KR';
    u.rate = rate || 0.95;
    u.pitch = 1.03;
    const v = pickKoVoice();
    if (v) u.voice = v;
    u.onend = markReadOff;
    u.onerror = markReadOff;
    window.speechSynthesis.speak(u);
  } catch (e) { toast('소리 읽기를 시작하지 못했어요'); }
}

function pickEnVoice() {
  if (!cachedVoices.length) refreshVoices();
  const list = cachedVoices;
  if (!list.length) return null;
  return list.find(v => /^en[-_]US/i.test(v.lang) && /female|samantha|zira|google us/i.test(v.name)) ||
         list.find(v => /^en[-_]US/i.test(v.lang)) ||
         list.find(v => /^en[-_]GB/i.test(v.lang)) ||
         list.find(v => /^en/i.test(v.lang)) || null;
}

function speakText(text, rate, onDone) {
  if (!ttsOK) {
    toast('이 브라우저는 소리 읽기를 지원하지 않아요 😢');
    if (onDone) onDone();
    return;
  }
  try { window.speechSynthesis.cancel(); } catch (e) {}
  let done = false;
  const finish = () => { if (!done) { done = true; if (onDone) onDone(); } };
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate;
    u.pitch = 1.05;
    const v = pickEnVoice();
    if (v) u.voice = v;
    u.onend = finish;
    u.onerror = finish;
    window.speechSynthesis.speak(u);
    // 일부 브라우저에서 onend가 오지 않는 경우를 대비한 안전장치
    setTimeout(() => { if (!done && !window.speechSynthesis.speaking) finish(); }, Math.max(2500, text.length * 220));
  } catch (e) {
    finish();
  }
}

function stopSpeech() {
  playToken++;
  clearPlaying();
  if (ttsOK) { try { window.speechSynthesis.cancel(); } catch (e) {} }
}

function clearPlaying() {
  document.querySelectorAll('.sent.playing').forEach(el => el.classList.remove('playing'));
}

function markPlaying(idx) {
  clearPlaying();
  const el = document.querySelector('.sent[data-sent="' + idx + '"]');
  if (el) {
    el.classList.add('playing');
    const r = el.getBoundingClientRect();
    if (r.top < 70 || r.bottom > innerHeight - 90) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function playSequence(indices, rate) {
  stopSpeech();
  const token = ++playToken;
  const go = (k) => {
    if (token !== playToken) return;
    if (k >= indices.length) { clearPlaying(); return; }
    const idx = indices[k];
    const s = engSentence(idx);
    if (!s) { go(k + 1); return; }
    markPlaying(idx);
    speakText(s.en, rate, () => {
      if (token !== playToken) return;
      setTimeout(() => go(k + 1), 260);
    });
  };
  go(0);
}

function speakOne(idx, rateOverride) {
  stopSpeech();
  const s = engSentence(idx);
  if (!s) return;
  const rate = rateOverride || state.settings.rate || 1;
  markPlaying(idx);
  speakText(s.en, rate, () => { setTimeout(clearPlaying, 350); });
}

/* ─────────────────────────── 14. 음성: 따라 읽기 ─────────────────────────── */

const SR = (typeof window !== 'undefined') && (window.SpeechRecognition || window.webkitSpeechRecognition);
const srSupported = !!SR;

function practicePanel(idx) {
  return document.querySelector('.sent[data-sent="' + idx + '"] .practice');
}

function closePractice() {
  practice.ended = true;
  if (practice.rec) { try { practice.rec.abort(); } catch (e) {} practice.rec = null; }
  if (practice.timer) { clearInterval(practice.timer); practice.timer = null; }
  practice.idx = null; practice.listening = false; practice.ended = false;
  document.querySelectorAll('.practice').forEach(p => { p.hidden = true; p.innerHTML = ''; });
}

function openPractice(idx) {
  const card = document.querySelector('.sent[data-sent="' + idx + '"]');
  if (!card) return;
  const already = !!(subRec(state.activeId, 'english', todayKey()) || {}).s?.[idx];
  const panel = card.querySelector('.practice');

  // 다른 패널 닫기
  if (practice.idx !== idx) {
    closePractice();
  }
  stopSpeech();
  practice.idx = idx;
  practice.ended = false;
  panel.hidden = false;

  if (already) {
    panel.innerHTML = '<div class="p-t">🏅 오늘 이미 도장을 받았어요</div>' +
      '<div class="p-d">한 번 더 따라 말해 보면 입에 더 잘 붙어요!</div>' +
      '<div class="p-btns"><button class="primary" data-action="practice-again" data-idx="' + idx + '">🎤 한 번 더 해보기</button></div>';
    return;
  }

  if (srSupported) {
    startListening(idx, panel);
  } else {
    startCountdown(idx, panel);
  }
}

function startCountdown(idx, panel) {
  if (practice.timer) { clearTimeout(practice.timer); practice.timer = null; }
  practice.listening = false;
  let n = 3;
  const draw = () => {
    panel.innerHTML = '<div class="p-t">🎤 3초 동안 크게 따라 말해 보세요</div>' +
      '<div class="countdown">' + n + '<small>또박또박, 입 밖으로!</small></div>' +
      '<div class="p-btns"><button class="primary" data-action="give-stamp" data-idx="' + idx + '">🎤 따라 읽었어요! 도장 받기</button></div>';
  };
  draw();
  practice.timer = setInterval(() => {
    n--;
    if (n > 0) { draw(); return; }
    clearInterval(practice.timer); practice.timer = null;
    panel.innerHTML = '<div class="p-t">잘 했어요! 👏</div>' +
      '<div class="p-d">이 브라우저는 목소리 알아듣기를 지원하지 않아서, 스스로 확인하고 도장을 받아요.</div>' +
      '<div class="p-btns"><button class="primary" data-action="give-stamp" data-idx="' + idx + '">🎤 따라 읽었어요! 도장 받기</button>' +
      '<button data-action="practice-again" data-idx="' + idx + '">🔁 다시</button></div>';
  }, 1000);
}

function startListening(idx, panel) {
  let rec;
  try { rec = new SR(); } catch (e) { startCountdown(idx, panel); return; }
  practice.rec = rec;
  practice.listening = true;
  practice.ended = false;
  let transcript = '';

  rec.lang = 'en-US';
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 1;

  panel.innerHTML = '<div class="p-t">🎤 듣고 있어요… 영어로 말해 보세요</div>' +
    '<div class="p-d">또박또박, ' + esc((engSentence(idx) || {}).en || '') + '</div>' +
    '<div class="live" id="liveBox">…</div>' +
    '<div class="p-btns"><button data-action="practice-stop" data-idx="' + idx + '">⏹ 그만</button></div>';

  const liveBox = panel.querySelector('#liveBox');

  rec.onresult = (e) => {
    let t = '';
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript + ' ';
    transcript = t.trim();
    if (liveBox && transcript) liveBox.textContent = '👂 ' + transcript;
  };
  rec.onerror = (e) => {
    if (practice.ended) return;
    practice.ended = true;
    practice.listening = false;
    // 마이크 거부·인식 실패 → 타이머 폴백
    const msg = (e && (e.error === 'not-allowed' || e.error === 'service-not-allowed'))
      ? '마이크를 쓸 수 없어서 3초 타이머로 바꿀게요'
      : '목소리를 잘 못 들었어요. 3초 타이머로 바꿀게요';
    toast(msg);
    startCountdown(idx, panel);
  };
  rec.onend = () => {
    if (practice.ended) return;
    practice.ended = true;
    practice.listening = false;
    evaluateSpeech(idx, transcript, panel);
  };

  try { rec.start(); } catch (e) {
    practice.ended = true;
    startCountdown(idx, panel);
    return;
  }

  // 안전장치: 7초 안에 아무 반응이 없으면(마이크 없음·인식 멈춤) 타이머 모드로
  if (practice.timer) clearTimeout(practice.timer);
  practice.timer = setTimeout(() => {
    if (practice.ended || practice.idx !== idx) return;
    ringStop(rec);
    if (!transcript.trim()) {
      practice.ended = true;
      practice.listening = false;
      startCountdown(idx, panel);
    }
  }, 7000);
}

function ringStop(rec) {
  try { rec.stop(); } catch (e) { try { rec.abort(); } catch (e2) {} }
}

function words(s) {
  return String(s || '').toLowerCase().replace(/[^a-z' ]/g, ' ').split(/\s+/).filter(Boolean);
}
function similarity(target, heard) {
  const t = words(target), h = words(heard);
  if (!t.length) return 0;
  if (!h.length) return 0;
  let hit = 0;
  t.forEach(w => {
    if (h.some(x => x === w || (w.length >= 4 && (x.indexOf(w.slice(0, 4)) === 0 || w.indexOf(x.slice(0, 4)) === 0)))) hit++;
  });
  return hit / t.length;
}

function evaluateSpeech(idx, transcript, panel) {
  if (practice.timer) { clearTimeout(practice.timer); practice.timer = null; }
  const target = (engSentence(idx) || {}).en || '';
  const score = similarity(target, transcript);
  const good = score >= 0.6;
  const heard = transcript ? '<div class="live">👂 ' + esc(transcript) + '</div>' : '<div class="live">👂 (잘 안 들렸어요)</div>';
  panel.innerHTML =
    '<div class="p-t">' + (good ? '잘했어요! 🎉' : (transcript ? '거의 다 왔어요!' : '한 번 더 해볼까요?')) + '</div>' +
    heard +
    '<div class="p-d" style="margin-top:7px">' + (good
      ? '발음이 잘 들렸어요. 도장을 받아요!'
      : '천천히 듣고 다시 말해 보세요. 그래도 도장은 받을 수 있어요.') + '</div>' +
    '<div class="p-btns">' +
      '<button class="primary" data-action="give-stamp" data-idx="' + idx + '">🏅 도장 받기</button>' +
      '<button data-action="practice-again" data-idx="' + idx + '">🔁 다시 말하기</button>' +
    '</div>';
}

function mergeLoaded(loaded) {
  if (!loaded) return;
  if (Array.isArray(loaded.profiles) && loaded.profiles.length === 5) {
    state.profiles = loaded.profiles.map((p, i) => ({
      id: p.id || DEFAULT_PROFILES[i].id,
      name: (p.name || DEFAULT_PROFILES[i].name).slice(0, 8),
      emoji: p.emoji || DEFAULT_PROFILES[i].emoji
    }));
  }
  if (loaded.activeId && state.profiles.some(p => p.id === loaded.activeId)) state.activeId = loaded.activeId;
  if (loaded.joined) state.joined = true;
  if (loaded.progress && typeof loaded.progress === 'object') state.progress = loaded.progress;
  if (loaded.settings && typeof loaded.settings === 'object') {
    state.settings.rate = loaded.settings.rate === 0.8 ? 0.8 : 1;
  }
  if (loaded.syncMeta && typeof loaded.syncMeta === 'object') state.syncMeta = loaded.syncMeta;
  if (loaded.levels && typeof loaded.levels === 'object') state.levels = loaded.levels;
  if (loaded.levelNext && typeof loaded.levelNext === 'object') state.levelNext = loaded.levelNext;
  if (loaded.streaks && typeof loaded.streaks === 'object') state.streaks = loaded.streaks;
  if (loaded.mathDay && typeof loaded.mathDay === 'object') state.mathDay = loaded.mathDay;
}

async function init() {
  const m = /[?&]d=(\d{4}-\d{2}-\d{2})/.exec(location.search);
  if (m) DAY_OVERRIDE = m[1];
  roomId = readRoom();

  const loaded = await SyncAdapter.load();
  mergeLoaded(loaded);

  // 찬우 기본 캐릭터를 🐍로 (예전에 쓰던 기기도 한 번만 바꿔요 — 그 뒤에 고른 값은 그대로 둠)
  try {
    if (!localStorage.getItem('kidsStudyApp.snake.v1')) {
      const p1 = state.profiles[0];
      if (p1 && p1.name === '찬우' && p1.emoji === '🦁') {
        p1.emoji = '🐍';
        try { await SyncAdapter.save(state); } catch (e2) {}
      }
      localStorage.setItem('kidsStudyApp.snake.v1', '1');
    }
  } catch (e) {}

  // PWA 연결은 http(s)에서만 (파일로 열 때 오류 없이 동작하도록)
  if (/^https?:$/.test(location.protocol)) {
    try {
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = './manifest.webmanifest';
      document.head.appendChild(link);
    } catch (e) {}
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  }

  // 이 폰이 누구 것인지 확정: 예전부터 쓰던 폰(도장이 있거나 이름을 정함)은 그대로 인정
  if (!state.joined) {
    const me = activeProfile(), def = DEFAULT_PROFILES.find(d => d.id === me.id);
    if (totalStamps(me.id) > 0 || (def && me.name !== def.name)) state.joined = true;
  }
  if (state.joined) { try { history.replaceState(null, '', location.pathname); } catch (e) {} showView('home'); }   // 이미 내 자리가 있으면 다른 초대 링크는 무시
  else startJoin();

  // 친구들 폰과 실시간 공유 시작 (4초 폴링 + 화면 복귀·온라인 시 즉시)
  syncStart();
}

    SUBJECTS.forEach(function (s) {
      const seen = {};
      out[s.id] = bankOf(s).filter(function (it) { const k = String(it.id).replace(/-q\d+$/, ''); if (seen[k]) return false; seen[k] = 1; return true; })
        .map(function (it) { return { id: it.id, title: it.title, dur: it.dur_label, ch: it.ch }; });
    });
    return out;
  },
  progress: function () { return SUBJECTS.map(function (s) { return { id: s.id, p: subProgress(s) }; }); },
  state: function () { return { activeId: state.activeId, profiles: state.profiles, errs: window.__errs, sync: syncStatus }; }
};

init();
</script>
