<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF8A5B">
<meta name="description" content="초1 친구 5명이 함께 쓰는 공동 학습 웹앱 — 수학·영어·한국사·위인·시사상식">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 반 공부방">
<title>우리 반 공부방 · 초1 공동학습</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23FF8A5B'/%3E%3Cpath d='M32 13l5.9 11.9 13.1 1.9-9.5 9.2 2.2 13.1L32 42.9 19.3 49.1l2.2-13.1-9.5-9.2 13.1-1.9z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#FFF7EF; --ink:#2B2340; --muted:#7C7590; --line:#F0E6DA;
    --card:#FFFFFF; --brand:#FF7A45; --brand2:#FF5E86;
    --ok:#1FA97A; --ok-soft:#E4F7EF; --warn:#EF9A1E;
    --shadow:0 8px 22px rgba(94,66,48,.09), 0 1px 3px rgba(94,66,48,.06);
    --shadow-sm:0 2px 8px rgba(94,66,48,.07);
    --r:20px;
  }
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{
    font-family:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(110% 46% at 50% -8%, #FFE3C9 0%, rgba(255,227,201,0) 62%),
      radial-gradient(80% 40% at 100% 4%, #FFE9F0 0%, rgba(255,233,240,0) 60%),
      linear-gradient(180deg,#FFF9F3 0%, #FDF1E6 100%);
    background-attachment:fixed;
    min-height:100vh;
    font-size:16px; line-height:1.5;
    letter-spacing:-.01em;
  }
  [hidden]{display:none !important}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  button:active{transform:scale(.97)}
  input,select{font:inherit;color:inherit}
  .app{
    max-width:430px; margin:0 auto; min-height:100vh; position:relative;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }

  /* ── top bar ── */
  .topbar{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:rgba(255,249,243,.86);
    backdrop-filter:saturate(1.4) blur(14px);
    -webkit-backdrop-filter:saturate(1.4) blur(14px);
    border-bottom:1px solid rgba(240,230,218,.75);
  }
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .brand-emoji{
    width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:21px;
    background:linear-gradient(135deg,#FFB26B,#FF7A45);box-shadow:0 4px 10px rgba(255,122,69,.3);
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .brand-text b{font-size:16.5px;letter-spacing:-.03em}
  .brand-text small{font-size:11px;color:var(--muted);font-weight:600}
  .stamp-pill{
    display:flex;align-items:center;gap:5px;padding:8px 13px;border-radius:999px;
    background:#fff;box-shadow:var(--shadow-sm);font-size:14px;font-weight:800;color:#B4631B;
    border:1px solid #FBE7D6;
  }
  .stamp-pill b{font-size:15px}

  /* ── friend strip ── */
  .friendstrip{
    display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .friendstrip::-webkit-scrollbar{display:none}
  .friend{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;
    width:62px;padding:8px 4px 7px;border-radius:18px;background:#fff;
    border:1.5px solid #F4EADF;box-shadow:var(--shadow-sm);position:relative;
    transition:border-color .15s, transform .15s;
  }
  .friend:active{transform:scale(.96)}
  .friend .friend-ava{font-size:24px;line-height:1.1}
  .friend .friend-name{
    font-size:11.5px;font-weight:700;color:#5C5470;max-width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .friend.on{border-color:var(--brand);background:linear-gradient(180deg,#FFF4EC,#FFFFFF);box-shadow:0 6px 14px rgba(255,122,69,.18)}
  .friend.on .friend-name{color:#C4511E}
  .friend .friend-dot{
    position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;
    background:#E4DED4;
  }
  .friend .friend-dot.on{background:var(--ok);box-shadow:0 0 0 2px #fff inset}
  .strip-hint{font-size:11.5px;color:var(--muted);padding:0 18px 2px;font-weight:600}

  /* ── layout ── */
  main{padding:10px 16px 8px}
  .view{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h2.page-title{font-size:20px;margin:6px 0 4px;letter-spacing:-.035em}
  .page-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px;font-weight:600}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid #F7EEE4}

  /* ── home ── */
  .hero{
    position:relative;overflow:hidden;border-radius:26px;padding:20px 18px;
    background:linear-gradient(135deg,#FF9C63 0%,#FF7A45 45%,#FF6B8A 100%);
    color:#fff;box-shadow:0 14px 26px rgba(255,122,69,.28);
  }
  .hero::after{
    content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;
    background:rgba(255,255,255,.18);
  }
  .hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative}
  .hero-date{font-size:12px;font-weight:700;opacity:.95;background:rgba(255,255,255,.22);padding:5px 11px;border-radius:999px}
  .hero-hi{font-size:19px;font-weight:800;margin:12px 0 2px;letter-spacing:-.03em;position:relative}
  .hero-sub{font-size:12.5px;opacity:.94;font-weight:600;position:relative}
  .hero-stats{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap}
  .hero-stat{background:rgba(255,255,255,.9);color:#B0441A;border-radius:14px;padding:7px 12px;font-size:12.5px;font-weight:800}
  .hero-stat em{font-style:normal;font-size:15px;margin-right:2px}

  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 9px}
  .sec-head h3{font-size:15px;margin:0;letter-spacing:-.03em}
  .sec-head .more{font-size:12px;color:var(--brand);font-weight:800;padding:11px 8px;margin:-11px -8px -11px 0;border-radius:10px}

  .enq{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px;
    box-shadow:var(--shadow-sm);border:1px solid #EDF1FF;
  }
  .enq .q-emoji{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:#EEF3FF;flex:0 0 auto}
  .enq .q-body{flex:1;min-width:0;display:block}
  .enq .q-en{display:block;font-size:16px;font-weight:800;color:#27407A;letter-spacing:-.01em;line-height:1.3}
  .enq .q-ko{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
  .icon-btn{
    width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:18px;
    background:#F2F5FF;color:#3B5BC0;flex:0 0 auto;
  }
  .icon-btn:active{background:#E4EBFF}

  .subj-grid{display:flex;flex-direction:column;gap:10px}
  .subj{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:13px 14px;
    box-shadow:var(--shadow-sm);border:1px solid #F6EEE5;text-align:left;width:100%;
    transition:transform .12s;
  }
  .subj:active{transform:scale(.985)}
  .subj .s-ico{
    width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;flex:0 0 auto;
    background:var(--soft);
  }
  .subj .s-body{flex:1;min-width:0}
  .subj .s-name{font-size:15.5px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:5px}
  .subj .s-line{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
  .subj .s-right{text-align:right;flex:0 0 auto}
  .dots{display:flex;gap:3px;justify-content:flex-end}
  .dots i{width:8px;height:8px;border-radius:50%;background:#EDE6DC;display:block}
  .dots i.on{background:var(--dotcolor,#FF7A45)}
  .s-count{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:4px}

  /* ── subject detail ── */
  .detail-head{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow-sm);border:1px solid #F6EEE5;display:flex;align-items:center;gap:12px}
  .detail-head .d-ico{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:27px;background:var(--soft)}
  .detail-head h2{font-size:18px;margin:0;letter-spacing:-.03em}
  .detail-head p{margin:3px 0 0;font-size:12px;color:var(--muted);font-weight:600;line-height:1.4}
  .back-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:#F6F1EA;margin-bottom:12px}
  .seg2{display:flex;gap:6px;background:#F4EDE5;border-radius:15px;padding:4px;margin:14px 0 4px}
  .seg2 button{flex:1;padding:9px 0;border-radius:12px;font-size:13.5px;font-weight:800;color:#8A8199}
  .seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(94,66,48,.1)}

  .keyline{
    margin-top:12px;padding:14px 16px;border-radius:18px;font-size:14px;font-weight:800;line-height:1.45;
    background:var(--soft);color:var(--deep);border:1px dashed var(--line2);
  }
  .keyline .k-label{display:block;font-size:10.5px;letter-spacing:.04em;font-weight:800;opacity:.65;margin-bottom:4px}

  .story{display:flex;gap:11px;background:#fff;border-radius:18px;padding:13px;box-shadow:var(--shadow-sm);border:1px solid #F6EEE5;margin-top:10px}
  .story .st-e{font-size:22px;line-height:1.2}
  .story .st-t{font-size:13.5px;font-weight:800;margin-bottom:3px}
  .story .st-d{font-size:12.5px;color:#5E566F;line-height:1.5;font-weight:500}

  .yt-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .yt{
    display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:11px 13px;
    box-shadow:var(--shadow-sm);border:1px solid #F6EEE5;text-decoration:none;color:var(--ink);
  }
  .yt .yt-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#FFEDEC;font-size:15px;flex:0 0 auto}
  .yt.site .yt-ico{background:#E8F4FF}
  .yt .yt-t{flex:1;font-size:13px;font-weight:700;line-height:1.35}
  .yt .yt-d{display:block;font-size:10.5px;font-weight:600;color:#9A9184;margin-top:1px}
  .yt .yt-go{color:#C9BFB2;font-size:14px}

  /* ── english ── */
  .eng-ctrl{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow-sm);border:1px solid #EDF1FF;margin-top:10px}
  .seg-rate{display:flex;gap:6px;background:#F1F4FC;border-radius:12px;padding:4px}
  .seg-rate button{flex:1;padding:8px 0;border-radius:9px;font-size:12.5px;font-weight:800;color:#6C7896}
  .seg-rate button.on{background:#fff;color:#2A4694;box-shadow:0 1px 4px rgba(42,70,148,.14)}
  .play-row{display:flex;gap:6px;margin-top:8px}
  .play-row button{
    flex:1;padding:9px 4px;border-radius:11px;font-size:11.5px;font-weight:800;
    background:#F7F9FF;color:#3B5BC0;border:1px solid #E7EDFF;line-height:1.2;
  }
  .play-row button.stop{flex:0 0 46px;background:#FFF4F1;color:#C4511E;border-color:#FFE2D7}
  .step-chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
  .step-chips::-webkit-scrollbar{display:none}
  .step-chips button{
    flex:0 0 auto;padding:8px 13px;border-radius:999px;font-size:12px;font-weight:800;
    background:#fff;color:#7A7390;border:1.5px solid #EFE7DC;
  }
  .step-chips button.on{background:#2A4694;color:#fff;border-color:#2A4694;box-shadow:0 4px 10px rgba(42,70,148,.22)}
  .step-title{font-size:12px;font-weight:800;color:#6C7896;margin:14px 2px 6px;letter-spacing:.01em}

  .sent{
    background:#fff;border-radius:18px;padding:13px 14px;box-shadow:var(--shadow-sm);
    border:1px solid #EDF1FF;margin-bottom:9px;transition:box-shadow .2s,border-color .2s;
  }
  .sent.playing{border-color:#4C7DF0;box-shadow:0 0 0 3px rgba(76,125,240,.16), 0 8px 18px rgba(76,125,240,.14)}
  .sent.done{border-color:#BFE9D6;background:linear-gradient(180deg,#F7FDFA,#fff)}
  .sent-head{display:flex;align-items:flex-start;gap:9px}
  .sent-e{font-size:20px;line-height:1.3}
  .sent-main{flex:1;min-width:0}
  .sent-en{font-size:16.5px;font-weight:800;color:#1E3A78;letter-spacing:-.01em;line-height:1.3}
  .sent-ko{font-size:12.5px;color:#66607A;font-weight:600;margin-top:2px}
  .sent-tip{font-size:11.5px;color:#8B93AF;font-weight:600;margin-top:5px;background:#F6F8FF;border-radius:9px;padding:5px 8px;display:inline-block}
  .sent-btns{display:flex;gap:6px;margin-top:10px}
  .sent-btns button{
    flex:1;padding:9px 0;border-radius:12px;font-size:12.5px;font-weight:800;
    background:#EEF3FF;color:#2F55BE;
  }
  .sent-btns button.mic{background:#FFF1F4;color:#C2334F}
  .sent-btns button:disabled{opacity:.5}
  .sent-stamp{font-size:11px;font-weight:800;color:var(--ok);margin-top:8px;display:none}
  .sent.done .sent-stamp{display:block}

  .practice{
    margin-top:10px;border-radius:14px;background:#FFF7FA;border:1px dashed #FFD3DE;padding:12px;
  }
  .practice .p-t{font-size:12.5px;font-weight:800;color:#B0314B;margin-bottom:6px}
  .practice .p-d{font-size:11.5px;color:#8A6A75;font-weight:600;line-height:1.45}
  .practice .live{
    margin-top:8px;font-size:13px;font-weight:700;color:#3A3050;background:#fff;border-radius:10px;
    padding:8px 10px;min-height:36px;border:1px solid #FFE3EA;
  }
  .practice .p-btns{display:flex;gap:6px;margin-top:9px}
  .practice .p-btns button{
    flex:1;padding:9px 0;border-radius:11px;font-size:12px;font-weight:800;background:#fff;color:#B0314B;border:1px solid #FFD3DE;
  }
  .practice .p-btns button.primary{background:#FF6B8A;color:#fff;border-color:#FF6B8A}
  .countdown{font-size:34px;font-weight:900;color:#FF6B8A;text-align:center;line-height:1.1;letter-spacing:-.02em}
  .countdown small{display:block;font-size:11px;color:#A08E96;font-weight:700;margin-top:2px;letter-spacing:0}

  /* ── quiz ── */
  .quiz-top{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}
  .quiz-dots{display:flex;gap:5px}
  .quiz-dots i{width:26px;height:6px;border-radius:99px;background:#EDE6DC;display:block;transition:background .2s}
  .quiz-dots i.now{background:#FFB08A}
  .quiz-dots i.ok{background:var(--ok)}
  .quiz-dots i.no{background:#E58AA0}
  .quiz-pill{font-size:11.5px;font-weight:800;color:#B4631B;background:#FFF1E6;padding:5px 10px;border-radius:999px}
  .qcard{background:#fff;border-radius:22px;padding:18px 16px 16px;box-shadow:var(--shadow);border:1px solid #F7EEE4}
  .qnum{font-size:11.5px;font-weight:800;color:#B7AFA2;letter-spacing:.08em}
  .qtext{font-size:17px;font-weight:800;line-height:1.45;margin:8px 0 16px;letter-spacing:-.02em}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:15px;background:#FAF6F1;
    border:2px solid transparent;font-size:14.5px;font-weight:700;text-align:left;line-height:1.35;color:#3C3450;
  }
  .opt .num{
    width:22px;height:22px;border-radius:50%;background:#fff;color:#9A9184;font-size:11px;font-weight:900;
    display:grid;place-items:center;flex:0 0 auto;border:1.5px solid #E9E0D4;
  }
  .opt.pick{border-color:#B9C6E8;background:#F6F8FF}
  .opt.right{border-color:var(--ok);background:var(--ok-soft);color:#0F6B4C}
  .opt.right .num{background:var(--ok);color:#fff;border-color:var(--ok)}
  .opt.wrong{border-color:#EEA3B3;background:#FFF3F6;color:#A62B49}
  .opt.wrong .num{background:#E5647F;color:#fff;border-color:#E5647F}
  .feedback{margin-top:14px;border-radius:16px;padding:13px 14px;font-size:13px;font-weight:700;line-height:1.5}
  .feedback.ok{background:var(--ok-soft);color:#0F6B4C}
  .feedback.no{background:#FFF4F0;color:#9C4A22}
  .feedback .fb-t{display:block;font-size:14.5px;font-weight:900;margin-bottom:3px}
  .btn-primary{
    width:100%;margin-top:14px;padding:15px;border-radius:16px;font-size:15px;font-weight:900;color:#fff;
    background:linear-gradient(135deg,#FF9A63,#FF6B8A);box-shadow:0 8px 18px rgba(255,107,138,.28);
  }
  .btn-ghost{
    width:100%;margin-top:9px;padding:13px;border-radius:15px;font-size:13.5px;font-weight:800;
    background:#fff;border:1.5px solid #F0E6DA;color:#6B6379;
  }
  .result{text-align:center;padding:6px 4px 2px}
  .result .big{font-size:54px;line-height:1.1}
  .result h3{font-size:20px;margin:8px 0 4px;letter-spacing:-.03em}
  .result p{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px}
  .result .stamps{font-size:26px;letter-spacing:3px;margin:8px 0}

  /* ── board ── */
  .board-sum{display:flex;gap:8px;margin-top:12px}
  .board-sum div{flex:1;background:#fff;border-radius:16px;padding:11px 12px;box-shadow:var(--shadow-sm);border:1px solid #F4ECE2;text-align:center}
  .board-sum b{display:block;font-size:19px;letter-spacing:-.02em}
  .board-sum span{font-size:11px;color:var(--muted);font-weight:700}
  .kid{
    display:flex;align-items:center;gap:11px;background:#fff;border-radius:18px;padding:12px 13px;
    box-shadow:var(--shadow-sm);border:1.5px solid #F4ECE2;margin-top:9px;
  }
  .kid.me{border-color:#FFC9AE;background:linear-gradient(180deg,#FFF8F3,#fff)}
  .kid .k-ava{
    width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:#F8F2E9;flex:0 0 auto;
    position:relative;
  }
  .kid.ok .k-ava{background:var(--ok-soft)}
  .kid .k-body{flex:1;min-width:0}
  .kid .k-name{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:5px;letter-spacing:-.02em}
  .kid .k-name .me-tag{font-size:9.5px;font-weight:800;color:#fff;background:#FF9A63;padding:2px 6px;border-radius:99px}
  .kid .k-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .k-badge{font-size:10px;font-weight:800;padding:2.5px 7px;border-radius:99px;background:#F6F1EA;color:#8A8199}
  .k-badge.b0{background:#FFEDE3;color:#B4551F}
  .k-badge.b1{background:#E8EFFF;color:#2F55BE}
  .k-badge.b2{background:#F3E9FF;color:#7A3FC0}
  .k-badge.b3{background:#FFF4D6;color:#966B00}
  .k-badge.b4{background:#E2F8F1;color:#0E7D5C}
  .kid .k-status{
    font-size:11.5px;font-weight:900;padding:7px 10px;border-radius:12px;flex:0 0 auto;text-align:center;line-height:1.2;
  }
  .kid.ok .k-status{background:var(--ok-soft);color:#0F6B4C}
  .kid .k-status.todo{background:#F7F2EA;color:#A79C8C}
  .note{font-size:11px;color:#A79C8C;font-weight:600;line-height:1.5;margin:12px 2px 0}

  /* ── settings ── */

function bankOf(sub) { return BANKS[sub.id] || []; }
const PER_DAY = { history: 2 };   // 한국사: 한 주제(영상 1편)에서 문제 2개
const HISTORY_START = '2026-11-21';   // 한국사 1번 주제를 시작한 날. 주제는 videos.json 순서(= 시대순)대로 하루에 하나씩 넘어가요   // 하루 문제 수 = 한 영상의 문제 묶음 (나머지 과목은 1)
function videoGroups(sub) {
  const g = new Map();
  bankOf(sub).forEach((it, i) => { const v = String(it.id).split('-q')[0]; if (!g.has(v)) g.set(v, []); g.get(v).push(i); });
  return [...g.values()];
}
function dailyIdxs(sub, d) {
  if (sub.id === 'english') return dailySentIdxs(d);   // 오늘의 문장 3개 = 오늘의 퀴즈 3개
  const per = PER_DAY[sub.id] || 1;
  const groups = videoGroups(sub).filter(g => g.length >= per);
  if (per === 1 || !groups.length) return [rotIndex(sub, d)];
  if (sub.id === 'history') {   // 시대순 차근차근: 시작일부터 주제 1, 2, 3… 순서대로 (끝나면 처음부터), 한 바퀴마다 다른 문제 2개
    const n = Math.max(0, dayNumber(d) - dayNumber(new Date(HISTORY_START + 'T12:00:00+09:00')));
    const g = groups[n % groups.length], round = Math.floor(n / groups.length);
    return Array.from({ length: per }, (_, k) => g[(round + k) % g.length]);
  }
  return groups[(dayNumber(d) + (sub.rot || 0)) % groups.length].slice(0, per);
}
function dailyIndex(sub, d) { return (PER_DAY[sub.id] || 1) > 1 ? dailyIdxs(sub, d)[0] : rotIndex(sub, d); }
function rotIndex(sub, d) {
  const b = bankOf(sub);
  if (!b.length) return 0;
  return (dayNumber(d) + (sub.rot || 0)) % b.length;
}

function dayStamps(pid, day = todayKey()) {
  return SUBJECTS.reduce((n, sub) => n + quizCount(pid, sub.id, day) + speakCount(pid, sub.id, day), 0);
}
function dayQuizStamps(pid, day = todayKey()) {
  return SUBJECTS.reduce((n, sub) => n + quizCount(pid, sub.id, day), 0);
}
function totalStamps(pid) {
  const p = state.progress[pid] || {};
  const days = Object.keys(p);
  const r = remoteStamps[pid] || {};
  Object.keys(r).forEach(d => { if (days.indexOf(d) < 0) days.push(d); });
  let n = 0;
  days.forEach(d => { n += dayStamps(pid, d); });
  return n;
}
function hasStudiedToday(pid) { return dayStamps(pid) > 0; }

/* ── 오늘의 문제 번호·진행률·완료 판정 ──
   완료 = 오늘 내야 할 문제를 전부 맞힘 (수학 10, 한국사 2, 위인·시사 1, 영어 1)
   완료 도장(서버)은 전부 맞혔을 때 한 번만 올리고, 진행 중에는 올리지 않음. */
function mathIdxs(d) { return mathDaily(d).reduce((a, g) => a.concat(g.list), []); }
function dailyQuizIdxs(sub, d) {
  if (sub.id === 'math') return mathIdxs(d);
  if (sub.id === 'english') return dailySentIdxs(d);
  return dailyIdxs(sub, d);
}
function remoteDone(pid, sid, day) {
  const d = remoteStamps[pid]; return !!(d && d[day] && d[day][sid]);
}
function subProgress(sub, pid, day) {
  const p = pid || state.activeId, dd = day || todayKey();
  const idxs = dailyQuizIdxs(sub, dd);
  const rec = (subRec(p, sub.id, dd) || {}).q || {};
  const solved = idxs.filter(qi => rec[qi]).length;
  const complete = remoteDone(p, sub.id, dd) || (idxs.length > 0 && solved >= idxs.length);
  return { solved: solved, total: idxs.length, complete: complete, idxs: idxs };
}
function markSubStamp(sid, pid) {
  const p = pid || state.activeId, day = todayKey();
  if (!SUBJECT_BY_ID[sid]) return false;
  if (remoteDone(p, sid, day)) return false;
  const s = ensureSub(p, sid, day);
  if (s.st) return false;
  s.st = 1; persist(); pushStampFor(p, sid); return true;
}
function checkSubjectComplete(sid) {
  const sub = SUBJECT_BY_ID[sid]; if (!sub) return false;
  if (!subProgress(sub).complete) return false;
  return markSubStamp(sid);
}
function doneSubjectCount(pid) { return SUBJECTS.filter(s => subProgress(s, pid).complete).length; }

function awardQuiz(sid, qi) {
  const s = ensureSub(state.activeId, sid, todayKey());
  if (s.q[qi]) return false;
  s.q[qi] = 1; persist();
  checkSubjectComplete(sid);   // 오늘 문제를 다 맞혔을 때만 서버 완료 도장
  return true;
}
function awardSpeak(sid, si) {
  const s = ensureSub(state.activeId, sid, todayKey());
  if (s.s[si]) return false;
  s.s[si] = 1; persist();
  return true;   // 따라 말하기는 도장판 기록만(영어 완료는 오늘의 문장 퀴즈까지 맞혀야 함)
}

function fx(text, el) {

/* 여러 문제 카드(수학·한국사·영어 공통). 푼 상태는 stamps(q[번호]), 방금 고른 답은 dayPicks */
let dayPicks = {};   // '과목:날짜:번호' → 고른 보기 (화면에서만 기억)
function qCardHTML(sub, qi, label) {
  const rec = (subRec(state.activeId, sub.id) || { q: {} }).q || {};
  const q = sub.quiz[qi], got = !!rec[qi];
  const picked = dayPicks[sub.id + ':' + todayKey() + ':' + qi];
  const show = picked != null || got;
  let h = '<div class="qcard"><div class="qnum">' + label + (got ? ' · 🏅' : '') + '</div>' +
    '<div class="qtext">' + esc(q.q) + '</div><div class="opts">' + q.opts.map((o, i) => {
      const cls = show ? (i === q.ans ? 'right' : (i === picked ? 'wrong' : '')) : '';
      return '<button class="opt ' + cls + '" data-action="day-answer" data-sid="' + sub.id + '" data-qi="' + qi + '" data-i="' + i + '"' + (show ? ' disabled' : '') + '>' +
        '<span class="num">' + (i + 1) + '</span><span>' + esc(o) + '</span></button>';
    }).join('') + '</div>';
  if (picked != null) {
    const ok = picked === q.ans;
    const doneNow = ok && subProgress(sub).complete;
    h += '<div class="feedback ' + (ok ? 'ok' : 'no') + '"><span class="fb-t">' +
      (ok ? (doneNow ? '정답이야! 🏅 오늘 완료!' : '정답이야! 👏') : '아쉬워! 정답은 "' + esc(q.opts[q.ans]) + '"') + '</span>' + esc(q.why) + '</div>' +
      (ok ? '' : '<button class="btn-primary" data-action="day-retry" data-sid="' + sub.id + '" data-qi="' + qi + '">🔁 한 번 더 풀기</button>');
  } else if (got) {
    h += '<div class="feedback ok"><span class="fb-t">이미 푼 문제예요 🏅</span>' + esc(q.why) + '</div>';
  }
  return h + '</div>';
}
function solvedCount(sub, idxs) {
  const rec = (subRec(state.activeId, sub.id) || { q: {} }).q || {};
  return idxs.filter(qi => rec[qi]).length;
}

function mathTodayHTML(sub) {
  const sets = mathDaily();
  const all = sets.reduce((a, g) => a.concat(g.list), []);
  let h = '<div class="keyline" style="--soft:' + sub.soft + ';--deep:' + sub.deep + ';--line2:' + sub.color + '33">' +
    '<span class="k-label">오늘의 핵심 한 줄</span>' + esc(sub.keyline) + '</div>' +
    '<div class="sec-head"><h3>🧮 오늘의 수학 ' + all.length + '문제</h3><span class="more">' + solvedCount(sub, all) + '/' + all.length + ' 맞힘</span></div>';
  let no = 0;
  sets.forEach(g => {
    h += '<div class="sec-head"><h3>' + (g.kind === '연산' ? '➕ ' : g.kind === '사고력' ? '🧠 ' : '✏️ ') + g.kind + ' ' + g.list.length + '문제</h3></div>';
    g.list.forEach(qi => { no++; h += qCardHTML(sub, qi, g.kind + ' ' + no + '번'); });
  });
  return h + '<p class="note">문제는 매일 새로 바뀌어요. 틀려도 괜찮아요, 풀이를 읽고 다시 풀어 봐요 😊</p>';
}

/* 영상 1편 + 그 영상 내용 문제 여러 개 (한국사·영어) */
function videoDayHTML(sub) {
  const idxs = dailyIdxs(sub), items = idxs.map(i => sub.quiz[i]);

    '<span class="k-label">오늘의 핵심 한 줄</span>' + esc(first.key) + '</div>';
  if (sub.id === 'english') h += todaySentenceHTML();
  if (first.video) {
    h += '<div class="sec-head"><h3>🎬 오늘의 영상</h3><span class="more">먼저 보고 문제를 풀어요</span></div>' +
      videoCardHTML(first.video, got > 0, 'today-video') + '<p class="note">' + esc(first.video.summary || '') + '</p>';
  }
  h += '<div class="sec-head"><h3>🎯 ' + (first.video ? '영상 내용 퀴즈 ' : '오늘 문장 뜻 퀴즈 ') + idxs.length + '개</h3><span class="more">' + got + '/' + idxs.length + ' 맞힘</span></div>';

  return h + '<button class="btn-ghost" data-action="subtab" data-tab="review" style="margin-top:14px">🔁 지난 문제 전체 복습 (' + sub.quiz.length + '개)</button>';
}

function videoListHTML(sub) {
  const seen = {};
  const b = bankOf(sub).filter(it => (seen[it.id.replace(/-q\d+$/, '')] ? false : (seen[it.id.replace(/-q\d+$/, '')] = 1)));
  if (!b.length) return '<p class="note">아직 검증된 영상이 없어요.</p>';
  return '<div class="yt-list">' + b.map(it =>
    '<a class="yt" href="' + it.url + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="yt-ico">▶️</span>' +
      '<span class="yt-t">' + esc(it.title) + '<span class="yt-d">' + esc(it.ch) + ' · ' + it.dur_label + '</span></span>' +
      '<span class="yt-go">↗</span></a>'
  ).join('') + '</div>';
}

function ytListHTML(sub) {
  return sub.links.map(y => {
    const url = y.url ? y.url : yt(y.q);
    const isSite = !!y.url;
    return '<a class="yt' + (isSite ? ' site' : '') + '" href="' + url + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="yt-ico">' + (isSite ? '🌐' : '▶️') + '</span>' +
      '<span class="yt-t">' + esc(y.label) + (y.d ? '<span class="yt-d">' + esc(y.d) + '</span>' : '') + '</span>' +
      '<span class="yt-go">↗</span></a>';
  }).join('');
}

/* ── 영어 파트 ── */
function currentStepSentences() {
  if (engStep === 'all') return ALL_SENTENCES;
  return ENGLISH_STEPS[engStep].sentences.map((s, i) => ({ ...s, idx: engStep * 5 + i }));
}

    '<div class="seg-rate" role="group" aria-label="재생 속도">' +

      '<button class="' + (rate === 1 ? 'on' : '') + '" data-action="rate" data-rate="1">🔊 보통 1.0x</button>' +

    '🎤 따라 말하기는 목소리 인식을 지원하는 브라우저에서는 실제 발음을 확인하고, ' +
    '지원하지 않으면 3초 타이머로 도장을 받아요.</div>';

/* ── 퀴즈 파트 ── */
function quizHTML(sub) {
  const total = sub.quiz.length;
  const myQuiz = quizCount(state.activeId, sub.id);
  let h = '<div class="quiz-top">' +
    '<div class="quiz-dots">' + sub.quiz.map((_, i) => {
      const rec = (subRec(state.activeId, sub.id) || { q: {} }).q || {};
      const cls = rec[i] ? 'ok' : (i === quiz.i ? 'now' : '');
      return '<i class="' + cls + '"></i>';
    }).join('') + '</div>' +
    '<span class="quiz-pill">오늘 🏅 ' + myQuiz + '/' + total + '</span>' +
  '</div>';

  if (quiz.i >= total) {
    const right = sub.quiz.reduce((n, _, i) => {
      const rec = (subRec(state.activeId, sub.id) || { q: {} }).q || {};
      return n + (rec[i] ? 1 : 0);
    }, 0);
    h += '<div class="qcard"><div class="result">' +
      '<div class="big">' + (right === total ? '🏆' : right > 0 ? '🎉' : '🌱') + '</div>' +
      '<h3>' + total + '문제 중 ' + right + '개 정답!</h3>' +
      '<p>' + (right === total ? '완벽해요! 오늘 ' + sub.name + ' 도장 ' + total + '개를 모두 모았어요.' :
            right > 0 ? '도장 ' + right + '개를 받았어요. 한 번 더 풀면 더 잘할 수 있어요!' :
            '괜찮아요. 배우기 탭을 한 번 읽고 다시 도전해 봐요!') + '</p>' +
      '<div class="stamps">' + '🏅'.repeat(Math.max(right, 0)) + '</div>' +
      '<button class="btn-primary" data-action="retry-quiz">🔁 다시 풀기</button>' +
      '<button class="btn-ghost" data-action="subtab" data-tab="learn">📚 배우기로 돌아가기</button>' +
    '</div></div>';
    return h;
  }

  const q = sub.quiz[quiz.i];
  h += '<div class="qcard">' +
    '<div class="qnum">Q' + (quiz.i + 1) + ' / ' + total + '</div>' +
    '<div class="qtext">' + esc(q.q) + '</div>' +
    '<div class="opts">' + q.opts.map((o, i) => {
      let cls = '';
      if (quiz.picked !== null) {
        if (i === q.ans) cls = 'right';
        else if (i === quiz.picked) cls = 'wrong';
      }
      return '<button class="opt ' + cls + '" data-action="answer" data-i="' + i + '"' + (quiz.picked !== null ? ' disabled' : '') + '>' +
        '<span class="num">' + (i + 1) + '</span><span>' + esc(o) + '</span></button>';
    }).join('') + '</div>';

  if (quiz.picked !== null) {
    const ok = quiz.picked === q.ans;
    h += '<div class="feedback ' + (ok ? 'ok' : 'no') + '">' +
      '<span class="fb-t">' + (ok ? '정답이야! 🏅 도장 +1' : '아쉬워! 정답은 "' + esc(q.opts[q.ans]) + '"') + '</span>' +
      esc(q.why) + '</div>' +
      '<button class="btn-primary" data-action="next-q">' + (quiz.i + 1 >= total ? '결과 보기 →' : '다음 문제 →') + '</button>';
  }
  h += '</div>';
  return h;
}

/* ─────────────────────────── 10. 렌더: 도장판 ─────────────────────────── */

function renderBoard() {
  const done = state.profiles.filter(p => hasStudiedToday(p.id)).length;
  const rows = state.profiles.map(p => {
    const on = p.id === state.activeId;
    const isDone = hasStudiedToday(p.id);
    const badges = !on ? '' : SUBJECTS.map((sub, i) => {
      const q = quizCount(p.id, sub.id);
      const sp = speakCount(p.id, sub.id);
      if (!q && !sp) return '';
      const txt = sub.name + ' ' + q + (sp ? '·🎤' + sp : '');
      return '<span class="k-badge b' + i + '">' + txt + '</span>';
    }).join('');
    return '<div class="kid ' + (on ? 'me ' : '') + (isDone ? 'ok' : '') + '">' +
      '<span class="k-ava">' + p.emoji + '</span>' +
      '<span class="k-body">' +
        '<span class="k-name">' + esc(p.name) + (on ? '<span class="me-tag">나</span>' : '') + '</span>' +
        '<span class="k-badges">' + (on ? (badges || '<span class="k-badge">오늘 도장 0개</span>') : '<span class="k-badge">' + (isDone ? '오늘 공부했어요' : '아직 공부 전이에요') + '</span>') + '</span>' +
      '</span>' +

    '</div>';
  }).join('');

  $('#view-board').innerHTML =
    '<h2 class="page-title">🏅 우리 반 오늘 공부 도장판</h2>' +
    '<p class="page-sub">' + dateLabel() + ' · 도장 1개 이상이면 오늘 공부 완료!</p>' +
    '<div class="board-sum">' +
      '<div><b>' + done + '명</b><span>공부 완료</span></div>' +
      '<div><b>' + (5 - done) + '명</b><span>아직</span></div>' +
      '<div><b>' + totalStamps(state.activeId) + '개</b><span>내 누적 도장</span></div>' +
    '</div>' +
    rows +
    '<button class="btn-primary" data-action="copy-board">📋 엄마들 단톡방에 오늘 현황 복사</button>' +
    '<p class="note">' + (syncStatus === 'ok'
      ? '🔗 친구들 폰과 실시간으로 나눠요 · 방 ' + esc(roomId)
      : (syncStatus === 'off'
        ? '📴 오프라인 — 이 폰에만 저장 중이에요. 연결되면 자동으로 올라가요.'
        : (syncStatus === 'pending'
          ? '📴 이 폰에만 먼저 저장 중이에요. 친구들 폰과 연결되면 자동으로 올라가요.'
          : '🔄 친구들 폰과 연결하는 중이에요…'))) + '</p>';
  renderTopbar();
}

function boardText() {
  const total = state.profiles.reduce((n, p) => n + dayStamps(p.id), 0);
  const doneList = state.profiles.filter(p => hasStudiedToday(p.id));
  const todoList = state.profiles.filter(p => !hasStudiedToday(p.id));

  let t = '📚 우리 반 오늘 공부 도장판\n' + dateLabel() + ' · 도장 ' + total + '개\n';

  t += '\n✅ 공부 완료 (' + doneList.length + '명)\n';
  if (doneList.length) {
    doneList.forEach(p => {
      const parts = SUBJECTS.map(sub => {
        const q = quizCount(p.id, sub.id);
        return q ? sub.name + q : '';
      }).filter(Boolean);
      t += '· ' + p.name + ' ' + p.emoji + ' — 도장 ' + dayStamps(p.id) + '개' + (parts.length ? ' (' + parts.join(', ') + ')' : '') + '\n';
    });
  } else {
    t += '· 아직 없어요\n';
  }

  t += '\n⬜ 아직 (' + todoList.length + '명)\n';
  if (todoList.length) {
    todoList.forEach(p => { t += '· ' + p.name + ' ' + p.emoji + '\n'; });
  } else {
    t += '· 없어요 — 우리 반 전원 완료! 🎉\n';
  }

  t += '\n오늘도 재밌게 공부했어요! 🎉';
  return t;
}

async function copyBoard(btn) {
  const text = boardText();
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (e) { ok = false; }

  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
      ta.remove();
    } catch (e) { ok = false; }
  }

  if (ok) {
    if (btn) fx('📋 복사!', btn);
    toast('복사했어요! 단톡방에 붙여넣기 하세요 📋');

    showManualCopy(text);
  }
}

function joinSubmit() {
  const input = $('#joinName');
  const err = $('#joinErr');
  const name = (input ? input.value : '').trim().replace(/\s+/g, ' ');
  const len = Array.from(name).length;
  if (!len) { if (err) err.textContent = '이름(별명)을 적어 줘!'; if (input) input.focus(); return; }
  if (len > 8) { if (err) err.textContent = '이름은 8글자까지 쓸 수 있어요.'; return; }
  const dup = state.profiles.some(p => p.id !== state.profiles[joinSlot].id && p.name && p.name.trim() === name);
  if (dup) { if (err) err.textContent = '「' + name + '」는 이미 친구가 쓰고 있어. 다른 이름으로 해 줘!'; return; }
  if (!joinPick) { if (err) err.textContent = '동물 친구를 하나 골라 줘!'; return; }
  const slotP = state.profiles[joinSlot], slotDef = DEFAULT_PROFILES[joinSlot];
  if (!isPlaceholderName(slotP.name) && slotP.name !== slotDef.name && slotP.name !== name) {
    if (err) err.textContent = '이 자리는 이미 「' + slotP.name + '」가 쓰고 있어. 내 초대 링크가 맞는지 확인해 줘!'; return;
  }
  const used = state.profiles.filter(p => p.id !== state.profiles[joinSlot].id).map(p => p.emoji);
  if (used.indexOf(joinPick) >= 0) { if (err) err.textContent = '그 동물은 다른 친구가 쓰고 있어. 다른 동물로 골라 줘!'; return; }

  const p = state.profiles[joinSlot];
  p.name = name;
  p.emoji = joinPick;
  state.activeId = p.id;
  state.joined = true;   // 이 폰은 이제 이 자리 전용
  persist();
  pushProfile(joinSlot);
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  welcomeName = name;
  showView('home');
  toast(name + '야, 반가워! 🎉');
}

/* ─────────────────────────── 13. 음성: TTS ─────────────────────────── */

const ttsOK = typeof window !== 'undefined' && 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let cachedVoices = [];

function refreshVoices() {
  if (!ttsOK) return;
  try { cachedVoices = window.speechSynthesis.getVoices() || []; } catch (e) { cachedVoices = []; }
}
if (ttsOK) {
  refreshVoices();
  try { window.speechSynthesis.addEventListener('voiceschanged', refreshVoices); } catch (e) {}
}

function pickKoVoice() {
  if (!cachedVoices.length) refreshVoices();
  const list = cachedVoices;
  if (!list.length) return null;
  return list.find(v => /^ko[-_]KR/i.test(v.lang) && /female|yuna|sora|google|지연/i.test(v.name)) ||
         list.find(v => /^ko[-_]KR/i.test(v.lang)) ||
         list.find(v => /^ko/i.test(v.lang)) || null;
}

/* 오늘의 읽기 글 낭독 (한국어) */
function readEssay(btn) {
  const sub = SUBJECT_BY_ID[(btn && btn.dataset.sid) || currentSubjectId];
  if (!sub) return;
  const idxs = dailyIdxs(sub);
  const item = sub.quiz[idxs[0]];
  if (!item || !item.essay) { toast('읽을 글이 아직 없어요'); return; }
  if (!ttsOK) { toast('이 브라우저는 소리 읽기를 지원하지 않아요 😢'); return; }
  stopSpeech();
  const text = String(item.essay).split('\n\n').filter(Boolean).join(' ');
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 0.9;
    u.pitch = 1.03;
    const v = pickKoVoice();
    if (v) u.voice = v;
    u.onend = markReadOff;
    u.onerror = markReadOff;
    window.speechSynthesis.speak(u);
    markReadOn();
    toast('읽어 줄게요. 눈으로 따라 읽어 봐요 📖');
  } catch (e) { toast('소리 읽기를 시작하지 못했어요'); }
}
function markReadOn() {
  const b = $('#view-subject [data-action="read-essay"]');
  if (b) { b.classList.add('on'); b.textContent = '🔊 읽는 중…'; }
  const s = $('#view-subject [data-action="stop-read"]');
  if (s) s.classList.add('on');
}
function markReadOff() {
  const b = $('#view-subject [data-action="read-essay"]');
  if (b) { b.classList.remove('on'); b.textContent = '🔊 읽어주기'; }
  const s = $('#view-subject [data-action="stop-read"]');
  if (s) s.classList.remove('on');
}

function pickEnVoice() {
  if (!cachedVoices.length) refreshVoices();
  const list = cachedVoices;
  if (!list.length) return null;
  return list.find(v => /^en[-_]US/i.test(v.lang) && /female|samantha|zira|google us/i.test(v.name)) ||
         list.find(v => /^en[-_]US/i.test(v.lang)) ||
         list.find(v => /^en[-_]GB/i.test(v.lang)) ||
         list.find(v => /^en/i.test(v.lang)) || null;
}

function speakText(text, rate, onDone) {
  if (!ttsOK) {
    toast('이 브라우저는 소리 읽기를 지원하지 않아요 😢');
    if (onDone) onDone();
    return;
  }
  try { window.speechSynthesis.cancel(); } catch (e) {}
  let done = false;
  const finish = () => { if (!done) { done = true; if (onDone) onDone(); } };
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate;
    u.pitch = 1.05;
    const v = pickEnVoice();
    if (v) u.voice = v;
    u.onend = finish;
    u.onerror = finish;
    window.speechSynthesis.speak(u);
    // 일부 브라우저에서 onend가 오지 않는 경우를 대비한 안전장치
    setTimeout(() => { if (!done && !window.speechSynthesis.speaking) finish(); }, Math.max(2500, text.length * 220));
  } catch (e) {
    finish();
  }
}

function stopSpeech() {
  playToken++;
  clearPlaying();
  if (ttsOK) { try { window.speechSynthesis.cancel(); } catch (e) {} }
}

function clearPlaying() {
  document.querySelectorAll('.sent.playing').forEach(el => el.classList.remove('playing'));
}

function markPlaying(idx) {
  clearPlaying();
  const el = document.querySelector('.sent[data-sent="' + idx + '"]');
  if (el) {
    el.classList.add('playing');
    const r = el.getBoundingClientRect();
    if (r.top < 70 || r.bottom > innerHeight - 90) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function playSequence(indices, rate) {
  stopSpeech();
  const token = ++playToken;
  const go = (k) => {
    if (token !== playToken) return;
    if (k >= indices.length) { clearPlaying(); return; }
    const idx = indices[k];
    const s = ALL_SENTENCES[idx];
    markPlaying(idx);
    speakText(s.en, rate, () => {
      if (token !== playToken) return;
      setTimeout(() => go(k + 1), 260);
    });
  };
  go(0);
}

function speakOne(idx, rateOverride) {
  stopSpeech();
  const s = ALL_SENTENCES[idx];
  if (!s) return;
  const rate = rateOverride || state.settings.rate || 1;
  markPlaying(idx);
  speakText(s.en, rate, () => { setTimeout(clearPlaying, 350); });
}

/* ─────────────────────────── 14. 음성: 따라 읽기 ─────────────────────────── */

const SR = (typeof window !== 'undefined') && (window.SpeechRecognition || window.webkitSpeechRecognition);
const srSupported = !!SR;

function practicePanel(idx) {
  return document.querySelector('.sent[data-sent="' + idx + '"] .practice');
}

function closePractice() {
  practice.ended = true;
  if (practice.rec) { try { practice.rec.abort(); } catch (e) {} practice.rec = null; }
  if (practice.timer) { clearInterval(practice.timer); practice.timer = null; }
  practice.idx = null; practice.listening = false; practice.ended = false;
  document.querySelectorAll('.practice').forEach(p => { p.hidden = true; p.innerHTML = ''; });
}

function openPractice(idx) {
  const card = document.querySelector('.sent[data-sent="' + idx + '"]');
  if (!card) return;
  const already = !!(subRec(state.activeId, 'english', todayKey()) || {}).s?.[idx];
  const panel = card.querySelector('.practice');

  // 다른 패널 닫기
  if (practice.idx !== idx) {
    closePractice();
  }
  stopSpeech();
  practice.idx = idx;
  practice.ended = false;
  panel.hidden = false;

  if (already) {
    panel.innerHTML = '<div class="p-t">🏅 오늘 이미 도장을 받았어요</div>' +
      '<div class="p-d">한 번 더 따라 말해 보면 입에 더 잘 붙어요!</div>' +
      '<div class="p-btns"><button class="primary" data-action="practice-again" data-idx="' + idx + '">🎤 한 번 더 해보기</button></div>';
    return;
  }

  if (srSupported) {
    startListening(idx, panel);
  } else {
    startCountdown(idx, panel);
  }
}

function startCountdown(idx, panel) {
  if (practice.timer) { clearTimeout(practice.timer); practice.timer = null; }
  practice.listening = false;
  let n = 3;
  const draw = () => {
    panel.innerHTML = '<div class="p-t">🎤 3초 동안 크게 따라 말해 보세요</div>' +
      '<div class="countdown">' + n + '<small>또박또박, 입 밖으로!</small></div>' +
      '<div class="p-btns"><button class="primary" data-action="give-stamp" data-idx="' + idx + '">🎤 따라 읽었어요! 도장 받기</button></div>';
  };
  draw();
  practice.timer = setInterval(() => {
    n--;
    if (n > 0) { draw(); return; }
    clearInterval(practice.timer); practice.timer = null;
    panel.innerHTML = '<div class="p-t">잘 했어요! 👏</div>' +
      '<div class="p-d">이 브라우저는 목소리 알아듣기를 지원하지 않아서, 스스로 확인하고 도장을 받아요.</div>' +
      '<div class="p-btns"><button class="primary" data-action="give-stamp" data-idx="' + idx + '">🎤 따라 읽었어요! 도장 받기</button>' +
      '<button data-action="practice-again" data-idx="' + idx + '">🔁 다시</button></div>';
  }, 1000);
}

function startListening(idx, panel) {
  let rec;
  try { rec = new SR(); } catch (e) { startCountdown(idx, panel); return; }
  practice.rec = rec;
  practice.listening = true;
  practice.ended = false;
  let transcript = '';

  rec.lang = 'en-US';
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 1;

  panel.innerHTML = '<div class="p-t">🎤 듣고 있어요… 영어로 말해 보세요</div>' +
    '<div class="p-d">또박또박, ' + esc(ALL_SENTENCES[idx].en) + '</div>' +
    '<div class="live" id="liveBox">…</div>' +
    '<div class="p-btns"><button data-action="practice-stop" data-idx="' + idx + '">⏹ 그만</button></div>';

  const liveBox = panel.querySelector('#liveBox');

  rec.onresult = (e) => {
    let t = '';
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript + ' ';
    transcript = t.trim();
    if (liveBox && transcript) liveBox.textContent = '👂 ' + transcript;
  };
  rec.onerror = (e) => {
    if (practice.ended) return;
    practice.ended = true;
    practice.listening = false;
    // 마이크 거부·인식 실패 → 타이머 폴백
    const msg = (e && (e.error === 'not-allowed' || e.error === 'service-not-allowed'))
      ? '마이크를 쓸 수 없어서 3초 타이머로 바꿀게요'
      : '목소리를 잘 못 들었어요. 3초 타이머로 바꿀게요';
    toast(msg);
    startCountdown(idx, panel);
  };
  rec.onend = () => {
    if (practice.ended) return;
    practice.ended = true;
    practice.listening = false;
    evaluateSpeech(idx, transcript, panel);
  };

  try { rec.start(); } catch (e) {
    practice.ended = true;
    startCountdown(idx, panel);
    return;
  }

  // 안전장치: 7초 안에 아무 반응이 없으면(마이크 없음·인식 멈춤) 타이머 모드로
  if (practice.timer) clearTimeout(practice.timer);
  practice.timer = setTimeout(() => {
    if (practice.ended || practice.idx !== idx) return;
    ringStop(rec);
    if (!transcript.trim()) {
      practice.ended = true;
      practice.listening = false;
      startCountdown(idx, panel);
    }
  }, 7000);
}

function ringStop(rec) {
  try { rec.stop(); } catch (e) { try { rec.abort(); } catch (e2) {} }
}

function words(s) {
  return String(s || '').toLowerCase().replace(/[^a-z' ]/g, ' ').split(/\s+/).filter(Boolean);
}
function similarity(target, heard) {
  const t = words(target), h = words(heard);
  if (!t.length) return 0;
  if (!h.length) return 0;
  let hit = 0;
  t.forEach(w => {
    if (h.some(x => x === w || (w.length >= 4 && (x.indexOf(w.slice(0, 4)) === 0 || w.indexOf(x.slice(0, 4)) === 0)))) hit++;
  });
  return hit / t.length;
}

function evaluateSpeech(idx, transcript, panel) {
  if (practice.timer) { clearTimeout(practice.timer); practice.timer = null; }
  const target = ALL_SENTENCES[idx].en;
  const score = similarity(target, transcript);
  const good = score >= 0.6;
  const heard = transcript ? '<div class="live">👂 ' + esc(transcript) + '</div>' : '<div class="live">👂 (잘 안 들렸어요)</div>';
  panel.innerHTML =
    '<div class="p-t">' + (good ? '잘했어요! 🎉' : (transcript ? '거의 다 왔어요!' : '한 번 더 해볼까요?')) + '</div>' +
    heard +
    '<div class="p-d" style="margin-top:7px">' + (good
      ? '발음이 잘 들렸어요. 도장을 받아요!'
      : '천천히 듣고 다시 말해 보세요. 그래도 도장은 받을 수 있어요.') + '</div>' +
    '<div class="p-btns">' +
      '<button class="primary" data-action="give-stamp" data-idx="' + idx + '">🏅 도장 받기</button>' +
      '<button data-action="practice-again" data-idx="' + idx + '">🔁 다시 말하기</button>' +
    '</div>';
}

  if (card) card.classList.add('done');

}

function mergeLoaded(loaded) {
  if (!loaded) return;
  if (Array.isArray(loaded.profiles) && loaded.profiles.length === 5) {
    state.profiles = loaded.profiles.map((p, i) => ({
      id: p.id || DEFAULT_PROFILES[i].id,
      name: (p.name || DEFAULT_PROFILES[i].name).slice(0, 8),
      emoji: p.emoji || DEFAULT_PROFILES[i].emoji
    }));
  }
  if (loaded.activeId && state.profiles.some(p => p.id === loaded.activeId)) state.activeId = loaded.activeId;
  if (loaded.joined) state.joined = true;
  if (loaded.progress && typeof loaded.progress === 'object') state.progress = loaded.progress;
  if (loaded.settings && typeof loaded.settings === 'object') {
    state.settings.rate = loaded.settings.rate === 0.8 ? 0.8 : 1;
  }
  if (loaded.syncMeta && typeof loaded.syncMeta === 'object') state.syncMeta = loaded.syncMeta;
}

async function init() {
  const m = /[?&]d=(\d{4}-\d{2}-\d{2})/.exec(location.search);
  if (m) DAY_OVERRIDE = m[1];
  roomId = readRoom();

  const loaded = await SyncAdapter.load();
  mergeLoaded(loaded);

  // 찬우 기본 캐릭터를 🐍로 (예전에 쓰던 기기도 한 번만 바꿔요 — 그 뒤에 고른 값은 그대로 둠)
  try {
    if (!localStorage.getItem('kidsStudyApp.snake.v1')) {
      const p1 = state.profiles[0];
      if (p1 && p1.name === '찬우' && p1.emoji === '🦁') {
        p1.emoji = '🐍';
        try { await SyncAdapter.save(state); } catch (e2) {}
      }
      localStorage.setItem('kidsStudyApp.snake.v1', '1');
    }
  } catch (e) {}

  // PWA 연결은 http(s)에서만 (파일로 열 때 오류 없이 동작하도록)
  if (/^https?:$/.test(location.protocol)) {
    try {
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = './manifest.webmanifest';
      document.head.appendChild(link);
    } catch (e) {}
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  }

  // 이 폰이 누구 것인지 확정: 예전부터 쓰던 폰(도장이 있거나 이름을 정함)은 그대로 인정
  if (!state.joined) {
    const me = activeProfile(), def = DEFAULT_PROFILES.find(d => d.id === me.id);
    if (totalStamps(me.id) > 0 || (def && me.name !== def.name)) state.joined = true;
  }
  if (state.joined) { try { history.replaceState(null, '', location.pathname); } catch (e) {} showView('home'); }   // 이미 내 자리가 있으면 다른 초대 링크는 무시
  else startJoin();

  // 친구들 폰과 실시간 공유 시작 (4초 폴링 + 화면 복귀·온라인 시 즉시)
  syncStart();
}

  day: function () { return { dayNumber: dayNumber(), key: todayKey(), label: dateLabel(), idx: SUBJECTS.map(function (s) { return s.id + ':' + dailyIndex(s); }) }; },
  invite: function (slot) { return inviteMessage(slot); },
  sync: function () { return { room: roomId, status: syncStatus, error: syncError, queue: syncQueue.length, lastSyncAt: lastSyncAt, remote: remoteStamps }; },
  syncNow: function () { return syncPull('force'); },
  videos: function () {
    const out = {};
    SUBJECTS.forEach(function (s) {
      const seen = {};
      out[s.id] = bankOf(s).filter(function (it) { const k = String(it.id).replace(/-q\d+$/, ''); if (seen[k]) return false; seen[k] = 1; return true; })
        .map(function (it) { return { id: it.id, title: it.title, dur: it.dur_label, ch: it.ch }; });
    });
    return out;
  },
  progress: function () { return SUBJECTS.map(function (s) { return { id: s.id, p: subProgress(s) }; }); },
  state: function () { return { activeId: state.activeId, profiles: state.profiles, errs: window.__errs, sync: syncStatus }; }
};

init();
</script>
